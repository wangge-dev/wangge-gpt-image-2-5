认的品牌文字；布景反光可以变化，但不要重新设计商品。只呈现参考图或资料中有依据的商品细节，不补造配件和性能。\n\n图1商品的关键部位清楚，人物出现时依图2保持成年模特身份及真实穿戴关系；动作自然，不添加科技结构或性能结论。 顶部标题“{{标题}}”，底部“{{副标题}}”，各一次。\n\n取消人物，只保留商品以动态角度悬浮，背景速度线在商品后方，商品形状不拉伸。\n\n输出一张完整图片。", "运动员动态 · athlete-action": "图1是实际商品参考。商品信息：{{商品信息}}。保留图1中的外形比例、结构、颜色、材质、包装图案和可辨认的品牌文字；布景反光可以变化，但不要重新设计商品。只呈现参考图或资料中有依据的商品细节，不补造配件和性能。\n\n图1商品的关键部位清楚，人物出现时依图2保持成年模特身份及真实穿戴关系；动作自然，不添加科技结构或性能结论。 顶部标题“{{标题}}”，底部“{{副标题}}”，各一次。\n\n改为运动场灯光背景，人物正处于自然运动动作，轻微眩光不遮住商品。\n\n输出一张完整图片。", "三联画 · triptych": "图1是实际商品参考。商品信息：{{商品信息}}。保留图1中的外形比例、结构、颜色、材质、包装图案和可辨认的品牌文字；布景反光可以变化，但不要重新设计商品。只呈现参考图或资料中有依据的商品细节，不补造配件和性能。\n\n图1商品的关键部位清楚，人物出现时依图2保持成年模特身份及真实穿戴关系；动作自然，不添加科技结构或性能结论。 底部统一排标题“{{标题}}”和副标题“{{副标题}}”，各一次。\n\n改为三条竖向分栏：左商品细节，中人物动作，右商品主视觉；底部统一放给定标题与副标题，不重复三次。\n\n输出一张完整图片。", "健身力量感 · gym-power": "图1是实际商品参考。商品信息：{{商品信息}}。保留图1中的外形比例、结构、颜色、材质、包装图案和可辨认的品牌文字；布景反光可以变化，但不要重新设计商品。只呈现参考图或资料中有依据的商品细节，不补造配件和性能。\n\n图1商品的关键部位清楚，人物出现时依图2保持成年模特身份及真实穿戴关系；动作自然，不添加科技结构或性能结论。 顶部标题“{{标题}}”，底部“{{副标题}}”，各一次。\n\n人物坐在夸张比例的健身器械布景上，器械斜向摆放形成视觉张力；商品和人体比例保持真实，夸张只作用于布景。\n\n输出一张完整图片。"}, "edit": "以上一轮结果为底图，重新附所需原始参考。本轮只修改运动画面的{{姿态部位}}：改为{{合理动作}}，保留人物身份、商品结构及海报标题。只输出这一张修改后的图。", "adaptation": ["保留运动广告与三联画构思，将大牌风格名改成具体视觉语言，补人物与商品参考分工。", "2026-09-13：补齐具体素材分工和无占位符直接复制示例，保留变量模板、完整变体、修改指令与来源。"], "sources": [{"label": "buluslan/gpt-image2-ecommerce · 25-sports-campaign.json · 原 Image 2 模板", "url": "https://github.com/buluslan/gpt-image2-ecommerce/blob/a3673fb6f316664280e6abd90a60a578c6fb2228/references/templates/25-sports-campaign.json"}], "source_key": "25-sports-campaign.json", "source_variant_keys": ["product-hero", "athlete-action", "triptych", "gym-power"], "variants_format": "complete", "example_inputs": "图1：黑色运动鞋的正面与侧面均清楚的商品照；图2：获准使用的成年运动模特全身照。示例标题是练习文案，正式使用前替换成自有文案。", "example": "图1是实际黑色运动鞋商品照，图2是获准使用的成年运动模特全身照。制作一张4:5竖版运动商业海报：保持图2人物面部、体型和身份，人物做自然的起跑动作，双脚与地面接触可信；双脚穿着图1同款运动鞋，保留鞋型、鞋底厚度、鞋带结构、实际黑色和原有标志，不拉伸鞋身，不添加发光科技结构。采用斜向构图、深灰摄影棚背景和轻微反光地面，侧后方轮廓光表现动作，鞋子关键部位清楚。顶部只写一次“MOVE YOUR WAY”，底部只写一次“按自己的节奏出发”，除此不加文字、性能结论和水印。只输出一张完整海报。", "usage tle": "鞋靴鞋面与鞋底结构卡", "category": "鞋靴", "group": "ecommerce", "kind": "本库原创设计", "use": "把同一双鞋的整体、鞋面、鞋底纹路和准确规格组织成可核对结构卡。", "size": "1536x1920", "inputs": "图1：单只鞋外侧完整照；图2：内侧照；图3：鞋面与走线近照；图4：完整鞋底正对照片；另提供已确认尺码或重量。不得从外侧图推测鞋底纹路。", "variables": {"鞋款身份": "灰白低帮系带运动鞋", "准确规格": "样品尺码42码；单只重量以资料为准", "标题": "结构细节", "配色": "浅灰、白色、深蓝点缀"}, "prompt": "依据图1至图4制作一张4:5鞋靴结构卡，商品为{{鞋款身份}}。上半部展示图1外侧三分之四视图，保持鞋楦、鞋头、鞋口、鞋带孔数量、中底厚度和各色块边界。下半部三栏依次展示：图2“内侧”、图3“鞋面走线”、图4“鞋底纹路”；每栏只使用指定参考，不镜像外侧、不生成看不见的纹路。标题只写“{{标题}}”，规格区只写{{准确规格}}中的已确认内容。采用{{配色}}、白底、柔和侧光和细分隔线。不要增加气垫、碳板、防水、增高、防滑等级、科技名称、品牌标志或第二只鞋。只输出一张图。", "example": "依据图1至图4制作4:5灰白低帮系带运动鞋结构卡。上半部展示图1外侧三分之四视图，保持鞋楦、鞋头、鞋口、6组鞋带孔、中底厚度和灰白色块。下半部三栏分别使用图2内侧、图3鞋面走线、图4鞋底纹路，标签只写“内侧”“鞋面走线”“鞋底纹路”。标题只写“结构细节”，规格只写“样品尺码42码”。浅灰白底、深蓝点缀和柔和侧光。不要增加气垫、碳板、防水、防滑等级、科技名称、品牌或第二只鞋。只输出一张图。", "example_inputs": "准备同一只鞋的外侧、内侧、鞋面近照和完整鞋底照；示例的鞋带孔和尺码必须与实物一致。", "edit": "只修正{{指定栏位}}的{{结构或文字错误}}，按图{{参考图号}}恢复；其他栏位、鞋款身份、配色和标题不变。", "variants": {}, "variants_format": "complete", "usage_note": "鞋底纹路、材料科技和功能等级必须有实拍或资料依据。左右鞋若结构不同，应分别提供参考。", "adaptation": ["依据2.5多参考图分工方法设计鞋靴专用结构卡；重点约束鞋底、走线、孔位和功能宣称。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:EC33", "source_type": "original", "task": "广告与详情", "product_category": "鞋靴", "requires_reference": true, "path": "prompts/ecommerce/EC33.md", "reference": "需要", "has_result": false}, {"id": "EC34", "title": "宠物用品佩戴与尺寸说明", "category": "宠物用品", "group": "ecommerce", "kind": "本库原创设计", "use": "依据真实宠物与商品尺寸展示佩戴位置，不生成安全性或适配性承诺。", "size": "1536x1920", "inputs": "图1：宠物用品正面与扣件完整照；图2：内侧或接触面近照；图3：获准使用的真实宠物侧身照；提供商品实测尺寸、宠物实测围度和正确佩戴说明。", "variables": {"用品身份": "蓝色Y形犬用胸背带", "宠物围度": "胸围52 cm", "用品尺寸": "M码，调节范围48–58 cm", "准确提示": "佩戴松紧以可放入两指为检查方法"}, "prompt": "图1、图2定义{{用品身份}}的颜色、织带路径、扣件数量、调节环和接触面；图3定义同一只获准使用宠物的外形、毛色、姿态与比例。制作4:5佩戴与尺寸说明图：上半部保持图3宠物侧身姿态，将用品按提供的正确说明放在真实佩戴位置，织带沿身体自然贴合，不穿过毛发或肢体；下半部只列“宠物胸围 {{宠物围度}}”“用品 {{用品尺寸}}”和“{{准确提示}}”三行已确认文字。用三条细引线标示测量与调节位置，但不遮挡扣件。不要改变宠物品种和体型，不增加牵引绳、灯、定位器或第二件用品，不写绝对防挣脱、零勒感、医疗矫正或安全保证。只输出一张图。", "example": "图1、图2定义蓝色Y形犬用胸背带的织带路径、2个扣件和调节环，图3定义同一只获准使用的棕色成年犬。制作4:5佩戴与尺寸说明图：上半部保持宠物侧身姿态，把胸背带放在正确位置，织带自然贴合；下半部只写“宠物胸围 52 cm”“用品 M码，调节范围48–58 cm”“佩戴松紧以可放入两指为检查方法”。用细引线标示胸围和调节位置。不要改变犬只体型，不增加牵引绳、灯或定位器，不写防挣脱、零勒感或安全保证。只输出一张图。", "example_inputs": "准备胸背带正面、内侧、获准使用的宠物侧身照及双方实测尺寸；示例范围仅在资料一致时使用。", "edit": "只修正{{佩戴位置、扣件或尺寸文字问题}}，按图{{参考图号}}和实测资料恢复为{{准确内容}}；宠物、其余用品结构和版式保持不变。", "variants": {}, "variants_format": "complete", "usage_note": "尺寸落在范围内不等于适合所有宠物；最终适配和安全判断应由使用者依据说明书与实际佩戴确认。", "adaptation": ["依据2.5参考图编辑方法设计宠物用品任务；分开宠物身份、用品结构和尺寸资料，避免模型推断适配与安全结论。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:EC34", "source_type": "original", "task": "广告与详情", "product_category": "宠物用品", "requires_reference": true, "path": "prompts/ecommerce/EC34.md", "reference": "需要", "has_result": false}, {"id": "EC35", "title": "汽车用品安装位置说明", "category": "汽车用品", "group": "ecommerce", "kind": "本库原创设计", "use": "把真实汽车内饰、配件结构和安装步骤组合成位置清楚的安装说明图。", "size": "1536x1920", "inputs": "图1：汽车用品完整照；图2：接口、卡扣或背胶近照；图3：实际适配车型的安装区域照片；图4至图6：真实三步安装照片；提供已核实车型范围和说明文字。", "variables": {"用品身份": "中控台右侧专用手机支架", "适配范围": "仅填写已核实车型与年份", "三步文字": "清洁安装位；对准卡扣；压紧并检查固定", "标题": "安装位置与步骤"}, "prompt": "依据图1至图6制作一张4:5汽车用品安装说明图。标题只写“{{标题}}”。上半部使用图3显示{{用品身份}}的真实安装区域，以细轮廓线圈出位置；商品外形、接口、卡扣或背胶按图1、图2，不改变车辆中控、出风口、按钮、屏幕或安全气囊区域。下半部按图4至图6排列三步，文字逐条采用“{{三步文字}}”中的对应句，每步只出现一次。页脚只写“适配范围：{{适配范围}}”。不要从相似车型推断兼容，不遮挡驾驶视线和车辆控制区，不增加打孔、接线、胶水或拆卸动作，不写无损、永久牢固、全车型通用或安全认证。只输出一张图。", "example": "依据图1至图6制作4:5中控台右侧专用手机支架安装说明图。标题只写“安装位置与步骤”。上半部使用图3真实车辆照片，用细轮廓线圈出中控台右侧安装区域；支架、卡扣和接触面按图1、图2，不改变出风口、按钮、屏幕或安全气囊区域。下半部按图4至图6排列三步，文字只写“清洁安装位”“对准卡扣”“压紧并检查固定”。页脚适配范围逐字采用已核实车型与年份。不要推断相似车型，不增加打孔、接线或胶水，不写无损、永久牢固或全车型通用。只输出一张图。", "example_inputs": "准备配件整体、接口近照、实际适配车辆安装区和三张步骤照；车型与年份必须来自已核实清单。", "edit": "只修正第{{步骤号}}步的{{位置、部件或文字问题}}，按图{{参考图号}}恢复为{{准确内容}}；车辆内饰、其他步骤和适配范围保持不变。", "variants": {}, "variants_format": "complete", "usage_note": "本卡只做已有安装资料的视觉整理。涉及行车视线、安全气囊、电路或车辆拆装时，以厂商说明和专业安装要求为准。", "adaptation": ["依据2.5多参考图编辑与文字控制方法设计汽车用品任务；锁定实际车型、安装区域和步骤照片，不把相似内饰当兼容证据。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:EC35", "source_type": "original", "task": "广告与详情", "product_category": "汽车用品", "requires_reference": true, "path": "prompts/ecommerce/EC35.md", "reference": "需要", "has_result": false}, {"id": "EC36", "title": "透明容器与内容物计数主图", "category": "透明与反光", "group": "ecommerce", "kind": "本库原创设计", "use": "保留透明容器的边缘、透射和真实内容物数量，避免透明材质被改成磨砂或空壳。", "size": "1024x1024", "inputs": "图1：透明容器正面完整照；图2：侧面或背面；图3：内容物全部可数的开盖或平铺照；图4：标签高清近照。内容物不可数时不填写数量。", "variables": {"商品身份": "透明方形糖果罐", "内容物数量": "独立包装糖果12颗", "准确标签": "SWEET DAY · 12 PCS", "背景": "浅灰无缝背景"}, "prompt": "图1至图4是同一SKU的依据。制作1:1透明容器商品主图，商品为{{商品身份}}，正面略带侧面居中，占画面高度75%。保持容器轮廓、壁厚、盖子、接缝、透明度、折射和图4标签；内容物严格为{{内容物数量}}，外形、颜色与排列来自图3，不复制、不隐藏、不把包装内反射误画成额外物品。使用{{背景}}和大面积柔光，透明边缘有清楚亮线，背后轮廓可辨，底部接触阴影自然。标签文字逐字为“{{准确标签}}”，不重排、不增加规格、口味、认证或赠品。不要把透明材质改成磨砂、金属或无厚度玻璃，不加入悬浮物和第二件商品。只输出一张图。", "example": "图1至图4是同一透明方形糖果罐。制作1:1主图，罐体正面略带侧面居中，占画面高度75%。保持透明壁厚、方形盖、接缝、折射和标签；罐内严格展示图3中可数的12颗独立包装糖果，不复制、不隐藏。浅灰无缝背景，大面积柔光，透明边缘亮线清楚，底部阴影自然。标签只写“SWEET DAY · 12 PCS”。不要改成磨砂材质，不加口味、认证、赠品、悬浮物或第二个罐。只输出一张图。", "example_inputs": "准备同一糖果罐正面、侧背面、12颗内容物可数照片和标签近照；无法确认数量时改用不显示数量的模板。", "edit": "只修正{{透明边缘、标签或内容物数量问题}}，按图{{参考图号}}恢复为{{准确状态}}；罐体、其余内容物、背景和光线不变。", "variants": {}, "variants_format": "complete", "usage_note": "反射重影不能作为内容物计数依据。若内容物被包装遮挡，只描述可见状态，不推断总数。", "adaptation": ["依据2.5参考图编辑方法设计透明商品任务；区别于EC26标签反光修正，本卡重点锁定容器边缘、透射和内容物数量。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:EC36", "source_type": "original", "task": "商品展示", "product_category": "透明与反光", "requires_reference": true, "path": "prompts/ecommerce/EC36.md", "reference": "需要", "has_result": false}, {"id": "EC37", "title": "镜面金属商品换场景", "category": "透明与反光", "group": "ecommerce", "kind": "本库原创设计", "use": "为镜面金属商品替换环境，同时控制反射内容、边缘和真实表面瑕疵。", "size": "1536x1920", "inputs": "图1：商品正面与原反射完整照；图2：侧背面；图3：目标场景照片；图4：标志或刻度近照。列明允许出现在反射中的环境元素。", "variables": {"商品身份": "不锈钢保温壶", "目标位置": "浅色厨房石材台面左侧", "允许反射": "窗框柔光、浅色台面和远处深色墙面", "禁止反射": "人物、摄影器材、第二件商品"}, "prompt": "将图1、图2中的{{商品身份}}放入图3的{{目标位置}}。商品外形、壶嘴、把手、盖子、接缝、金属色、拉丝与镜面分区、图4标志和刻度保持；不重新设计。镜面区域只反射{{允许反射}}，明确排除{{禁止反射}}；反射方向、透视、亮暗和图3光源一致，但保留图1可见的轻微使用痕迹，不把金属磨成塑料或无瑕CG。商品底部贴合台面，接触阴影与反射可信。不要增加蒸汽、液体、杯子、文字、功效或配件。只输出一张4:5场景图。", "example": "把图1、图2的不锈钢保温壶放在图3浅色厨房石材台面左侧。保持壶嘴、黑色把手、盖子、接缝、金属色、拉丝与镜面分区以及图4标志。镜面只反射窗框柔光、浅色台面和远处深色墙面，不出现人物、摄影器材或第二件商品。反射方向与图3光源一致，保留图1轻微使用痕迹，底部接触和阴影自然。不要加蒸汽、液体、杯子、文字或配件。只输出一张4:5图。", "example_inputs": "准备同一金属壶正面、侧背面、目标厨房和标志近照；先列允许与禁止反射的内容。", "edit": "只清除金属表面错误反射的{{对象}}，按图3恢复{{正确环境反射}}；商品结构、真实划痕、场景和阴影保持不变。", "variants": {}, "variants_format": "complete", "usage_note": "镜面商品不可能完全没有环境反射。要求应是反射与目标场景一致，而不是把表面抹成均匀灰色。", "adaptation": ["借鉴商品商业视觉的材质、场景和光线分层，补入镜面反射白名单与真实瑕疵边界。面向2.5原创整理，未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:EC37", "source_type": "original", "task": "商品展示", "product_category": "透明与反光", "requires_reference": true, "path": "prompts/ecommerce/EC37.md", "reference": "需要", "has_result": false}, {"id": "EC38", "title": "多SKU规格对照陈列", "category": "商品展示", "group": "ecommerce", "kind": "本库原创设计", "use": "将多个真实SKU分别绑定参考图和规格，避免串色、串结构、漏件或重复。", "size": "1536x1920", "inputs": "图1至图3：三个SKU各自正面完整照；图4：三个SKU同框比例照；另提供逐SKU准确名称、颜色和规格。每个SKU必须能从参考中独立确认。", "variables": {"SKU一": "500 mL白色", "SKU二": "750 mL蓝色", "SKU三": "1000 mL黑色", "共同品名": "密封保鲜盒", "标题": "三种规格"}, "prompt": "制作4:5的三SKU规格对照图，共同品名为{{共同品名}}。左、中、右三栏分别只使用图1{{SKU一}}、图2{{SKU二}}、图3{{SKU三}}；图4只校准三者真实相对尺寸。每栏恰好一件商品，保持各自颜色、轮廓、盖子、扣件、标签和可见结构，不把任一SKU的部件或颜色复制给另一个。标题只写“{{标题}}”；每栏下方只写对应SKU名称与规格，各一次。白底、统一柔光、基线对齐，商品按真实比例展示，不人为把三者拉成同高。不要增加价格、容量换算、套装、赠品、第四个SKU或共同性能结论。只输出一张图。", "example": "制作4:5密封保鲜盒三SKU规格对照图。左栏只用图1“500 mL白色”，中栏只用图2“750 mL蓝色”，右栏只用图3“1000 mL黑色”；图4只校准真实相对尺寸。每栏恰好一个盒子，保留各自盒盖、扣件、颜色、标签和比例，不拉成同高。标题只写“三种规格”，栏下只写对应规格。白底、统一柔光、基线对齐。不要增加价格、套装、赠品、第四个SKU或性能结论。只输出一张图。", "example_inputs": "准备三个SKU各自正面照、三者同框比例照和准确规格；示例颜色与容量必须逐一对应。", "edit": "只修正{{指定SKU栏}}的{{颜色、结构、规格或比例问题}}，按图{{参考图号}}恢复；另外两栏、标题和版式不变。", "variants": {}, "variants_format": "complete", "usage_note": "同色不同规格也必须提供独立参考。图4只证明相对尺度，不能替代各SKU结构照。", "adaptation": ["依据2.5多参考图职责设计多SKU任务；将身份、规格和比例分别绑定，避免普通套装陈列中的串款问题。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:EC38", "source_type": "original", "task": "商品展示", "product_category": "通用品类", "requires_reference": true, "path": "prompts/ecommerce/EC38.md", "reference": "需要", "has_result": false}, {"id": "EC39", "title": "中文包装正背面校对图", "category": "包装", "group": "ecommerce", "kind": "本库原创设计", "use": "把包装正背面实拍与已确认文字整理成校对图，不让模型重写整套包装。", "size": "1536x1920", "inputs": "图1：包装正面正对照；图2：包装背面正对照；图3、图4：正背面文字设计稿或高清近照；另给出最多四处需核对的位置和准确文字。", "variables": {"商品名称": "燕麦坚果棒", "校对项": "正面品名、净含量；背面配料标题、储存方式", "准确文字": "品名：每日燕麦坚果棒；净含量：210克；配料；储存方式：置于阴凉干燥处", "标题": "包装文字校对"}, "prompt": "依据图1至图4制作一张4:5“{{标题}}”校对图，商品为{{商品名称}}。左侧展示图1正面，右侧展示图2背面，包装轮廓、封边、颜色、图案、条码位置和原有文字排版保持，不生成新的包装设计。只对{{校对项}}设置四个以内编号框，并在下方校对栏逐字列出：{{准确文字}}。图3、图4只负责核对字符、字重和对应区域，不覆盖整面包装。校对栏与包装图分离，深灰字、浅色底、细引线，不遮挡原图。不要补写配料内容、营养数值、保质期、认证、厂家、地址或条码数字；未提供的文字保持原图可见状态，不猜测。只输出一张校对图。", "example": "依据图1至图4制作4:5“包装文字校对”图，商品为燕麦坚果棒。左侧图1正面，右侧图2背面，保持包装袋型、封边、颜色、图案、条码位置和原排版。只框选四处：正面品名、净含量，背面“配料”标题、储存方式。下方逐字列出“品名：每日燕麦坚果棒”“净含量：210克”“配料”“储存方式：置于阴凉干燥处”。不补写配料内容、营养数值、保质期、认证、厂家、地址或条码数字。只输出一张图。", "example_inputs": "准备包装正背面正对照和对应文字设计稿；示例四项必须经人工校对后使用。", "edit": "只修正编号{{编号}}的校对框或下方文字，使其逐字为“{{正确文字}}”；正背面包装、其他编号和版式不变。", "variants": {}, "variants_format": "complete", "usage_note": "本卡用于视觉校对和沟通，不代替法规审核、印前文件或OCR逐字校验。需要真正改包装时，应按EC30逐处局部修改并复核。", "adaptation": ["依据2.5文字控制与参考图编辑方法设计中文包装校对任务；区别于EC30单处修字，本卡输出正背面对照与独立校对栏。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:EC39", "source_type": "original", "task": "广告与详情", "product_category": "包装", "requires_reference": true, "path": "prompts/ecommerce/EC39.md", "reference": "需要", "has_result": false}, {"id": "EC40", "title": "家装五金配件清点与安装", "category": "家装五金", "group": "ecommerce", "kind": "本库原创设计", "use": "同时展示五金套装数量、安装位置和真实步骤，不补造螺丝、孔位或承重。", "size": "1536x1920", "inputs": "图1：全部配件平铺同框照；图2：主体五金正反面；图3：真实安装位置；图4至图6：三步安装照片；另提供配件清单、尺寸和说明书。", "variables": {"商品身份": "壁挂层板隐藏托架套装", "配件清单": "托架2个、长螺丝4枚、膨胀管4个", "三步文字": "定位并标记；按说明固定托架；装入层板并检查", "准确尺寸": "托架长度120 mm"}, "prompt": "依据图1至图6制作4:5家装五金清点与安装图，商品为{{商品身份}}。顶部配件区严格按图1展示{{配件清单}}，每件完整可数，只出现一次；中部结构区用图2展示正背面和{{准确尺寸}}，尺寸线连接真实边界；底部三步区按图3至图6的实际位置和动作，文字依次为“{{三步文字}}”中的三句。保持孔位、螺纹、表面处理、配件方向和数量，不从成品外观推测墙内结构。白底、深灰字、蓝色编号，三个区域清楚分隔。不要增加钻头、胶水、垫片、螺丝、孔位、承重数字、适用墙体或安全认证；工具只有在步骤照与说明书中出现时才展示。只输出一张图。", "example": "依据图1至图6制作4:5壁挂层板隐藏托架套装清点与安装图。顶部严格展示托架2个、长螺丝4枚、膨胀管4个，每件可数且只出现一次；中部按图2展示托架正背面，并标“托架长度120 mm”；底部按真实照片排列“定位并标记”“按说明固定托架”“装入层板并检查”三步。保持孔位、螺纹和方向。不要增加钻头、胶水、垫片、承重数字、适用墙体或认证。只输出一张图。", "example_inputs": "准备全部配件同框照、主体正背面、安装位置和三步照片；数量、尺寸和墙体要求以说明书为准。", "edit": "只修正{{配件区、尺寸区或步骤区}}的{{数量、方向、孔位或文字问题}}，按图{{参考图号}}恢复；其他区域不变。", "variants": {}, "variants_format": "complete", "usage_note": "安装图只整理已有说明。承重、墙体适用性、钻孔和安全要求必须由制造商或专业安装人员确认。", "adaptation": ["依据2.5多参考图与信息图方法设计家装五金任务；把配件清点、结构尺寸和安装步骤放在同页，但禁止推测承重与墙内结构。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:EC40", "source_type": "original", "task": "广告与详情", "product_category": "家装五金", "requires_reference": true, "path": "prompts/ecommerce/EC40.md", "reference": "需要", "has_result": false}, {"id": "EC41", "title": "饰品佩戴比例与实测尺寸", "category": "饰品", "group": "ecommerce", "kind": "本库原创设计", "use": "将饰品实物、获准人物参考和实测尺寸结合，展示可信佩戴比例。", "size": "1536x1920", "inputs": "图1：饰品完整正面照；图2：侧面和扣件近照；图3：获准使用的成年模特局部照；图4：饰品与尺子同框的正对测量照。提供准确尺寸，不凭照片透视估算。", "variables": {"饰品身份": "银色圆环耳饰一对", "实测尺寸": "外径22 mm，环宽3 mm", "佩戴位置": "双耳耳垂", "标题": "佩戴比例"}, "prompt": "图1、图2定义{{饰品身份}}的数量、轮廓、扣件、金属颜色和可见细节；图3定义获准使用成年模特的身份、耳部、发型、肤色和姿态；图4定义{{实测尺寸}}。制作4:5“{{标题}}”说明图：上半部保持图3人物不变，只在{{佩戴位置}}佩戴图1饰品，按图4实测尺寸表现与人体的真实比例，接触和遮挡自然；下半部左侧展示图1单品，右侧用尺寸线逐字标注{{实测尺寸}}。不要放大饰品、改变耳形、复制第三只饰品或让饰品穿过皮肤和头发。不要添加材质纯度、宝石等级、抗敏、保值或认证结论。只输出一张图。", "example": "图1、图2定义一对银色圆环耳饰，图3是获准使用的成年模特耳部参考，图4确认外径22 mm、环宽3 mm。制作4:5“佩戴比例”说明图：上半部保持人物脸型、耳部、发型和姿态，只在双耳耳垂佩戴同一对耳饰，按实测尺寸表现比例；下半部展示单只耳饰并标“外径22 mm”“环宽3 mm”。不要放大、增加第三只、改变耳形或让耳饰穿过头发，不写银纯度、抗敏、保值或认证。只输出一张图。", "example_inputs": "准备同一对耳饰正面、扣件近照、获准模特局部照和尺子同框照；示例尺寸仅在实测一致时使用。", "edit": "只修正{{佩戴比例、扣件、接触或尺寸文字问题}}，按图{{参考图号}}恢复为{{准确状态}}；人物、饰品其余结构和版式不变。", "variants": {}, "variants_format": "complete", "usage_note": "佩戴比例必须依据实测尺寸。人物图只用于展示，不自动生成材质、舒适度或过敏风险结论。", "adaptation": ["依据2.5多参考图编辑设计饰品佩戴任务；区别于EC28微距，本卡重点是人体比例、接触与测量证据。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:EC41", "source_type": "original", "task": "商品展示", "product_category": "饰品", "requires_reference": true, "path": "prompts/ecommerce/EC41.md", "reference": "需要", "has_result": false}, {"id": "EC42", "title": "户外装备展开与收纳清点", "category": "户外装备", "group": "ecommerce", "kind": "本库原创设计", "use": "同时展示户外装备展开形态、收纳体积和真实组件数量。", "size": "1536x1920", "inputs": "图1：装备完整展开照；图2：收纳状态；图3：全部组件平铺同框照；图4：接口、拉链或固定点近照；提供展开和收纳实测尺寸。", "variables": {"商品身份": "单人折叠露营椅", "组件清单": "椅体1件、收纳袋1个", "展开尺寸": "宽52 cm×深48 cm×高68 cm", "收纳尺寸": "长72 cm×直径14 cm"}, "prompt": "依据图1至图4制作4:5户外装备展开与收纳清点图，商品为{{商品身份}}。上半部左侧使用图1展示完整展开形态并标注{{展开尺寸}}，右侧使用图2展示收纳状态并标注{{收纳尺寸}}；尺寸线连接实际边界。下半部严格按图3展示{{组件清单}}，每件一次，图4只作为真实连接点、拉链和走线细节窗。保持框架数量、布面、颜色、接口、脚垫和收纳袋印刷，不从折叠状态补造隐藏部件。白底、深灰字、户外绿色点缀。不要增加杯架、头枕、脚托、地钉、承重、防水、防风、赠品或人物。只输出一张图。", "example": "依据图1至图4制作4:5单人折叠露营椅展开与收纳图。左上展示展开椅并标“宽52 cm×深48 cm×高68 cm”，右上展示收纳袋并标“长72 cm×直径14 cm”；下方只展示椅体1件、收纳袋1个，右下小窗按图4展示真实连接点和走线。保持框架、布面、颜色、脚垫和袋上印刷。不要增加杯架、头枕、脚托、地钉、承重、防水、防风、赠品或人物。只输出一张图。", "example_inputs 1920", "inputs": "图1：主机完整照；图2：断电状态面板高清照；图3：指定状态的真实面板照片；图4：全部随附配件同框照；图5：说明书对应页面。", "variables": {"商品身份": "台式破壁机", "指定状态": "预约时间显示08:00", "配件清单": "主杯1个、杯盖1个、量杯1个、清洁刷1把", "标题": "面板与配件"}, "prompt": "依据图1至图5制作4:5{{商品身份}}“{{标题}}”说明图。上半部保持图1主机外形、杯体、底座、品牌位置和接口；右侧面板特写以图2定义按键数量、名称和位置，只把显示区按图3改为{{指定状态}}，其他指示灯保持图3，不新增程序。下半部严格按图4展示{{配件清单}}，每件一次，并用细引线标出名称；图5只用于核对面板和配件，不生成说明书未列出的功能。不要添加第二台主机、食材、成品饮品、蒸汽或人物，不写功率、容量、转速、静音、预约能力以外的功能、安全认证或效果结论。只输出一张图。", "example": "依据图1至图5制作4:5台式破壁机“面板与配件”图。上半部保持图1主机、杯体、底座和品牌位置；面板按图2保留真实按键，只将显示区按图3呈现“08:00”，其余灯位不变。下半部只展示主杯1个、杯盖1个、量杯1个、清洁刷1把，各一次。不要增加程序、第二台主机、食材、饮品、功率、转速、静音或效果结论。只输出一张图。", "example_inputs": "准备主机、断电面板、指定真实状态、全部配件和说明书对应页；指定状态必须在实机中存在。", "edit": "只修正{{面板区或配件区}}的{{按键、显示、灯位、数量或文字问题}}，按图{{参考图号}}恢复；主机和其他区域不变。", "variants": {}, "variants_format": "complete", "usage_note": "界面截图和说明书只证明对应状态与功能，不应由灯位或按钮外观推断额外程序和性能。", "adaptation": ["依据2.5局部文字编辑和多参考图职责设计小家电任务；将主机身份、断电面板、真实状态与配件证据分开。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:EC48", "source_type": "original", "task": "广告与详情", "product_category": "小家电", "requires_reference": true, "path": "prompts/ecommerce/EC48.md", "reference": "需要", "has_result": false, "tags": ["小家电", "面板", "配件", "参考图"]}, {"id": "T23", "title": "成品图多处中文局部改字", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在已确认成品图上按编号逐处替换短中文，限制改动区域并保留原版式。", "inputs": "图1：待修改成品图；图2：带编号框的修改位置图；提供编号、原文、正确文字三列表。文字较长时同时提供允许换行方式。", "variables": {"修改清单": "①春日上新→春日焕新；②限时好价→会员专享；③立即购买→查看详情", "允许换行": "①单行；②单行；③单行", "保护区域": "人物、商品、标志、价格、背景和全部未编号文字"}, "prompt": "以图1为底图，图2只定义编号位置。严格按{{修改清单}}逐处替换中文，并遵守{{允许换行}}。每个编号只改对应文字框，沿用原字重、字号、字距、行距、颜色、对齐、透视和印刷质感；删除原文字后不得留下重影。完整保护{{保护区域}}，不移动版块、不重绘人物与商品、不顺手纠正未列出的文字、不新增标点、英文、数字或装饰。修改完成后移除编号框，只输出一张改好的成品图。", "example": "以图1海报为底图，图2只定义三个编号位置。依次把①“春日上新”改为“春日焕新”，②“限时好价”改为“会员专享”，③“立即购买”改为“查看详情”，三处均保持单行。沿用各自原字号、字重、颜色、对齐和透视，清除旧字重影。人物、商品、标志、价格、背景及所有未编号文字完全不动。完成后移除编号，只输出一张图。", "example_inputs": "准备原成品图、编号位置图和人工校对后的三列表；超过四处时分轮修改并逐轮复核。", "size": "1536x1920", "variants": {"单处高精度返工": "以图1为底图，本轮只修改编号{{编号}}：把“{{原文}}”逐字替换为“{{正确文字}}”，按{{换行方式}}排版。保持该字框的字体气质、字号、颜色、对齐和透视；图中其他像素区域、文字和编号位置均不改。只输出一张修改图。"}, "edit": "以上一轮结果为底图，并重新附图1、图2。本轮只返工编号{{编号}}，使其逐字为“{{正确文字}}”；其他已改文字与全部保护区域保持不变。", "usage_note": "多处改字适合短文案视觉返工；合同、价格表或印刷终稿仍需人工逐字校对，不能把生成图当可编辑源文件。", "adaptation": ["依据2.5文字控制与局部编辑方法设计；区别于EC30单个包装字段和EC39校对图，本卡处理通用成品图的编号式多处改字。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T23", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T23.md", "task": "Posters & Typography", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["中文", "改字", "局部编辑", "排版"]}, {"id": "T24", "title": "原版式中文本地化替换", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把外语海报或页面替换为已审定中文，在不照搬字形的前提下保留信息层级与版式关系。", "inputs": "图1：原语言成品；图2：无文字底图或清晰原图；提供原文到审定中文的一一映射、专名禁译表和允许重排范围。", "variables": {"替换映射": "SUMMER MARKET→夏日市集；JUL 18–20→7月18日至20日；FREE ENTRY→免费入场", "专名规则": "品牌名LUMEN保留英文", "允许重排": "标题可两行，日期和行动语保持单行"}, "prompt": "参照图1的信息层级和图2画面，把所有指定外语按{{替换映射}}替换为中文，遵守{{专名规则}}与{{允许重排}}。保留主视觉、网格、版块顺序、色彩、留白、图标和装饰关系；中文字体选择与原设计气质相称，不机械模仿外文字形。中文必须逐字准确、层级对应、边距充足，不溢出、不压住主体。删除已替换的外语，不保留双语；未在映射中的专名、数字和标志原样保留。不要翻译、补写或改写映射之外的内容。只输出一张本地化成品图。", "example": "参照图1海报层级和图2底图，把“SUMMER MARKET”替换为“夏日市集”，允许标题两行；把“JUL 18–20”替换为“7月18日至20日”，“FREE ENTRY”替换为“免费入场”，两者保持单行。品牌名“LUMEN”保留英文。主视觉、网格、版块顺序、色彩、图标和装饰不变；删除被替换外语，不加双语或新文案。只输出一张中文成品图。", "example_inputs": "准备原成品、无字底图或高质量原图、逐项翻译映射与专名禁译表；译文先由人工审定。", "size": "1536x1920", "variants": {"保留双语版": "参照图1和图2按{{替换映射}}制作中英双语版。中文为主层级，原文缩小为次层级并紧邻对应中文；遵守{{专名规则}}，不得重复第三次。保留主视觉、网格、色彩和版块顺序，只输出一张成品图。"}, "edit": "以上一轮结果为底图。本轮只修正{{文字区域}}的中文为“{{审定文字}}”，按{{指定换行}}排版；其他译文、原版式和主视觉不变。", "usage_note": "本卡执行已审定译文的视觉本地化，不承担翻译准确性判断；重要出版物应在排版软件中重建并校稿。", "adaptation": ["依据海报排版与文档单页机制设计本地化任务；将语言映射、专名禁译与允许重排分开，避免模型自由翻译。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T24", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T24.md", "task": "Documents & Publishing", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["中文", "本地化", "翻译", "版式"]}, {"id": "T25", "title": "线框草图驱动的图文版式", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "用编号线框草图控制图片、标题和信息块位置，再分别绑定真实素材与准确文字。", "inputs": "图1：带A、B、C区编号的线框草图；图2：主体素材；图3：辅助素材；另提供每区准确文字、背景与品牌色。", "variables": {"A区文字": "年度设计展", "B区文字": "9月20日 14:00", "C区文字": "城市美术馆一层", "背景与品牌色": "暖白背景、钴蓝强调色"}, "prompt": "图1只控制版式：A区标题、B区日期、C区地点、中央主体框和右下辅助图框的位置、占比与对齐关系必须保留。图2只负责中央主体，图3只负责右下辅助图，不交换、不融合、不补造素材。文字逐字排入A区“{{A区文字}}”、B区“{{B区文字}}”、C区“{{C区文字}}”，各出现一次；采用{{背景与品牌色}}，建立清楚的标题、信息和图像层级。线框、编号与占位叉在成品中全部移除。不要擅自移动版块、添加正文、二维码、标志、票价或赞助信息。只输出一张完成图。", "example": "图1只控制版式，保留A标题区、B日期区、C地点区、中央主体框和右下辅助图框的位置与占比。图2放中央，图3放右下，不能互换或融合。A区只写“年度设计展”，B区只写“9月20日 14:00”，C区只写“城市美术馆一层”。暖白背景、钴蓝强调色。移除线框、编号和占位叉，不加正文、二维码、标志、票价或赞助信息。只输出一张图。", "example_inputs": "准备编号线框、主体图、辅助图和逐区审定短文字；草图中需明确边距、框位和主次。", "size": "1536x1920", "variants": {"信息图线框": "图1只控制四个编号模块和箭头顺序，图2至图5分别绑定模块1至4。逐区排入{{模块短文}}，每区标题与一句说明，不交换素材、不新增结论。移除草图线框和编号，只输出一张信息图。"}, "edit": "以上一轮结果为底图，重新附图1。本轮只把{{区域}}的位置和尺寸恢复到草图关系，并保留该区内容；其他区域、素材与文字不变。", "usage_note": "草图用于约束相对布局，不证明像素级坐标；精确印刷网格仍应在专业排版工具中完成。", "adaptation": ["依据2.5参考图职责和海报版式系统设计；把线框、主体、辅助图与逐区文字独立绑定，避免只写“照着排”导致素材串位。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:T25", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T25.md", "task": "Posters & Typography", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["草图", "版式", "多参考图", "中文"]}, {"id": "T26", "title": "同一主视觉跨比例重排", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "将已验收主视觉适配到单一目标比例，通过重排而非拉伸裁坏主体。", "inputs": "图1：已验收主视觉；图2：主体无字原图（如有）；提供目标比例、安全区、必须保留文字和允许删除的装饰。每次只指定一个目标比例。", "variables": {"目标比例": "9:16", "安全区": "上下各8%、左右各6%", "必须保留文字": "主标题“向新而行”；日期“09.20”", "允许删除": "边缘两枚小星点装饰"}, "prompt": "把图1主视觉重排为{{目标比例}}，本次只输出该比例。保持图1的主体身份、姿态、商品或核心物件、色彩、光向和视觉主题；优先扩展背景与重新分配留白，不横向或纵向拉伸主体。所有关键内容位于{{安全区}}内，完整保留{{必须保留文字}}的逐字内容和层级；为适应比例可调整标题换行与相对位置，但不得压住主体。只可删除{{允许删除}}，不得增加新人物、商品、标志、文案或装饰。边缘扩展应延续原背景纹理和光线，不出现重复物体与接缝。只输出一张成品图。", "example": "把图1主视觉重排为9:16，只输出竖版。人物身份、姿态、手中商品、蓝紫配色和侧上方光线不变；通过向上下扩展背景和重新分配留白完成适配，不拉伸或裁断人物与商品。主标题“向新而行”和日期“09.20”逐字保留，放在上下各8%、左右各6%安全区内；标题可改为两行。只可删除边缘两枚小星点，不加其他文案、人物或标志。只输出一张图。", "example_inputs": "准备已验收成品和可选无字主体图；明确单个目标比例、安全区、必须保留项和可删除项。", "size": "1024x1536", "variants": {"横版重排": "把图1主视觉重排为{{横版比例}}，只输出横版。主体、核心物件、色彩与光向不变，通过左右扩展背景和横向重组文字完成，不拉伸主体。关键内容位于{{横版安全区}}，逐字保留{{必须保留文字}}，只可删除{{允许删除}}。"}, "edit": "以上一轮结果为底图，并重新附图1。本轮只修正{{被裁切或越界对象}}，使其完整进入{{安全区}}；其他构图、文字和扩展背景不变。", "usage_note": "一次只做一个比例便于验收；不同渠道的安全区应来自实际平台规范，不由模型自行猜测。", "adaptation": ["依据海报版式系统与参考图编辑设计跨比例任务；核心机制是背景扩展、布局重排和安全区，而非一次生成多张拼贴。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T26", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T26.md", "task": "Posters & Typography", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["比例", "扩图", "重排", "海报"]}, {"id": "T27", "title": "连续编辑的已验收状态锁定", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在多轮局部编辑中明确当前底图、已验收项和本轮唯一改动，减少回退与连带漂移。", "inputs": "图1：上一轮已验收结果；图2起：本轮需要重新核对的原始参考。提供已验收锁定清单、本轮单一改动和验收文字。", "variables": {"已验收锁定": "人物身份、商品外形、蓝色背景、左上标题、底部日期", "本轮唯一改动": "把人物右手中的白色杯子替换为图2黑色保温杯", "本轮验收": "杯盖、杯身比例和标志位置与图2一致，握持自然"}, "prompt": "图1是当前唯一底图，不回到更早版本。锁定并保持{{已验收锁定}}；图2起只作为本轮局部证据。本轮唯一执行：{{本轮唯一改动}}。验收标准：{{本轮验收}}。只重绘完成该改动所必需的最小区域，边缘、遮挡、光向、透视和噪点与图1衔接；不得重排版式、改写文字、改变人物身份、重新设计商品或顺手优化其他区域。若参考不足，不猜测隐藏结构，保留图1状态。只输出一张本轮结果图。", "example": "图1是当前唯一底图，不回到旧版本。锁定人物身份、商品外形、蓝色背景、左上标题和底部日期。本轮只把人物右手中的白色杯子替换为图2黑色保温杯；杯盖、杯身比例和标志位置按图2，握持自然。只重绘手掌与杯子接触所需最小区域，其他人物、文字和版式不动。只输出一张修改图。", "example_inputs": "准备上一轮已验收图、本轮物件原始参考、锁定清单和单一改动；每轮保存结果并重新作为下一轮图1。", "size": "1536x1920", "variants": {"文字轮次": "图1是当前唯一底图。锁定{{已验收锁定}}；本轮只把{{指定文字区域}}逐字改为“{{正确文字}}”，其他文字与像素区域不动。只输出一张本轮结果图。"}, "edit": "若本轮结果不合格，仍以图1为底图重新执行{{本轮唯一改动}}，只修正{{失败点}}；不要在失败结果上继续叠改。", "usage_note": "连续编辑应保存每轮已验收结果和锁定清单；生成式编辑不能保证未选区域逐像素不变，关键文件仍需人工比对。", "adaptation": ["依据2.5局部编辑方法设计状态锁定模板；用当前底图、锁定清单、单一改动和失败回退区分于普通一次性返工。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T27", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T27.md", "task": "Other Use Cases", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["连续编辑", "状态锁定", "局部修改", "参考图"]}, {"id": "T28", "title": "短中文规格对比表", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把已核对的少量规格做成可读对比表，逐格绑定数据，不让模型计算或补齐空项。", "inputs": "图1至图3：三个对象参考；提供不超过5行的审定表格，含列名、行名、单元格原值和空值标记。", "variables": {"标题": "三款规格对比", "列名": "轻巧款；标准款；大容量款", "表格数据": "容量：350 mL|500 mL|750 mL；净重：210 g|260 g|—；颜色：白|蓝|黑", "空值规则": "—保持为—，不推算"}, "prompt": "依据图1至图3制作4:5中文规格对比表。标题只写“{{标题}}”；三列依次为{{列名}}，各列顶部使用对应参考图，不交换对象。表格逐字逐格排入{{表格数据}}，行列对齐，单位与大小写原样保留；遵守{{空值规则}}。采用白底、深灰字、浅蓝表头和细分隔线，每格只放一个值，不使用长句。不要计算差值、排序优劣、补齐缺失值、添加推荐、冠军、性价比、价格、星级或未提供规格。只输出一张表格图。", "example": "依据图1至图3制作4:5“三款规格对比”图。三列依次为“轻巧款”“标准款”“大容量款”，顶部商品图分别绑定图1、图2、图3。三行数据逐格为：容量350 mL、500 mL、750 mL；净重210 g、260 g、—；颜色白、蓝、黑。“—”保持不变。白底、浅蓝表头、细分隔线。不要计算、排名、推荐或补值。只输出一张图。", "example_inputs": "准备三个对象参考和人工核对后的三列表；控制在3列、5行以内，缺失值明确写—。", "size": "1536x1920", "variants": {"两列差异表": "制作{{标题}}两列差异表。左右分别绑定图1、图2，逐格排入{{表格数据}}，空值按{{空值规则}}。只做事实对照，不添加优劣、推荐或计算结果。"}, "edit": "以上一轮结果为底图。本轮只修正{{列名}}列、{{行名}}行的值为“{{正确值}}”；其他单元格、商品图和版式不变。", "usage_note": "生成图不替代原始规格表；数值、单位和空值必须回到数据源逐格复核。", "adaptation": ["依据Infographic Engine的模块和短标签机制设计；区别于EC38商品陈列和EC13尺寸图，本卡重点是审定数据逐格映射与空值保护。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T28", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T28.md", "task": "Charts & Infographics", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["规格表", "中文", "数据", "对比"]}, {"id": "T29", "title": "实拍步骤图与短中文说明", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "按真实步骤照片和审定短句生成顺序清晰的操作图，不补动作、工具或结果。", "inputs": "图1至图4：按时间顺序的四张真实步骤照；提供四条短标题、每步一句说明和明确结束状态。", "variables": {"标题": "滤芯更换步骤", "步骤文字": "1 断开电源｜拔下插头；2 打开仓盖｜按图示方向掀开；3 取出旧滤芯｜握住提手垂直取出；4 装入新滤芯｜对准卡槽压到位", "结束状态": "仓盖关闭，电源仍断开"}, "prompt": "依据图1至图4制作4:5中文步骤图，标题只写“{{标题}}”。按左上、右上、左下、右下排列四步，每格只使用对应编号照片，保持手、工具、部件、方向和状态；逐格准确排入{{步骤文字}}中的对应编号、短标题和一句说明。箭头只连接1→2→3→4，不跨格、不反向。第4格必须保持{{结束状态}}。不要合并步骤、交换照片、补造手势、工具、警告、耗材、按钮或通电结果，不增加第五步和未提供安全结论。只输出一张图。", "example": "依据图1至图4制作4:5“滤芯更换步骤”图。四格依次写“1 断开电源｜拔下插头”“2 打开仓盖｜按图示方向掀开”“3 取出旧滤芯｜握住提手垂直取出”“4 装入新滤芯｜对准卡槽压到位”，照片逐格对应，箭头只按1到4连接。最后保持仓盖关闭、电源仍断开。不要增加工具、通电测试或第五步。只输出一张图。", "example_inputs": "准备同一对象、同一环境的四张连续实拍和经说明书核对的短句；缺步骤时不让模型补演。", "size": "1536x1920", "variants": {"三步横向版": "依据图1至图3制作{{标题}}三步横向图。三栏逐一绑定照片和{{三步文字}}，箭头只按1→2→3连接，保持{{结束状态}}，不补第四步。"}, "edit": "以上一轮结果为底图。本轮只修正第{{步骤号}}格的{{照片、方向或文字问题}}，按图{{参考图号}}与“{{正确文字}}”恢复；其他步骤与箭头不变。", "usage_note": "涉及电气、医疗、车辆或安装安全时，步骤必须来自正式说明；本卡只做已有流程的视觉整理。", "adaptation": ["依据流程信息图的顺序结构设计；不同于EC13通用步骤与品类任务包，本卡逐格绑定实拍、短中文、箭头和结束状态。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:T29", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T29.md", "task": "Charts & Infographics", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["步骤图", "中文", "流程", "实拍"]}, {"id": "T30", "title": "系列页面跨页视觉一致性", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "以已验收母版和视觉规则逐页生成系列页面，锁定网格、色彩、标题层级与固定元素。", "inputs": "图1：已验收母版页；图2：视觉规则卡；图3起：本页专用素材。提供页码、页名、准确标题正文、可变区和固定区。每次只做一页。", "variables": {"页码页名": "第3页｜核心能力", "本页标题": "从数据到行动", "本页正文": "统一口径｜定位问题｜形成方案", "固定区": "左上标志、顶部页眉线、右下页码、12栏网格", "可变区": "中央主图和三项正文"}, "prompt": "图1是已验收母版，图2是视觉规则卡。本次只生成{{页码页名}}。严格锁定{{固定区}}的相对位置、比例、字体气质、品牌色、边距和装饰；只在{{可变区}}使用图3起本页素材。标题逐字为“{{本页标题}}”，正文逐字为“{{本页正文}}”，按三项短句排版，不续写。保持与母版相同的视觉密度和层级，但不要复制母版主图或旧页正文。不得同时生成封面、其他页、书本样机或全册拼贴，不新增页码、标志、数据和章节。只输出一张本页平面成品。", "example": "图1为已验收母版，图2为规则卡。本次只生成“第3页｜核心能力”。锁定左上标志、顶部页眉线、右下页码、12栏网格、品牌蓝和标题层级；中央主图只用图3。标题只写“从数据到行动”，正文只写“统一口径｜定位问题｜形成方案”，不续写。不要复制母版主图，不生成其他页、样机或全册拼贴。只输出一张本页平面图。", "example_inputs": "准备母版平面图、视觉规则卡、本页素材和审定文字；每页单独生成，上一页不自动替代母版。", "size": "1536x1920", "variants": {"社媒系列卡": "以图1母版和图2规则卡生成系列第{{序号}}张。固定{{固定区}}，只在{{可变区}}替换为图3素材与“{{本页标题}}”“{{本页正文}}”。不同时输出其他序号。"}, "edit": "以上一轮结果为底图，并重新附图1、图2。本轮只修正{{不一致区域}}，恢复母版中的{{规则}}；本页主图和已校对文字不变。", "usage_note": "跨页一致性依赖母版与规则卡的持续复用；生成图不是可编辑排版文件，正式出版仍应在版式工具中统一。", "adaptation": ["依据文档出版单页和品牌系统机制设计；区别于T21普通单页，本卡明确母版固定区、单页可变区及逐页生成状态。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T30", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T30.md", "task": "Documents & Publishing", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["跨页", "母版", "视觉一致", "出版"]}, {"id": "T31", "title": "多参考图冲突优先级表", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "当多张参考图在身份、结构、版式、光线或文字上互相冲突时，先声明逐项权威来源。", "inputs": "图1至图N：不同职责参考；提供属性、权威图号、允许借用项、禁止覆盖项四列表，冲突未裁决的属性留空并保持底图。", "variables": {"优先级表": "人物身份→图1；商品结构→图2；版式位置→图3；光线气氛→图4；准确文字→输入文本", "允许借用": "图4只借用暖侧光与背景明暗", "禁止覆盖": "图4不得改变人物、商品、文字和版式"}, "prompt": "先按{{优先级表}}解释图1至图4的职责，再生成一张4:5成品。每项属性只服从其指定权威来源：人物身份不从商品图借用，商品结构不从氛围图改写，版式不从人物姿态推断，准确文字只服从输入文本。{{允许借用}}；严格执行{{禁止覆盖}}。若两图对同一未列属性冲突，保持当前底图或省略该细节，不折中混合。主体、环境、光线、材质、配色、短文字和版式按上述映射组合，边缘与遮挡自然。不要平均融合人脸、商品、标志或文字，不新增第五个来源。只输出一张图。", "example": "图1只定义人物身份，图2只定义商品结构，图3只定义版式位置，图4只借用暖侧光与背景明暗，准确文字只用输入文本。制作4:5成品：人物不得被图2至图4改脸，商品不得被图1、图3、图4改结构，图4不得覆盖文字和版式。未列属性若冲突就保持底图，不做平均融合。只输出一张图。", "example_inputs": "准备职责不同的参考图和逐属性优先级表；同一属性只能指定一个权威来源，无法裁决时不生成该细节。", "size": "1536x1920", "variants": {"编辑任务优先级": "以图1为底图，按{{优先级表}}只从图2起借用指定属性。{{允许借用}}；{{禁止覆盖}}。冲突项保持图1，不平均融合，只输出一张修改图。"}, "edit": "以上一轮结果为底图。本轮只修正{{冲突属性}}，改为服从图{{权威图号}}；其他属性继续按原优先级锁定。", "usage_note": "优先级表由使用者裁决，不由模型自行判断哪张图更真实；身份、结构和准确文字应优先使用原始证据。", "adaptation": ["依据2.5多参考图编辑方法设计冲突裁决模板；区别于普通图号分工，本卡要求逐属性唯一权威、允许借用和禁止覆盖。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T31", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T31.md", "task": "Other Use Cases", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["多参考图", "优先级", "冲突", "编辑"]}, {"id": "T32", "title": "复杂中文层级海报", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "将标题、副标题、日期地点、三项要点和行动语分层排版，限制文字数量与重复。", "inputs": "图1：主视觉素材；提供主标题、副标题、日期、地点、三项短要点和行动语，另给不可拆分词与允许换行。", "variables": {"主标题": "把想法做出来", "副标题": "AI视觉实战工作坊", "日期地点": "9月26日 14:00｜创意中心3楼", "三项要点": "构图拆解；中文排版；局部返工", "行动语": "限额30人", "不可拆分词": "AI视觉、创意中心"}, "prompt": "使用图1主视觉制作4:5中文活动海报。一级只放主标题“{{主标题}}”，最大且最多两行；二级放副标题“{{副标题}}”；三级放“{{日期地点}}”；四级把{{三项要点}}排成三个短标签；底部行动语只写“{{行动语}}”。{{不可拆分词}}不得断行。每段只出现一次，层级依靠字号、字重、留白和一枚强调色建立，不用重复文字做纹理。主视觉占画面约55%，文字不遮住脸、商品或关键动作。不要增加英文翻译、主办方、二维码、票价、地址细节、图标说明或装饰性乱码。只输出一张海报。", "example": "使用图1主视觉制作4:5海报。一级标题“把想法做出来”最多两行；二级“AI视觉实战工作坊”；三级“9月26日 14:00｜创意中心3楼”；三个短标签依次为“构图拆解”“中文排版”“局部返工”；底部只写“限额30人”。“AI视觉”和“创意中心”不得断行。所有文字各一次，不加英文、二维码或主办方。只输出一张图。", "example_inputs": "准备主视觉和人工审定的六类短文字；单条要点建议不超过8个汉字，并标出不可拆分词。", "size": "1536x1920", "variants": {"横版标题层级": "使用图1制作{{横版比例}}海报，仍按一级主标题、二级副标题、三级日期地点、三项短标签、底部行动语排列；逐字使用{{全部文字}}，每段一次，不新增信息。"}, "edit": "以上一轮结果为底图。本轮只修正{{层级区域}}的{{文字、换行或对齐问题}}，使其逐字为“{{正确文字}}”；其他层级和主视觉不变。", "usage_note": "长正文应拆到页面或文档，不应继续压入同一海报；正式活动信息需要人工逐字复核。", "adaptation": ["依据Poster Layout System和信息图短标签机制设计；用固定五级信息与不可拆分词控制复杂中文，不靠堆满微型文字制造丰富感。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T32", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T32.md", "task": "Posters & Typography", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["中文", "层级", "海报", "排版"]}, {"id": "T33", "title": "跨渠道系列视觉适配", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "以已验收品牌母版适配单个渠道规格，保持活动识别但按渠道重新组织信息。", "inputs": "图1：已验收活动母版；图2：品牌规则卡；图3：无字主体素材；提供本次唯一渠道、比例、安全区、必留文字和渠道可删项。", "variables": {"本次渠道": "小红书封面", "目标比例": "3:4", "安全区": "四边各7%", "必留文字": "主标题“秋日新章”；品牌名“LUMEN”", "可删项": "母版底部网址和两枚小装饰"}, "prompt": "以图1活动母版和图2品牌规则为依据，本次只制作{{本次渠道}}，比例{{目标比例}}。保持图3主体身份、活动主色、核心图形、品牌字体气质和标志安全留白；按渠道重新组织层级，而不是拉伸母版。{{必留文字}}逐字保留并位于{{安全区}}内；只可删除{{可删项}}。背景扩展、裁切和文字换行要服务当前渠道，主体不得被界面遮挡区切断。不要同时输出其他渠道、尺寸说明、设备样机或系列拼贴，不添加平台标志、账号、互动数字或新文案。只输出一张渠道成品。", "example": "以图1母版、图2品牌规则和图3主体制作小红书3:4封面。保持主体、活动主色、核心图形和LUMEN标志安全留白；主标题“秋日新章”和品牌名“LUMEN”逐字保留在四边7%安全区内。可删除母版底部网址和两枚小装饰，不拉伸母版，不加平台标志、账号或互动数字。只输出一张封面。", "example_inputs": "准备活动母版、品牌规则、无字主体与一个渠道的真实规格；每次只处理一个渠道并单独验收。", "size": "1536x1920", "variants": {"横幅渠道": "以图1至图3为依据，只制作{{横幅渠道}}的{{横幅比例}}成品。保持品牌识别与主体，逐字保留{{必留文字}}于{{安全区}}，只删{{可删项}}，不同时输出竖版。"}, "edit": "以上一轮结果为底图，重新附图1、图2。本轮只修正{{品牌或安全区偏差}}，恢复{{正确规则}}；本渠道其他内容不变。", "usage_note": "渠道比例和遮挡区应来自实际平台当前规范；本卡不自动推断或保证平台审核通过。", "adaptation": ["依据Brand Touchpoint Board与跨比例重排机制设计；区别于T26单张重排，本卡增加活动母版、品牌规则和渠道信息取舍。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:T33", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T33.md", "task": "Brand & Logos", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["渠道", "品牌", "系列", "比例"]}, {"id": "T34", "title": "技术标注引线防串位", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "按编号锚点和标签区域生成少量技术标注，让每条引线只连接一个真实部位。", "inputs": "图1：主体正对照；图2：标有A至D锚点的位置图；提供锚点、准确名称、标签放置区三列表。", "variables": {"标注表": "A→旋钮→左上；B→状态灯→右上；C→进风口→左下；D→电源接口→右下", "标题": "结构标注", "底部说明": "部位名称以实物资料为准"}, "prompt": "依据图1主体和图2锚点制作4:5“{{标题}}”图。严格按{{标注表}}生成四个标签：每条细引线从指定标签区出发，只终止于对应锚点，端点清楚，不交叉、不分叉、不穿过其他标签；名称逐字准确且各一次。保持图1主体的结构、比例、颜色、按钮和接口，不为了腾位置移动或复制部件。标签区保持足够留白，底部只写“{{底部说明}}”。成品移除A至D字母和锚点圆圈。不要增加第五条标注、参数、功能、内部结构、尺寸或认证。只输出一张图。", "example": "依据图1和图2制作4:5“结构标注”图。A旋钮标签放左上，B状态灯放右上，C进风口放左下，D电源接口放右下；每条引线只连对应锚点，不交叉、不分叉。名称各一次，主体结构不动。底部只写“部位名称以实物资料为准”。移除A至D标记，不加参数、功能或内部结构。只输出一张图。", "example_inputs": "准备主体正对照、人工标注锚点图和名称/标签区映射；标注超过6条时拆成多张主题图。", "size": "1536x1920", "variants": {"局部细节窗": "依据图1、图2制作{{标题}}图，只保留{{三个锚点}}。每条引线连接一个锚点和一个局部放大窗，名称按{{标注表}}，不交叉、不补结构。"}, "edit": "以上一轮结果为底图，重新附图2。本轮只修正{{标签名}}引线，使端点回到{{锚点}}且不与其他线交叉；主体和其余标注不变。", "usage_note": "引线图只说明已标注的可见部位；内部结构、功能和参数仍需正式图纸或资料证明。", "adaptation": ["依据Infographic Engine的标签与指针机制设计；将锚点、名称和标签区一一映射，限制标注数量，避免“全部部件都标注”导致串位。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T34", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T34.md", "task": "Charts & Infographics", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["标注", "引线", "信息图", "结构"]}, {"id": "T35", "title": "指定元素清除与底纹修复", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "按遮罩或编号删除指定文字、贴纸或小物件，并延续其背后的真实纹理、光影和透视。", "inputs": "图1：原图；图2：用纯色遮罩标明删除区域；图3：同一背景无遮挡参考（如有）。列出必须删除与必须保留项。", "variables": {"删除项": "右上角红色促销贴纸及其白色文字", "必须保留": "商品、品牌标志、左侧标题、桌面划痕、墙面光斑", "背景依据": "优先图3墙面纹理；缺失处延续图1邻近区域"}, "prompt": "以图1为底图，图2只定义最小删除区域。本轮只删除{{删除项}}，并按{{背景依据}}恢复被遮挡背景的纹理、颗粒、接缝、光斑、透视与噪点；修复边缘不得出现模糊补丁、重复纹理或色块。完整保护{{必须保留}}，不移动主体、不改字、不重绘商品、不调整整图色彩和构图。图3如提供只负责背景依据，不把其中其他物体带入。完成后移除遮罩，不增加替代文字、装饰、水印或空白标签。只输出一张修改图。", "example": "以图1为底图，图2只标右上角区域。只删除右上角红色促销贴纸及其白色文字，优先按图3恢复墙面纹理和光斑，缺失处延续图1邻近颗粒；不得留下模糊补丁或重复纹理。商品、品牌标志、左侧标题、桌面划痕和墙面其他光斑不变。不加替代文字或装饰。只输出一张图。", "example_inputs": "准备原图、紧贴目标边缘的遮罩和可选无遮挡背景；遮罩不要覆盖需要保留的商品边缘。", "size": "1536x1920", "variants": {"仅清除文字": "以图1为底图，图2定义文字区域。只删除“{{待删文字}}”及其投影，按{{背景依据}}恢复底纹；保留所有图形、标志和未指定文字，不添加新字。"}, "edit": "仍以原图1为底图重做，只修正{{残影、重复纹理或误删边缘}}；缩小遮罩到{{准确范围}}，其他区域不动。", "usage_note": "若被遮挡区域没有任何背景依据，只能做视觉补全，不能声称恢复了真实原始内容。", "adaptation": ["依据2.5局部编辑方法设计删除任务；把删除遮罩、背景证据和保护项分开，区别于改字与对象替换。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:T35", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T35.md", "task": "Other Use Cases", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["删除", "局部编辑", "遮罩", "修复"]}, {"id": "T36", "title": "准确日期中文时间轴", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把已核对的日期、事件和状态按顺序做成短中文时间轴，不计算间隔或补造里程碑。", "inputs": "提供3至6条按时间升序的日期｜事件｜状态表；图1起可为各事件对应素材，并注明缺图项使用纯文字。", "variables": {"标题": "项目关键节点", "节点表": "2026-03-01｜需求确认｜已完成；2026-03-18｜原型评审｜已完成；2026-04-02｜小范围试用｜进行中；2026-04-20｜复盘会议｜计划中", "日期格式": "YYYY-MM-DD原样保留"}, "prompt": "制作16:9中文时间轴，标题只写“{{标题}}”。严格按{{节点表}}从左到右排列四个节点，日期遵守{{日期格式}}，每个节点依次只放日期、事件、状态三行；素材如提供则逐节点对应，不交换，缺图节点使用简单几何标记。已完成用深蓝实心点，进行中用橙色圆环，计划中用灰色空心点；颜色只表达给定状态。不要重排日期、计算天数、添加当前日期、负责人、百分比、第五个节点或因果结论。只输出一张时间轴图。", "example": "制作16:9“项目关键节点”时间轴，从左到右依次为“2026-03-01｜需求确认｜已完成”“2026-03-18｜原型评审｜已完成”“2026-04-02｜小范围试用｜进行中”“2026-04-20｜复盘会议｜计划中”。日期原样保留；已完成深蓝实心点，进行中橙色圆环，计划中灰色空心点。不要计算间隔、加负责人、百分比或第五个节点。只输出一张图。", "example_inputs": "准备已经核对并排序的节点表；日期、状态和事件名都作为文本输入，不从图片OCR推断。", "size": "1536x1024", "variants": {"竖向时间轴": "制作4:5“{{标题}}”竖向时间轴，严格按{{节点表}}自上而下排列，日期按{{日期格式}}，状态色只服从输入，不新增节点和计算。"}, "edit": "以上一轮结果为底图。本轮只修正第{{节点号}}个节点的{{日期、事件或状态}}为“{{正确内容}}”；其余节点与连线不变。", "usage_note": "时间轴是已有节点表的视觉呈现，不替代项目系统；时间敏感信息应在发布前重新核对。", "adaptation": ["依据Infographic Engine的信息流和短标签机制设计；区别于步骤图，本卡锁定真实日期、事件、状态和时间顺序。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T36", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T36.md", "task": "Charts & Infographics", "product_category": "非商品专项", "reference": "按卡片说明", "has_result": false, "tags": ["时间轴", "日期", "中文", "信息图"]}, {"id": "T37", "title": "底图锚点式位置标注", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在用户提供的平面图、园区图或场地图上按编号锚点放置短中文标签，不重绘路线或猜地理关系。", "inputs": "图1：已确认底图；图2：标有A至E锚点的副本；提供锚点、地点名、图标类型三列表和标题。", "variables": {"标题": "活动区域示意", "锚点表": "A→入口→门；B→签到处→桌；C→主会场→舞台；D→休息区→座椅；E→洗手间→通用指示", "方向说明": "本图不表示精确距离"}, "prompt": "以图1为底图，图2只定义锚点位置。制作4:5“{{标题}}”：严格按{{锚点表}}在A至E对应位置放置一个小图标和一条地点名，文字各出现一次；标记不得漂移到邻近房间、道路或区域。保持图1边界、建筑、道路、比例、颜色和原有标注，不新增路线、距离、比例尺、指南针或出入口。标签重叠时只移动文字框并用短线连回原锚点，不能移动锚点。底部只写“{{方向说明}}”。成品移除A至E字母和锚点圆圈。只输出一张标注图。", "example": "以图1场地图为底图，图2定义A至E位置。A标“入口”，B标“签到处”，C标“主会场”，D标“休息区”，E标“洗手间”，各一个小图标和一次文字。标记不得漂移；文字重叠时用短线连回原锚点。保持原建筑、道路和边界，不加路线、距离、比例尺或新出入口。底部只写“本图不表示精确距离”。只输出一张图。", "example_inputs": "准备已确认底图、锚点副本和逐点名称；底图不准确时先回到正式场地资料修正。", "size": "1536x1920", "variants": {"楼层导览": "以图1楼层图为底图，图2定义{{锚点范围}}。按{{锚点表}}放置短中文标签，锚点不移动，不新增房间、通道、疏散路线或距离。"}, "edit": "以上一轮结果为底图，重新附图2。本轮只把“{{地点名}}”标签端点恢复到{{锚点}}；底图和其余标签不变。", "usage_note": "本卡不生成导航、消防疏散或测绘结论；涉及安全路线时必须使用正式审核图纸。", "adaptation": ["依据地图标签和信息图锚点机制设计；区别于技术部件引线，本卡保护用户底图与空间锚点，不推断地理关系。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T37", "source_type": "original", "variants_format": "complete", "path": "prompts/templates/T37.md", "task": "Charts & Infographics", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["锚点", "地图", "位置", "标注"]}, {"id": "G36", "title": "转角裸眼3D屏商品出框广告", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "为L形户外数字屏设计单视点裸眼3D商品广告提案，明确屏体转角、观看点和屏内边界。", "size": "2048x1152", "inputs": "图1：真实商品正侧面；图2：L形屏幕正面与侧面比例；图3：指定观看点拍摄的街景；图4：品牌标志。提供屏幕内容安全区和准确短标题。", "variables": {"商品身份": "银色头戴式耳机", "出框动作": "右耳罩越过内侧转角向前探出，头梁仍在屏内", "短标题": "沉浸此刻", "屏内场景": "深蓝声波隧道", "观看点": "图3相机位置"}, "prompt": "依据图1至图4制作16:9的L形数字屏广告效果提案，视角严格来自{{观看点}}。图2定义屏体正面、侧面、内转角和边框；屏内展示{{屏内场景}}，图1{{商品身份}}执行{{出框动作}}，利用转角透视形成单视点裸眼3D错觉。商品结构、耳罩数量、头梁、按键、金属颜色和图4标志保持，所谓出框只发生在屏幕内容透视中，商品不能真实穿过建筑边框。短标题只写“{{短标题}}”，位于正面屏安全区，各一次。街景、建筑和行人尺度按图3，不增加其他屏幕、商品、平台标志或功能宣称。只输出一张指定观看点效果图，不输出多视角拼贴或可施工保证。", "example": "依据图1银色头戴式耳机、图2 L形屏、图3街景观看点和图4标志，制作16:9裸眼3D广告效果图。屏内为深蓝声波隧道，右耳罩越过内转角向前探出，头梁仍在屏内；保持两个耳罩、头梁、按键和金属色，错觉不得穿出真实建筑边框。正面安全区只写“沉浸此刻”。街景与屏体比例不变，不加第二件商品或功能宣称。只输出一张图。", "example_inputs": "准备商品多角度、真实L形屏比例、指定观看点街景和品牌标志；未获得屏体数据时只标视觉提案。", "edit": "只修正{{转角透视、商品结构或屏幕边界问题}}，按图{{参考图号}}恢复；街景、观看点、文字和其他屏面不变。", "variants": {}, "variants_format": "complete", "usage_note": "裸眼3D效果依赖真实屏体和观看点。本卡只生成视觉提案，不替代屏幕内容制作、现场标定或结构施工。", "adaptation": ["从商品商业视觉与强制透视机制组合出L形屏单视点任务；区别于普通海报和巨物广告，锁定屏体转角、观看点及屏内边界。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:G36", "source_type": "original", "path": "prompts/gallery/G36.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["裸眼3D", "户外广告", "商品", "透视"]}, {"id": "G37", "title": "原材料到成品的连续材质转译", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "让真实原材料沿同一连续形体逐段转化为成品，用于工艺概念广告而不虚构生产流程。", "size": "1536x1920", "inputs": "图1：真实成品；图2：经确认的主要原材料；图3：真实表面工艺近照；提供转译方向、允许的概念连接和准确标题。", "variables": {"成品": "胡桃木桌面音箱", "原材料": "一段未上漆胡桃木板", "转译路径": "左下木板纹理沿连续曲面上升，右上收束为完整音箱外壳", "标题": "由材而生", "背景": "暖灰摄影棚"}, "prompt": "依据图1至图3制作4:5工艺概念广告。画面以{{转译路径}}呈现{{原材料}}到{{成品}}的单一连续材质转译：起点保留图2木材端面、纹理和自然缺口，中段只用流动切削层与薄木屑表达概念过渡，终点完整恢复图1音箱的比例、开孔、网罩、旋钮和图3表面工艺。背景为{{背景}}，侧上方暖光沿纹理移动，所有木屑和过渡形体有可信重力与接触关系。顶部只写“{{标题}}”。这不是生产流程图，不添加机器、工人、胶水、认证、环保、手工制造或材料性能结论；不得把成品融化、拉长或少画部件。只输出一张图。", "example": "依据图1胡桃木桌面音箱、图2未上漆木板和图3表面近照制作4:5概念广告。左下木板纹理沿连续曲面向上，经过少量切削层和木屑，右上收束为完整音箱；成品比例、开孔、网罩、旋钮和表面工艺按参考不变。暖灰棚拍背景与侧上暖光。顶部只写“由材而生”。不加机器、工人、胶水、环保或手工制造结论。只输出一张图。", "example_inputs": "准备成品、确认原材料和工艺近照；原材料关系不确定时改为纯概念材质，不声称真实来源。", "edit": "只修正{{转译段或成品段}}的{{纹理、连接或结构问题}}，按图{{参考图号}}恢复；其他路径、背景和标题不变。", "variants": {}, "variants_format": "complete", "usage_note": "视觉转译不等于真实制造流程、材料溯源或环保声明；这些信息必须另有证据。", "adaptation": ["借鉴材质转译与商品英雄图机制，新增连续形体的起点、中段、终点职责；重点保护终点成品身份并限制工艺宣称。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:G37", "source_type": "original", "path": "prompts/gallery/G37.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["材质转译", "工艺", "商品", "概念广告"]}, {"id": "G38", "title": "可拆装快闪店三阶段部署板", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "把模块清单、组装状态和落地空间组织成三阶段品牌快闪店提案，区分概念与施工。", "size": "2048x1152", "inputs": "图1：真实场地；图2：模块与物料清单；图3：品牌规则；图4起：真实商品。提供阶段名称、已知尺寸和禁止遮挡区域。", "variables": {"品牌": "LUMEN", "模块清单": "背板2块、展示台3个、灯箱1个、收银台1个", "三阶段": "平铺清点；组合示意；场地落位", "禁止遮挡": "入口、消防设施和原有通道", "标题": "POP-UP SYSTEM"}, "prompt": "依据图1至图4制作16:9三栏快闪店部署板，标题只写“{{标题}}”。左栏“平铺清点”严格按图2展示{{模块清单}}，每件一次；中栏“组合示意”只按已知连接关系形成模块化展台，不补螺丝、线路和隐藏结构；右栏“场地落位”把同一组合放入图1，遵守{{禁止遮挡}}，保持场地开口、柱位、比例和动线。图3只负责{{品牌}}标志、颜色和字体气质，图4起商品按真实数量陈列。三栏使用一致轴测角度与品牌色，模块身份连续。不要添加人群、未列家具、施工尺寸、承重、电气方案、审批或可建造保证；底部只写“视觉概念，施工以现场与工程资料为准”。只输出一张部署板。", "example": "制作16:9“POP-UP SYSTEM”三栏部署板。左栏按图2清点背板2块、展示台3个、灯箱1个、收银台1个；中栏只按已知关系组合；右栏放入图1场地，不遮挡入口、消防设施和通道。图3只负责LUMEN品牌规则，图4商品按真实数量陈列。不要补线路、隐藏结构、承重或施工尺寸。底部写“视觉概念，施工以现场与工程资料为准”。只输出一张图。", "example_inputs": "准备真实场地、模块清单、品牌规则和商品照；连接、尺寸或消防边界缺失时不得由模型补全。", "edit": "只修正{{阶段栏}}的{{模块数量、组合或场地位置问题}}，按图{{参考图号}}恢复；其他两栏和品牌规则不变。", "variants": {}, "variants_format": "complete", "usage_note": "部署板用于视觉沟通，不替代施工图、结构、电气、消防或场地方审批。", "adaptation": ["将品牌触点板、空间概念与组件清点组合为平铺—组装—落位三阶段；区别于EC24单一门店效果和G31单件展架。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:G38", "source_type": "original", "path": "prompts/gallery/G38.md", "task": "Architecture & Spaces", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["快闪店", "模块", "空间", "品牌"]}, {"id": "G39", "title": "实体投影形成品牌符号", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "用真实商品与定向光形成指定品牌符号的投影概念广告，同时保持实体本身不变形。", "size": "1536x1920", "inputs": "图1：真实商品；图2：获准品牌符号黑白轮廓；图3：商品侧背面；提供光源方向、承托平面和短标题。", "variables": {"商品": "黑色金属台灯", "品牌符号": "图2的圆环缺口符号", "光源": "右上方单一硬光", "承托平面": "暖灰墙面与深灰台面", "标题": "LIGHT LEAVES A MARK"}, "prompt": "依据图1、图3保持{{商品}}的外形、关节、灯罩、底座、金属色和真实比例，放在{{承托平面}}。使用{{光源}}，让商品及一个不出镜的简单遮光片共同在墙面形成图2{{品牌符号}}的单一清晰投影；符号只存在于投影中，商品本体不得弯曲、切割或排列成标志。投影方向、边缘软硬、墙角折线和接触阴影符合单一光源，投影不漂浮、不出现第二套符号。画面克制、大片留白、黑灰与一枚暖光色。底部只写“{{标题}}”。不要增加品牌名、功能、价格、光效参数、烟雾或其他道具。只输出一张概念广告。", "example": "保持图1、图3黑色金属台灯的灯罩、关节、底座和比例，放在暖灰墙面前的深灰台面。右上方单一硬光让台灯与不出镜遮光片在墙上形成图2圆环缺口符号；符号只在投影里，台灯本体不弯曲或切割。投影方向与墙角折线可信，只出现一次。底部只写“LIGHT LEAVES A MARK”。不加品牌名、参数、烟雾或道具。只输出一张图。", "example_inputs": "准备商品正侧背面和已获准使用的符号轮廓；物理投影可行性未验证时明确为概念广告。", "edit": "只修正{{投影轮廓、光源方向或商品结构问题}}，按图{{参考图号}}恢复；商品位置、墙面、标题和其他阴影不变。", "variants": {}, "variants_format": "complete", "usage_note": "这是投影概念视觉，不证明现场用单一商品即可形成该符号；标志使用须有授权。", "adaptation": ["从品牌标志、商品摄影和负空间机制组合出“实体不变、投影成符号”的双层任务，区别于G16材料直接构成标志。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:G39", "source_type": "original", "path": "prompts/gallery/G39.md", "task": "Brand & Logos", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["投影", "标志", "负空间", "品牌"]}, {"id": "G40", "title": "眼镜镜片内外双场景广告", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "让同一真实场景在镜片内外形成受控视觉差异，用于镜片概念广告而不虚构光学性能。", "size": "1536x1920", "inputs": "图1：眼镜正面；图2：镜腿与铰链；图3：同一机位拍摄的无镜片场景；图4：经实拍确认的透过镜片效果。提供准确短标题和允许描述的镜片事实。", "variables": {"眼镜身份": "茶色透明框太阳镜", "镜片内效果": "按图4呈现较暖、略低亮度的同一海边场景", "镜片外效果": "按图3保持原始中性日光", "标题": "换一种目光", "允许事实": "仅描述画面可见色调差异"}, "prompt": "依据图1至图4制作4:5眼镜概念广告。{{眼镜身份}}正面略微倾斜悬于画面中央，占高度约55%，镜框、两片镜片、鼻托、铰链和镜腿结构保持。背景完整使用图3{{镜片外效果}}；仅在两片镜片真实边界内部显示图4{{镜片内效果}}，内外仍是同一机位、同一海岸线与物体位置，不生成第二个世界或错误折射。镜片边缘、反光、透明度与遮挡自然，左右镜片效果一致。顶部只写“{{标题}}”。{{允许事实}}，不添加防紫外线等级、偏光、变色、护眼、清晰度或适合驾驶结论。只输出一张图。", "example": "依据图1至图4制作4:5茶色透明框太阳镜广告。眼镜居中，保持两片镜片、鼻托、铰链和镜腿。镜片外按图3呈现中性日光海边；镜片内按图4呈现同一机位、同一海岸线的较暖低亮度效果，左右一致，不生成不同景物。顶部只写“换一种目光”。只描述可见色调差异，不写偏光、防紫外线、护眼或驾驶结论。只输出一张图。", "example_inputs": "准备眼镜正面、侧面、同一场景原图和真实透镜实拍；没有图4时只做视觉概念，不声称镜片真实效果。", "edit": "只修正{{左镜片、右镜片或镜框}}的{{场景对齐、色调或结构问题}}，按图{{参考图号}}恢复；其他区域和文字不变。", "variants": {}, "variants_format": "complete", "usage_note": "镜片内外效果必须由同机位实拍支持；视觉图不能替代透射率、偏光或防护检测。", "adaptation": ["从商品摄影与镜片分区编辑机制设计新品类任务；以镜片真实边界承载同机位差异，避免普通分屏广告和无依据光学宣称。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:G40", "source_type": "original", "path": "prompts/gallery/G40.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["眼镜", "镜片", "双场景", "商品"]}, {"id": "G41", "title": "货架陈列规范与现场对照", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "把已审定货架陈列图与真实现场照片并排对照，显示位置偏差而不补造销量或库存。", "size": "2048x1152", "inputs": "图1：审定陈列规范图；图2：同一货架现场正对照片；图3起：涉及SKU的正面包装；提供层号、槽位、应放SKU、现场状态四列表。", "variables": {"标题": "陈列规范对照", "对照表": "第1层A槽→白色500 mL→正确；第1层B槽→蓝色500 mL→错放；第2层A槽→黑色750 mL→缺货", "标记规则": "正确绿框、错放橙框、缺货灰色虚框", "门店信息": "仅写门店编号S018"}, "prompt": "依据图1至图3制作16:9“{{标题}}”图。左半部完整展示图1审定陈列规范，右半部保持图2真实现场，不移动、复制或补齐商品。严格按{{对照表}}在右侧对应层号与槽位叠加{{标记规则}}，每个框只标SKU短名与状态一次；图3起只用于核对包装身份，不替换现场实物。货架层板、价签位置、空槽、遮挡和拍摄透视保持。顶部右侧只写“{{门店信息}}”。不要推断销量、库存数量、补货时间、销售表现或责任人，不增加不存在的商品和价格。只输出一张对照图。", "example": "制作16:9“陈列规范对照”图，左侧图1规范，右侧图2现场。第1层A槽白色500 mL标绿框“正确”；第1层B槽蓝色500 mL标橙框“错放”；第2层A槽黑色750 mL位置标灰色虚框“缺货”。图3只核对包装，不移动或补齐现场商品。顶部只写“门店编号S018”。不推断销量、库存或补货时间。只输出一张图。", "example_inputs": "准备审定规范、同一货架现场正对图、涉及SKU包装和人工核对表；现场图时间需记录在业务系统中。", "edit": "只修正{{层号槽位}}的{{框色、SKU名或状态}}为“{{正确内容}}”；规范图、现场商品与其他标记不变。", "variants": {}, "variants_form
