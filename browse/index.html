}}”、最大标题“{{主标题}}”、副标题“{{副标题}}”、两侧“{{卖点一}}”“{{卖点二}}”、底部“{{活动文字}}”，各一次，配色{{配色}}。不加额外食材、广告字、生产刀线或尺寸。\n立牌和底座不变，外部背景改为真正透明，保留自然边缘。仅适合支持透明输出的工具，画面不绘制棋盘格。"}, "settings_note": "使用透明背景变体时另设 background=transparent，output_format=png或webp；基础版为白底。图像不是生产刀模文件。", "edit": "以上一轮结果为底图，重新附所需原始参考。本轮只修改立牌底部活动区的“{{旧活动文字}}”：替换为“{{新活动文字}}”，保留真实菜品、异形边缘、品牌与完整底座。只输出这一张修改后的图。", "adaptation": ["保留原Case470的白底、单个异形主体、完整底座和门店POP信息层级，区别于EC05普通海报及EC24门店空间。", "主菜与两配餐分别对应实拍，取消原提示默认补充丰富食材的含义；准确文字绑定位置和次数。", "白底展示与透明变体明确区分，印刷生产文件不能由成品效果图替代。"], "sources": [{"label": "原库 Case 470 · 本地生活小店异形展架 · @MrLarus", "url": "https://github.com/wangge-dev/awesome-gpt-image-2/blob/b477278bb2a36d4c59655eb0daa4ce48e8dbc4c4/docs/gallery-part-2.md#case-470"}, {"label": "原库记录的作者来源", "url": "https://x.com/MrLarus/status/2059248197910827364"}], "source_key": 470, "preview": "https://raw.githubusercontent.com/wangge-dev/awesome-gpt-image-2/b477278bb2a36d4c59655eb0daa4ce48e8dbc4c4/data/images/case470.jpg", "variants_format": "complete", "path": "prompts/gallery/G31.md", "task": "广告与详情", "product_category": "食品", "reference": "需要", "has_result": false}, {"id": "EC26", "title": "玻璃瓶反光与标签可读性", "category": "美妆与玻璃包装", "group": "ecommerce", "kind": "本库原创设计", "use": "玻璃瓶反光与标签可读性：围绕实际商品素材处理一个明确问题。", "size": "1024x1024", "inputs": "图1：商品正面完整照片；图2：同一瓶身标签的清晰近照。两张必须为同一SKU，不用相似瓶代替。", "variables": {"背景": "浅灰无缝背景"}, "prompt": "图1负责瓶型、瓶盖、液位和正面视角；图2只负责核对标签文字与图案。编辑图1中的玻璃瓶商品照，背景为{{背景}}。将横穿正面标签的大片刺眼反光收窄到瓶身两侧，保留玻璃边缘的柔和亮线、真实透射与底部厚度。标签仍贴合原来的曲面，文字、标志与位置以图2为准，不重新排版。保持瓶盖材质、瓶肩形状、液体颜色和液位；不把透明玻璃改成磨砂或塑料。瓶身完整入画，保留自然接触阴影，不增加花草、广告文案或额外瓶子。输出一张商品图。", "example": "只将背景换成浅灰无缝背景，并减弱穿过正面标签的宽白色反光，保留瓶子两侧的玻璃亮边。图1确定商品外形与液位，图2确定标签。瓶盖、颜色、字体和标签排版保持，商品完整入画，输出一张图。", "example_inputs": "图1：商品正面完整照片；图2：同一瓶身标签的清晰近照。两张必须为同一SKU，不用相似瓶代替。", "edit": "只减弱{{反光位置}}的过曝亮斑，恢复该位置原参考可见的材质或文字；保持其他反射与整瓶结构。", "variants": {}, "variants_format": "complete", "usage_note": "反光遮住且所有参考中都不可见的文字，需要补拍；不能靠文字猜测恢复真实标签。", "adaptation": ["依据2.5图像编辑定位设计具体电商任务；正文为本库原创，不是官方案例译文。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:EC26", "source_type": "original", "task": "商品展示", "product_category": "美妆与玻璃包装", "requires_reference": true, "path": "prompts/ecommerce/EC26.md", "reference": "需要", "has_result": false}, {"id": "EC27", "title": "服装印花跨褶皱保留", "category": "服装", "group": "ecommerce", "kind": "本库原创设计", "use": "服装印花跨褶皱保留：围绕实际商品素材处理一个明确问题。", "size": "1024x1024", "inputs": "图1：实际衣服正面平铺照；图2：同款印花高清近照；图3：需要编辑的穿着照。图3须穿同款版型，避免同时改变剪裁和印花。", "variables": {"印花位置": "前胸原印花区域"}, "prompt": "在图3穿着照的{{印花位置}}恢复图1这件衣服的原始印花。图1决定印花在衣服上的相对位置与大小，图2决定文字、线条和颜色细节。图3决定人物、衣服轮廓、身体姿态与褶皱。让图案随现有布面褶皱产生自然透视和遮挡，不将图案当平面贴纸覆盖皱褶；图案中原有文字的字序和图形数量保持。不要增加新的商标，不改变领口、袖长、缝线、面料颜色、人物脸部或背景。只输出一张修正后的穿着照。", "example": "修正图3白色T恤前胸的原有印花：图1提供原印花的大小与位置，图2提供清晰图形。把原图案准确恢复到前胸，随现有褶皱弯曲、折叠和遮挡，不改人物、白色布料、版型和背景。不要复制出第二个图案。输出一张穿着照。", "example_inputs": "图1：实际衣服正面平铺照；图2：同款印花高清近照；图3：需要编辑的穿着照。图3须穿同款版型，避免同时改变剪裁和印花。", "edit": "只修正{{褶皱位置}}的印花连续性，按图2恢复可见图案，保持原褶皱、遮挡及其余图案位置。", "variants": {}, "variants_format": "complete", "usage_note": "具体示例适用于白色T恤；其他衣物使用模板。看不见的印花部分保留遮挡，不展开衣服补画。", "adaptation": ["依据2.5图像编辑定位设计具体电商任务；正文为本库原创，不是官方案例译文。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:EC27", "source_type": "original", "task": "商品展示", "product_category": "服装", "requires_reference": true, "path": "prompts/ecommerce/EC27.md", "reference": "需要", "has_result": false}, {"id": "EC28", "title": "饰品镶嵌与链节细节", "category": "饰品", "group": "ecommerce", "kind": "本库原创设计", "use": "饰品镶嵌与链节细节：围绕实际商品素材处理一个明确问题。", "size": "1024x1024", "inputs": "图1：饰品完整正面照；图2：需要展示的真实微距近照，能看清镶爪、宝石或链节。不要拿渲染图替代结构证据。", "variables": {"细节部位": "吊坠与链条连接处"}, "prompt": "以图2为主要图像，制作{{细节部位}}的饰品细节图。图1只用于确认它属于同一件饰品与整体朝向。保留图2可见的镶爪数量、宝石轮廓、链节连接顺序、焊接位置和金属颜色；使用柔和侧光提高已有边缘的可辨识度，背景简洁且适度虚化。不要增加宝石、加粗链条、隐藏连接孔或把正常接缝抹平。禁止新增闪光星芒和无法从照片确认的材质、纯度标识。保持原观察角度，不生成背面或新切面。输出一张细节图片。", "example": "把图2的吊坠与链条连接处整 <script>

function render(){const query=$('q').value.trim().toLowerCase(),list=data.filter(e=>(!query||[e.id,e.title,e.prompt,e.inputs].join(' ').toLowerCase().includes(query))&&['task','product_category','reference'].every(k=>!$(k).value||e[k]===$(k).value)&&(!$('result').value||e.has_result===($('result').value==='yes')));$('count').textContent=`${list.length} / ${data.length} 条提示词`;$('empty').hidden=!!list.length;$('cards').replaceChildren();for(const e of list){const a=el('article');if(e.preview){const img=el('img');img.loading='lazy';img.src=e.preview.startsWith('https://')?e.preview:'../'+e.preview;img.alt=e.title+(e.has_result?' · 生成示例':' · 原库参考');img.onerror=()=>{img.replaceWith(el('div','图片暂时无法加载','placeholder'))};a.append(img)}else a.append(el('div',e.product_category,'placeholder'));const b=el('div',null,'body');b.append(el('span',`${e.id} · ${e.has_result?(e.result_label||'生成示例'):e.preview?'原库参考图':'暂无生成示例'}`,'tag'),el('h2',e.title),el('p',e.use||e.task,'muted'));const button=el('button','打开提示词');button.onclick=()=>open(e);b.append(button);a.append(b);$('cards').append(a)}}
let selected=null;function open(e){selected=e;$('title').textContent=e.title;$('kind').textContent=e.kind;$('inputs').textContent=e.inputs;$('note').textContent=e.usage_note||'';$('source').href=repo+e.path;$('version').replaceChildren();if(e.example)$('version').add(new Option('具体示例 · 准备素材后直接复制','example'));$('version').add(new Option('完整提示词 · 变量模板','prompt'));for(const key of Object.keys(e.variants||{}))$('version').add(new Option(key,'variant:'+key));showPrompt();$('detail').showModal()}

$('version').onchange=showPrompt;$('close').onclick=()=>$('detail').close();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').textContent);$('status').textContent='已复制，可粘贴到图像生成工具。'}catch{const range=document.createRange();range.selectNodeContents($('prompt'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('status').textContent='浏览器未允许自动复制。正文已选中，请按 Ctrl+C 或长按复制。'}};
