ategory": "非商品专项", "reference": "需要", "has_result": false, "tags": ["包装", "镭射", "角度", "材质"]}, {"id": "G47", "title": "夜光表盘明暗状态序列", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "按照同一腕表的带时间记录实拍，展示常规光、关灯即刻和指定时点的表盘状态，不虚构夜光持续时间。", "size": "2048x1152", "inputs": "图1：腕表正面常规光；图2：同一表位关灯即刻实拍；图3：同一表位在记录时点的实拍；图4：表盘刻度和指针微距。提供真实时点标签、夜光区域清单和准确说明。", "variables": {"腕表": "黑色潜水风格腕表", "三个状态": "常规光、关灯即刻、10分钟实拍", "夜光区域": "时针、分针和十二枚时标", "标题": "同一表盘，三次记录", "说明": "亮度受充光、环境与拍摄设置影响"}, "prompt": "依据图1至图4制作16:9三栏{{腕表}}表盘状态记录。三栏依次标“常规光”“关灯即刻”“10分钟实拍”，保持同一腕表、同一表针时刻、表冠方向、镜头距离、裁切和相机设置；表壳、表圈、文字、刻度数量与图4一致。第一栏按图1呈现；第二栏只按图2点亮{{夜光区域}}；第三栏只按图3呈现记录时点可见的相对亮度与范围，不人为增强到与第二栏相同。暗处发光服从指针和时标真实形状，不添加发光数字、刻度、外圈或背景光晕。顶部只写“{{标题}}”，底部写“{{说明}}”。不推断夜光材料、充光时长、可读距离、续航、潜水性能、认证或其他时点表现。只输出一张三栏记录图。", "example": "制作16:9黑色潜水风格腕表三栏记录，依次标“常规光”“关灯即刻”“10分钟实拍”。三栏保持同一表、同一表针时刻、表冠方向、距离和设置；第一栏按图1，第二栏按图2只点亮时针、分针和十二枚时标，第三栏按图3保持10分钟记录的实际相对亮度，不增强成第二栏。顶部只写“同一表盘，三次记录”，底部写“亮度受充光、环境与拍摄设置影响”。不写材料、续航、潜水或认证。只输出一张图。", "example_inputs": "准备同一腕表、固定相机参数和明确时间记录的三张照片；若曝光或充光条件不同，应先重拍，不能用生成图补齐性能序列。", "edit": "只修正“{{状态标签}}”一栏的{{发光区域、相对亮度或表盘结构问题}}，按图{{参考图号}}恢复；其他栏与时间标签不变。", "variants": {}, "variants_format": "complete", "usage_note": "这是给定拍摄条件下的视觉记录，不是夜光持续时间、材料等级或使用性能测试。", "adaptation": ["在G35腕表技术图鉴之外新增时间绑定的可见状态任务，强调同一表针、同一设置和不外推缺失时点。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:G47", "source_type": "original", "path": "prompts/gallery/G47.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["腕表", "夜光", "状态", "时间"]}, {"id": "G48", "title": "可刮涂层揭示三状态物料", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "将已审定底图与遮盖层组合成未刮、刮开中、完全揭示三状态物料提案，不生成真实兑奖或量产承诺。", "size": "2048x1152", "inputs": "图1：完整卡面版式；图2：获准遮盖层形状与颜色；图3：遮盖层下已审定内容；图4：真实刮开边缘和碎屑参考。提供状态名称、刮开路径、准确文案与非兑奖说明。", "variables": {"物料": "咖啡店会员惊喜卡", "遮盖区": "中央圆角矩形银灰涂层", "底层内容": "一枚黄色笑脸与文字“今天也很棒”", "刮开路径": "从左下向右上弧形", "标题": "刮开一句好心情"}, "prompt": "依据图1至图4制作16:9三栏{{物料}}状态提案。三栏依次标“未刮开”“刮开中”“已揭示”，保持同一卡面尺寸、纸张、边距、品牌区和背景。左栏完整显示图2{{遮盖区}}，底层不可透出；中栏只沿{{刮开路径}}移除约一半涂层，边缘和少量碎屑按图4，露出的图3内容与最终位置严格对齐；右栏移除涂层并完整显示图3{{底层内容}}，不残留遮挡关键文字。三栏的底层内容只能来自图3，不能改字、换图或生成随机奖项。顶部只写“{{标题}}”，底部小字写“视觉提案，不代表兑奖或印刷成品”。不要添加金额、概率、二维码、兑换码、有效期、中奖、可兑奖、涂层配方或生产参数。只输出一张三栏提案图。", "example": "制作16:9咖啡店会员惊喜卡三栏提案，依次标“未刮开”“刮开中”“已揭示”。同一卡面和品牌区不变。左栏完整银灰圆角涂层，不透底；中栏从左下向右上刮开约一半，边缘与碎屑按图4，已露内容和图3对齐；右栏完整显示黄色笑脸与“今天也很棒”。顶部只写“刮开一句好心情”，底部写“视觉提案，不代表兑奖或印刷成品”。不加金额、概率、码、有效期或中奖信息。只输出一张图。", "example_inputs": "准备卡面、遮盖层、底层审定内容与真实材料刮开参考；若活动涉及奖项、概率和兑换，必须由业务系统另行提供并审核。", "edit": "只修正“{{状态名}}”一栏的{{刮开面积、边缘、碎屑或底层对齐问题}}，按图{{参考图号}}恢复；其他两栏与卡面文字不变。", "variants": {}, "variants_format": "complete", "usage_note": "概念图不生成或验证奖项、概率、兑换信息与生产参数，也不能替代实物涂层打样。", "adaptation": ["新增受控揭示式线下物料任务，三状态共享同一底层内容与刮开路径；区别于G45封签证据图，目标是创意提案而非包装状态核对。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:G48", "source_type": "original", "path": "prompts/gallery/G48.md", "task": "Brand & Logos", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["涂层", "刮开", "互动", "物料"]}, {"id": "G49", "title": "遇水显纹伞面干湿对照", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "在同一把伞、同一视角下展示干燥与实拍湿润区域的图案变化，不把视觉变化解释成防水或耐久性能。", "size": "2048x1152", "inputs": "图1：完整展开雨伞干燥状态；图2：同一伞面湿润状态；图3：干湿分界微距；图4：伞骨、伞柄与边缘结构。提供实际显现图案、湿润范围和准确标题。", "variables": {"雨伞": "深蓝八骨长柄伞", "显现图案": "浅蓝云朵与短雨线", "湿润范围": "右侧四个伞面扇区", "标题": "雨落，图案出现", "说明": "仅展示所附样品在拍摄状态下的可见变化"}, "prompt": "依据图1至图4制作16:9{{雨伞}}干湿对照广告。画面只出现一把完整展开的伞，正对略俯视，伞骨、八个扇区、中心帽、伞柄和边缘按图1、图4保持。以一条自然弧形水迹将伞面分成两区：左侧四个扇区保持图1干燥深蓝状态，不出现隐藏图案；{{湿润范围}}严格按图2呈现{{显现图案}}，图案随真实扇区透视和接缝中断，颜色、密度与图2一致。分界处按图3保留水珠、湿润深浅和局部过渡，不把整把伞浸湿，不让图案越过伞边或出现在背景。背景为中性浅灰棚拍，柔光保证结构可辨。顶部只写“{{标题}}”，底部写“{{说明}}”。不添加防水等级、拒水、速干、耐洗、耐晒、可重复次数或使用寿命结论。只输出一张图。", "example": "制作16:9深蓝八骨长柄伞干湿对照广告，只出现一把完整展开的伞。左侧四个扇区保持图1干燥深蓝，不显图案；右侧四个扇区按图2显示浅蓝云朵与短雨线，图案随扇区透视并在接缝处自然中断。弧形分界按图3保留水珠和湿润过渡，伞骨、伞柄与边缘按图4。顶部只写“雨落，图案出现”，底部写“仅展示所附样品在拍摄状态下的可见变化”。不写防水、速干、耐洗或寿命。只输出一张图。", "example_inputs": "准备同一把伞的干燥、湿润、分界微距和结构照片；不同样品的图案位置不能拼成同一把伞的变化证据。", "edit": "只修正{{干燥区、湿润区或分界区}}的{{图案、扇区对齐或水迹问题}}，按图{{参考图号}}恢复；伞体、背景和文字不变。", "variants": {}, "variants_format": "complete", "usage_note": "遇水显纹是所附样品的可见状态，不证明防水、耐久、可重复次数与其他环境下表现。", "adaptation": ["将动态材质绑定到同一伞面的明确扇区和干湿分界；区别于普通雨景海报，核心是结构连续、状态局部化和性能结论隔离。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:G49", "source_type": "original", "path": "prompts/gallery/G49.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["雨伞", "遇水显纹", "干湿", "材质"]}, {"id": "G50", "title": "击凸包装平光与掠射光对照", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "用平光和掠射光对照同一包装的真实击凸区域，既展示触感线索又不虚构浮雕高度与工艺参数。", "size": "2048x1152", "inputs": "图1：包装正面平光照；图2：同机位掠射光照；图3：击凸区域微距；图4：审定包装平面稿。提供击凸区域清单、光线方向和准确标题。", "variables": {"包装": "象牙白巧克力礼盒", "击凸区域": "中央可可果轮廓与品牌名外框", "掠射光方向": "从画面左侧约15度贴面扫过", "标题": "光掠过，层次出现", "说明": "以实物照片可见起伏为准"}, "prompt": "依据图1至图4制作16:9左右对照的{{包装}}工艺展示。左右两栏保持同一礼盒正面、尺寸、机位、裁切、象牙白底色、文字和图案位置，版面以图4为准。左栏标“均匀柔光”，按图1呈现克制的平面外观；右栏标“掠射光”，光线{{掠射光方向}}，只在图2、图3证实的{{击凸区域}}形成连续高光边与短阴影，起伏服从原轮廓，不扩大、不新增浮雕文字。普通印刷区、烫印区、盒边和背景不得出现同样浮雕。两栏礼盒都完整正对，不用夸张斜角。顶部只写“{{标题}}”，底部写“{{说明}}”。不生成击凸高度、纸张克重、模具、压力、工艺名称认证、触感优劣或量产偏差结论。只输出一张对照图。", "example": "制作16:9象牙白巧克力礼盒左右工艺对照。两栏保持同一礼盒正面和图4版面。左栏“均匀柔光”按图1；右栏“掠射光”从左侧约15度贴面扫过，只让图2、图3证实的中央可可果轮廓与品牌名外框出现高光边和短阴影，其他印刷区、盒边和背景不浮雕。顶部只写“光掠过，层次出现”，底部写“以实物照片可见起伏为准”。不写高度、克重、模具、压力或量产结论。只输出一张图。", "example_inputs": "准备同一礼盒同机位的平光、掠射光、击凸微距和审定平面稿；仅有平面稿时不能凭效果图确定真实起伏。", "edit": "只修正{{左栏或右栏}}中{{击凸区域}}的{{轮廓、高光边或短阴影问题}}，按图{{参考图号}}恢复；包装文字、其他工艺区和另一栏不变。", "variants": {}, "variants_format": "complete", "usage_note": "画面用于展示实拍可见起伏，不是击凸高度、纸张、模具压力与量产质量的测量报告。", "adaptation": ["将微距工艺证据与同机位双光型对照组合，区别于普通材质微距和G46综合色移，核心是击凸区域白名单与短阴影方向。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:G50", "source_type": "original", "path": "prompts/gallery/G50.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["包装", "击凸", "掠射光", "工艺"]}, {"id": "G51", "title": "磁吸配件三阶段对位说明", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "把主件、磁吸配件和真实连接面拆成靠近前、对位中、吸附后三阶段，说明安装方向而不虚构磁力与兼容性。", "size": "2048x1152", "inputs": "图1：主件正面与连接区；图2：磁吸配件正反面；图3：真实吸附完成状态；图4：说明书中的方向与允许连接组合。提供连接区名称、对位标记和准确步骤短句。", "variables": {"主件": "黑色桌面台灯底座", "配件": "圆形磁吸遥控器", "连接区": "底座右前方圆形凹位", "对位标记": "遥控器白点朝向底座白线", "标题": "靠近，对准，放稳"}, "prompt": "依据图1至图4制作16:9三栏{{配件}}对位说明。三栏使用同一{{主件}}、同一机位、比例、桌面和柔光，主件结构与{{连接区}}不变。第一栏标“1 靠近”：配件完整离开连接区约一个配件宽度，正反面方向按图2；第二栏标“2 对准”：配件悬停在连接区正上方，严格显示{{对位标记}}，只用一条细直箭头表示移动方向，不画磁力线；第三栏标“3 放稳”：按图3显示配件与连接区真实贴合，边缘、凹位、遮挡和朝向一致。每栏主件与配件各一件，不复制、穿插或生成隐藏磁铁、线圈、触点和内部结构。顶部只写“{{标题}}”。不添加磁力强度、承重、充电、供电、防脱、兼容型号或安全结论，除非图4逐项明确提供且本次文案获准。只输出一张三栏说明图。", "example": "制作16:9圆形磁吸遥控器三栏对位说明。同一黑色桌面台灯底座和右前方圆形凹位保持。第一栏“1 靠近”：遥控器离开凹位约一个配件宽度；第二栏“2 对准”：遥控器在凹位正上方，白点朝向底座白线，只画一条向下直箭头；第三栏“3 放稳”：按图3真实贴合。每栏各一套，不画磁力线或内部磁铁。顶部只写“靠近，对准，放稳”。不写磁力、承重、充电、防脱或兼容型号。只输出一张图。", "example_inputs": "准备主件连接区、配件正反面、实际吸附完成照和说明书；没有完成照或说明书时只做位置概念，不能确认连接能力。", "edit": "只修正第{{步骤号}}栏的{{配件朝向、间距、箭头或贴合问题}}，按图{{参考图号}}恢复；其他两栏、主件和标题不变。", "variants": {}, "variants_format": "complete", "usage_note": "三阶段图说明可见位置关系，不证明磁力、承重、充电、防脱、安全与跨型号兼容。", "adaptation": ["将配件身份、连接区、方向规则与完成状态分别取证；区别于EC43线材接口和普通步骤图，核心是磁吸对象的三阶段空间对位与隐藏结构禁推。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:G51", "source_type": "original", "path": "prompts/gallery/G51.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["磁吸", "配件", "对位", "结构"]}, {"id": "G52", "title": "双面夹克两面穿同人对照", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "让同一人物以同一姿态分别展示双面夹克的A面与B面，保持内外层、口袋和闭合结构不串面。", "size": "2048x1152", "inputs": "图1：夹克A面正面；图2：夹克B面正面；图3：领口、袖口、拉链与翻面结构；图4：获准成年人物全身照。提供两面名称、各自特征清单和准确标题。", "variables": {"夹克": "双面穿短款夹克", "A面": "深海军蓝面，左胸白色小标，两侧斜插袋", "B面": "浅灰面，无胸标，两侧竖向贴袋", "标题": "翻一面，换一种表达", "人物造型": "白色长裤与黑色低帮鞋"}, "prompt": "依据图1至图4制作16:9左右对照服饰广告。左右两栏保持图4同一成年人物身份、脸部、发型、体型、正面自然站姿、裁切与{{人物造型}}。左栏标“A面”，穿着图1{{夹克}}的{{A面}}；右栏标“B面”，穿着图2的{{B面}}。两栏衣长、肩宽、袖长、下摆、领口和拉链位置一致，翻面关系按图3；A面的胸标与斜插袋只在左栏，B面的无胸标与竖向贴袋只在右栏，不把两面特征混在同一件衣服上。夹克自然贴合相同姿势，褶皱与遮挡可信，不出现双层领口、额外口袋、第二件外套或镜像文字。浅灰棚拍背景与同一柔光。顶部只写“{{标题}}”。不添加保暖、防水、透气、面料成分、尺码适配或穿着舒适结论。只输出一张对照图。", "example": "制作16:9双面穿短款夹克左右对照。同一成年人物、正面站姿、白色长裤和黑色低帮鞋。左栏“A面”：深海军蓝、左胸白色小标、两侧斜插袋；右栏“B面”：浅灰、无胸标、两侧竖向贴袋。衣长、肩袖、下摆、领口和拉链一致，翻面结构按图3，不串面、不加口袋或第二件外套。顶部只写“翻一面，换一种表达”。不写保暖、防水、面料或尺码结论。只输出一张图。", "example_inputs": "准备同一件夹克A/B面、翻面结构和获准人物照；只有平铺照时不要凭空生成不可见的内外连接细节。", "edit": "只修正{{A面或B面}}栏的{{颜色、标志、口袋或翻面结构问题}}，按图{{参考图号}}恢复；人物、姿态、另一栏和标题不变。", "variants": {}, "variants_format": "complete", "usage_note": "两面特征必须分别由真实照片支持，视觉对照不证明面料成分、功能、尺码与舒适度。", "adaptation": ["把同人试穿与双面服饰逐面身份绑定，区别于普通多配色和印花恢复；核心是两面特征互斥、共享结构不漂移。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:G52", "source_type": "original", "path": "prompts/gallery/G52.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["服饰", "双面穿", "人物", "对照"]}, {"id": "G53", "title": "可转换饰品两种成品状态", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "用组件清点和两张真实成品照展示同一套饰品的两种组合状态，避免变形、漏件和凭空增加连接件。", "size": "2048x1152", "inputs": "图1：全部组件平铺清点；图2：项链状态成品照；图3：双圈手链状态成品照；图4：扣头与连接环微距。提供组件数量表、两状态名称和准确标题。", "variables": {"饰品": "金色可转换链饰", "组件清单": "长链1条、圆形吊坠1枚、龙虾扣1个、连接环2个", "状态一": "长链项链", "状态二": "双圈手链", "标题": "同一组组件，两种佩戴方式"}, "prompt": "依据图1至图4制作16:9{{饰品}}结构对照。上方中央用一行小型清点区展示{{组件清单}}，每件只出现一次并标准确短名。下方左右两栏：左栏“{{状态一}}”严格按图2展示完整成品；右栏“{{状态二}}”严格按图3展示完整成品。两栏均使用同一组组件的外观、链节形状、颜色、吊坠正面、扣头和连接环，连接位置以图4为准；两种状态分别完整呈现，不在同一栏同时放散件。不得改变链节数量观感、复制吊坠、隐藏必要扣件、生成额外延长链或让金属穿插。白色背景、柔和侧光，金属反射克制。顶部只写“{{标题}}”。不添加贵金属纯度、宝石、重量、尺寸、牢固度、过敏安全或所有人均可佩戴结论。只输出一张图。", "example": "制作16:9金色可转换链饰结构对照。上方清点区各一次展示“长链1条、圆形吊坠1枚、龙虾扣1个、连接环2个”。下方左栏“长链项链”按图2，右栏“双圈手链”按图3；链节、吊坠、扣头和连接环一致，连接处按图4。不复制吊坠、不漏扣件、不加延长链或散件。顶部只写“同一组组件，两种佩戴方式”。不写纯度、重量、牢固、抗敏或尺寸适配。只输出一张图。", "example_inputs": "准备全部组件平铺和两种真实完成状态；如果两种状态使用了不同配件，应分别列清，不能写成同一组组件守恒。", "edit": "只修正{{清点区、状态一或状态二}}的{{组件数量、连接位置或链节问题}}，按图{{参考图号}}恢复；其他区域和标题不变。", "variants": {}, "variants_format": "complete", "usage_note": "只有两种真实完成照和组件表一致时才可称转换状态；图片不证明金属材质、牢固与佩戴安全。", "adaptation": ["将多状态商品与组件守恒结合，区别于EC41佩戴比例和EC47厨具嵌套；核心是同组小型连接件在两种成品中的可追踪归属。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:G53", "source_type": "original", "path": "prompts/gallery/G53.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["饰品", "组件", "转换", "清点"]}, {"id": "G54", "title": "鞋带逐孔穿线路径说明", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "在真实鞋面上按孔位编号展示鞋带从起点到终点的穿线路径，避免错孔、跳孔、镜像和凭空增加鞋带。", "size": "1536x1920", "inputs": "图1：鞋面俯视完整照；图2：无鞋带或松开状态；图3：正确系带完成照；图4：鞋带孔与鞋舌微距。提供左右孔位编号、起点、路径表和结尾方式。", "variables": {"鞋款": "灰白六组孔低帮鞋", "路径": "L1→R1→L2→R2→L3→R3→L4→R4→L5→R5→L6→R6", "起点": "鞋头侧第一组孔", "结尾": "第六组孔上方对称蝴蝶结", "标题": "按孔位完成系带"}, "prompt": "依据图1至图4制作4:5{{鞋款}}穿线说明图。主体是一只鞋面俯视图，鞋楦、鞋舌、六组孔、缝线、色块和鞋口按图1、图4保持。用小号圆点在左列依次标L1至L6、右列标R1至R6，标记紧邻对应孔但不遮孔。鞋带只有一根，起点为{{起点}}，严格按{{路径}}逐段穿过，每个孔只穿一次；上下遮挡与图3一致，不跳孔、不复制鞋带、不穿过鞋面实体。末端按{{结尾}}，左右长度观感一致。右侧用六条短句列步骤，每条只对应一组左右孔，不增加性能说明。顶部只写“{{标题}}”。浅灰背景、均匀柔光。不要添加快速系带器、防滑结、支撑、包裹、运动表现或安全结论。只输出一张说明图。", "example": "制作4:5灰白六组孔低帮鞋穿线说明。鞋面俯视，左孔标L1–L6、右孔标R1–R6。一根鞋带从鞋头侧第一组孔开始，按L1→R1→L2→R2→L3→R3→L4→R4→L5→R5→L6→R6穿过，每孔一次，上下遮挡按图3，最后在第六组孔上方形成对称蝴蝶结。不跳孔、不复制鞋带、不穿过鞋面。顶部只写“按孔位完成系带”。不写防滑、支撑、包裹或运动性能。只输出一张图。", "example_inputs": "准备清晰俯视、松开态、完成态和孔位微距，并人工确认路径表；左右孔位或穿线方式不同的鞋款需重写路径。", "edit": "只修正{{孔位或路径段}}的{{穿孔顺序、上下遮挡或鞋带走向问题}}，按图{{参考图号}}恢复；其他孔位、鞋体和标题不变。", "variants": {}, "variants_format": "complete", "usage_note": "路径图只说明所附鞋款的外观系带顺序，不证明支撑、舒适、安全与运动性能。", "adaptation": ["把底图锚点和步骤顺序落到真实鞋孔拓扑，区别于EC33结构卡和T29通用步骤图；核心是单根鞋带、逐孔唯一和上下遮挡。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:G54", "source_type": "original", "path": "prompts/gallery/G54.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["鞋靴", "鞋带", "路径", "步骤"]}, {"id": "G55", "title": "箱包肩带三档实测长度对照", "category": "精选创意", "group": "gallery", "kind": "本库原创设计", "use": "把同一箱包肩带的三处扣具位置与实测长度一一绑定，展示调节范围而不从人物图推断适配身高和承重。", "size": "2048x1152", "inputs": "图1：箱包正面；图2：肩带、调节扣与挂钩全长；图3至图5：短、中、长三档实拍；图6：人工实测长度表。提供测量口径、三档数值和准确标题。", "variables": {"箱包": "黑色尼龙斜挎包", "测量口径": "从左挂钩内缘沿肩带中心线到右挂钩内缘", "三档": "短档72厘米、中档96厘米、长档120厘米", "标题": "三档长度，一图对照", "说明": "尺寸为当前样品人工平铺测量"}, "prompt": "依据图1至图6制作16:9{{箱包}}肩带三档对照。画面分三栏，依次标“短档 72厘米”“中档 96厘米”“长档 120厘米”，分别严格使用图3、图4、图5的调节扣位置与肩带余量；每栏显示同一只包和一条完整肩带，包体尺寸、口袋、拉链、挂点与图1一致，挂钩和调节扣结构按图2。肩带采用相同平铺弧线，长度差通过真实调节扣位置和余量呈现，不拉伸织带纹理、不复制调节扣、不改变挂点。每栏下方用一条细尺寸线表示{{测量口径}}，数值只取图6{{三档}}，不从画面计算。顶部只写“{{标题}}”，底部写“{{说明}}”。不添加适配身高、背法、容量、承重、耐磨、人体工学或测量公差结论。只输出一张三栏对照图。", "example": "制作16:9黑色尼龙斜挎包肩带三档对照。三栏分别为“短档 72厘米”“中档 96厘米”“长档 120厘米”，调节扣位置和余量按图3至图5。同一包体、挂点、挂钩和一条完整肩带，不拉伸纹理、不复制扣具。尺寸线按“从左挂钩内缘沿肩带中心线到右挂钩内缘”，数字只取图6。顶部只写“三档长度，一图对照”，底部写“尺寸为当前样品人工平铺测量”。不写适配身高、容量、承重或人体工学。只输出一张图。", "example_inputs": "准备同一包体、肩带结构、三档实拍和人工测量表；测量口径不同的数值不能放在同一对照中。", "edit": "只修正“{{档位}}”栏的{{调节扣位置、肩带余量、尺寸线或数值问题}}，按图{{参考图号}}和实测表恢复；其他两栏与包体不变。", "variants": {}, "variants_format": "complete", "usage_note": "长度来自人工实测表而非图像估算；三档对照不证明适配身高、舒适度、容量和承重。", "adaptation": ["将箱包调节状态、扣具位置和统一测量口径绑定，区别于普通尺寸图与多角度网格；核心是三档实拍和数字外部输入的一一对应。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:G55", "source_type": "original", "path": "prompts/gallery/G55.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["箱包", "肩带", "长度", "状态"]}, {"id": "T38", "title": "商品参考素材职责清点板", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在正式生成系列素材前，把每张商品参考图、可见范围和唯一职责整理成带编号的清点板，减少后续串图与补造。", "size": "2048x1152", "inputs": "图1起：本次商品的全部原始照片与资料截图；提供图片编号、来源、拍摄面、唯一职责、可见限制和缺失项清单。", "variables": {"商品身份": "墨绿色不锈钢保温杯，样品编号CUP-07", "素材职责表": "图1→正面轮廓与杯盖；图2→背面标签；图3→杯口与螺纹；图4→包装准确文字；图5→人工实测尺寸", "缺失项": "杯底、内胆底部、装箱配件", "标题": "商品参考素材职责清点", "禁止推断": "容量、保温时长、材质等级、未拍摄结构"}, "prompt": "依据所附原始素材制作16:9“{{标题}}”板。顶部只写商品身份“{{商品身份}}”。中部按图号从左到右、从上到下排列每张原图的等比例缩略图，不重绘、不换背景、不修商品、不合成新视角；每张只出现一次，完整保留其原始裁切。缩略图下方严格按{{素材职责表}}写“图号｜唯一职责｜可见限制”，不从照片新增职责。右侧单独设置“缺失项”栏，只写“{{缺失项}}”；底部设置“禁止推断”栏，只写“{{禁止推断}}”。使用白底、深灰文字、蓝色图号标签与清晰表格线。不要评价图片质量、真假、合规、性能和是否足够，不生成缺失视角、参数、配件、结论或推荐。只输出一张职责清点板。", "example": "制作16:9“商品参考素材职责清点”板，顶部写“墨绿色不锈钢保温杯，样品编号CUP-07”。按图号排列原图缩略图，不重绘或补视角。图1“正面轮廓与杯盖”；图2“背面标签”；图3“杯口与螺纹”；图4“包装准确文字”；图5“人工实测尺寸”。右侧“缺失项”只写“杯底、内胆底部、装箱配件”；底部“禁止推断”只写“容量、保温时长、材质等级、未拍摄结构”。不评价真假或质量，不生成缺失内容。只输出一张图。", "example_inputs": "先由人给每张素材指定唯一职责与缺失项；清点板用于沟通和索引，后续生成仍应重新附原始图片，不能用缩略图板替代原图。", "edit": "只修正图{{图号}}下方的{{职责、限制或编号}}为“{{准确内容}}”；所有缩略图、其他文字与布局不变。", "variants": {}, "variants_format": "complete", "usage_note": "职责由人确认，不由模型看图推断；清点板不是新的商品事实源，也不能替代后续任务中的原始高清图。", "adaptation": ["把多参考图职责分离前移到生产链入口，区别于T31冲突处理；本卡先建立素材索引与缺失项，后续每个任务仍引用原始图。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T38", "source_type": "original", "path": "prompts/templates/T38.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "按卡片说明", "has_result": false, "tags": ["素材", "职责", "清点", "生产链"]}, {"id": "T39", "title": "人工差异清单标注板", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把已生成候选稿与原始商品参考并排，并只标注人工已经确认的差异，形成下一轮可定位的返工依据。", "size": "2048x1152", "inputs": "图1：原始商品主参考；图2起：负责具体属性的原图；最后一图：待验收候选稿。提供人工差异清单，含编号、候选稿坐标、问题、正确参考和期望状态。", "variables": {"候选稿编号": "V03", "差异清单": "D1 候选稿杯盖顶部：比例偏高→按图1；D2 候选稿正面标签第二行：字序错误→按图2；D3 候选稿右侧金属边：被删失→按图3", "标题": "V03 人工差异标注", "保护项": "杯身墨绿色、商品位置、背景、阴影与标题区域", "结论": "返工：仅处理D1–D3"}, "prompt": "依据原始参考与待验收候选稿制作16:9“{{标题}}”板。左侧30%展示图1商品主参考及图2起属性参考的缩略图，每张标原图号，不重绘。右侧70%完整展示候选稿{{候选稿编号}}，保持候选稿像素内容，不直接修正。只按人工提供的{{差异清单}}叠加D1、D2、D3圆点与细引线；圆点必须落在清单指定的候选稿部位，右侧说明区逐字写“编号｜问题｜正确参考｜期望状态”。另设“保护项”栏，只写“{{保护项}}”；底部结论只写“{{结论}}”。白底、红色问题编号、蓝色原图编号，文字清楚。不要自行寻找新差异、评价美观、计算相似度、给分、判断真伪或改动候选稿。只输出一张人工差异标注板。", "example": "制作16:9“V03 人工差异标注”板。左侧放图1至图3原始参考缩略图；右侧完整放V03候选稿，不修图。只标三项：D1杯盖顶部比例偏高，按图1；D2正面标签第二行字序错误，按图2；D3右侧金属边被删失，按图3。圆点落到指定部位并以细引线连接说明。保护项只写“杯身墨绿色、商品位置、背景、阴影与标题区域”；底部只写“返工：仅处理D1–D3”。不新增问题、评分或相似度。只输出一张图。", "example_inputs": "差异必须先由人工核对并写明位置与正确参考；模型只负责排版标注，不负责自动视觉质检。", "edit": "只修正差异项{{编号}}的{{圆点位置、引线或说明文字}}为“{{准确内容}}”；候选稿、原始参考、其他差异与保护项不变。", "variants": {}, "variants_format": "complete", "usage_note": "没有进入人工清单的问题不应由模型新增；此板是返工沟通物，不是自动质检或真实性鉴定结果。", "adaptation": ["把人工验收结果转换为可定位视觉任务单，区别于T34技术引线和T27连续编辑锁定；核心是候选稿不修、差异不推断、每项绑定正确原图。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:T39", "source_type": "original", "path": "prompts/templates/T39.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["验收", "差异", "标注", "返工"]}, {"id": "T40", "title": "已验收主视觉渠道裁切预演板", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在真正重排前，用已验收主视觉预演多个渠道画框会裁掉什么，帮助确定保护项与后续单渠道任务。", "size": "2048x1152", "inputs": "图1：已验收主视觉；图2：人工标记的保护项与可裁区域；提供三个真实目标比例、各自安全区坐标、渠道名称和准确结论。", "variables": {"主视觉": "4:5新品保温杯海报V05", "渠道规格": "淘宝主图1:1；小红书封面3:4；横版广告16:9", "保护项": "完整杯体、左上标题、右下品牌标志", "可裁区域": "背景两侧落叶与下方空台面", "标题": "渠道裁切预演", "结论": "16:9需要另行重排；1:1与3:4可进入单渠道适配"}, "prompt": "依据图1、图2制作16:9“{{标题}}”板，用于预演{{主视觉}}，不是输出最终渠道成品。左侧保留一张完整图1作为母版，叠加图2的保护项轮廓但不改像素。右侧三栏分别标{{渠道规格}}中的渠道与比例，每栏把同一图1等比例放入对应画框，只允许移动裁切框，不拉伸、不补背景、不重排、不改文字；使用实线框标人工提供的安全区，半透明灰色覆盖将被裁掉的部分。{{保护项}}用绿色轮廓，{{可裁区域}}用浅灰轮廓；若保护项超出安全区，明确显示红色越界段，不自动缩小或修复。底部只写“{{结论}}”。不要猜平台像素、UI遮挡、推荐尺寸或审核规则，不生成最终适配图、评分和自动通过结论。只输出一张裁切预演板。", "example": "制作16:9“渠道裁切预演”板，母版为4:5新品保温杯海报V05。左侧完整保留图1并叠加图2保护项。右侧三栏为“淘宝主图1:1”“小红书封面3:4”“横版广告16:9”，同一图1只移动裁切框，不拉伸、补背景或重排。完整杯体、左上标题、右下品牌标志标绿；背景两侧落叶和下方空台面标浅灰；超出安全区的保护项标红。底部只写“16:9需要另行重排；1:1与3:4可进入单渠道适配”。不猜平台像素和规则。只输出一张图。", "example_inputs": "目标比例和安全区必须由当前渠道规范或设计人员提供；预演完成后，每个渠道仍应使用T26/T33等单独生成并验收。", "edit": "只修正{{渠道栏}}的{{裁切框、安全区或越界标记}}为“{{准确状态}}”；母版、其他渠道栏、保护项和结论不变。", "variants": {}, "variants_format": "complete", "usage_note": "预演板不代表渠道适配已完成；平台规格有时效性，必须使用任务当时提供的真实比例与安全区。", "adaptation": ["把跨比例任务拆成前置裁切风险预演与后续单渠道重排，区别于T26直接适配；本卡锁定母版像素，只显示保护项越界。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T40", "source_type": "original", "path": "prompts/templates/T40.md", "task": "Documents & Publishing", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["裁切", "安全区", "渠道", "预演"]}, {"id": "T41", "title": "审定文案与上屏区域对应表", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在正式上屏前，把每段审定文案、唯一目标区域和允许换行逐项对应，避免错放、漏字和模型续写。", "size": "2048x1152", "inputs": "图1：带区域编号的版式草图；图2：当前已验收主视觉，可选；提供文案编号、准确全文、目标区域、允许换行、字号层级和禁止拆分词表。", "variables": {"项目": "秋季保温杯主视觉", "文案表": "C1→区域A→秋日轻启→单行→主标题；C2→区域B→新品上架→单行→副标题；C3→区域C→容量：500毫升→单行→规格", "禁止拆分词": "秋日轻启、500毫升", "空白区域": "区域D保持空白", "标题": "审定文案上屏表"}, "prompt": "依据图1制作16:9“{{标题}}”，项目名只写“{{项目}}”。左侧完整放置图1版式草图，保留区域A至D的位置与比例，不生成正式商品图；若提供图2，只在角落以小缩略图显示并标“已验收主视觉”，不改图。右侧按{{文案表}}逐行排成五列表格：“编号｜准确全文｜目标区域｜允许换行｜层级”，每段文字逐字复制，不翻译、不润色、不补标点。用同色细线把C1、C2、C3连接到图1对应区域，连线不交叉、不串位。单独写“禁止拆分词：{{禁止拆分词}}”和“{{空白区域}}”。不要把文案真正贴入主视觉，不推测字体、字号数值、平台规范、字数上限或溢出是否可接受，不新增广告语、价格和按钮。只输出一张对应表。", "example": "制作16:9“审定文案上屏表”，项目名“秋季保温杯主视觉”。左侧放区域A至D版式草图；右侧表格逐行写：C1｜秋日轻启｜区域A｜单行｜主标题；C2｜新品上架｜区域B｜单行｜副标题；C3｜容量：500毫升｜区域C｜单行｜规格。连线分别到A、B、C，不交叉。另写“禁止拆分词：秋日轻启、500毫升”“区域D保持空白”。不把文案贴进正式主视觉，不翻译、续写或猜字号。只输出一张图。", "example_inputs": "文案须先由业务或编辑逐字审定，并由设计人员给出区域与换行；对应表是上屏任务输入，不替代最终成品逐字校对。", "edit": "只修正文案{{编号}}的{{准确全文、目标区域、换行或层级}}为“{{正确内容}}”；版式草图、其他文案与空白区规则不变。", "variants": {}, "variants_format": "complete", "usage_note": "模型只排版人已审定的映射，不负责写文案、翻译或判断能否容纳；正式上屏后仍需人工逐字核对。", "adaptation": ["把T23/T24的文字编辑前移到定稿交接，以文案编号和区域编号建立唯一映射；区别于直接改图，本卡不生成正式视觉。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T41", "source_type": "original", "path": "prompts/templates/T41.md", "task": "Posters & Typography", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["文案", "区域", "换行", "定稿"]}, {"id": "T42", "title": "商品素材版本状态交接板", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "按人工版本清单展示当前可用、已替换和禁止使用的商品素材，防止后续生成混入旧包装或未审定图。", "size": "2048x1152", "inputs": "图1起：需要交接的素材版本；提供资产编号、版本号、状态、生效日期、替代关系、允许用途和禁止用途六列表。", "variables": {"商品身份": "燕麦坚果棒210克", "版本表": "A01 v3 当前可用 2026-09-13 正面包装；A02 v2 已替换→A01 禁止使用；B01 v1 当前可用 2026-09-12 背面文字核对；C01 v4 待审 不得生成", "当前组合": "正面用A01 v3；背面文字用B01 v1", "标题": "商品素材版本交接", "责任说明": "状态仅来自本次人工版本表"}, "prompt": "依据所附素材与{{版本表}}制作16:9“{{标题}}”板，顶部只写“{{商品身份}}”。每项素材按资产编号排列原图缩略图，不重绘、不合成、不校色；缩略图旁逐字写“资产编号｜版本号｜状态｜生效日期｜替代关系｜允许用途”。“当前可用”用绿色边框，“已替换”用灰色并画一条斜线，“待审”用橙色，“禁止使用”用红色边框；状态颜色只服从版本表，不由画面质量决定。中央单独写“当前组合：{{当前组合}}”，底部写“{{责任说明}}”。已替换素材必须显示其指向的新资产编号，但不得把两个版本融合成新图。不要自动选择更清晰或日期更新的素材，不判断包装合规、真伪和内容正确性，不生成新版本、补缺图或修改状态。只输出一张版本交接板。", "example": "制作16:9“商品素材版本交接”板，商品为“燕麦坚果棒210克”。A01 v3标绿“当前可用｜2026-09-13｜正面包装”；A02 v2标灰并斜线“已替换→A01｜禁止使用”；B01 v1标绿“当前可用｜2026-09-12｜背面文字核对”；C01 v4标橙“待审｜不得生成”。中央只写“当前组合：正面用A01 v3；背面文字用B01 v1”，底部写“状态仅来自本次人工版本表”。不按清晰度自动选图、不融合版本。只输出一张图。", "example_inputs": "版本号、状态、生效日期和替代关系必须来自项目清单；文件修改时间、分辨率和画面观感都不能代替审批状态。", "edit": "只修正资产{{资产编号}}的{{版本号、状态、日期、替代关系或用途}}为“{{正确内容}}”；缩略图、其他资产与当前组合不变。", "variants": {}, "variants_format": "complete", "usage_note": "交接板只可视化人工版本清单；它不读取文件系统状态，也不能证明素材已获法律、合规或品牌批准。", "adaptation": ["新增生产链版本控制的视觉交接任务，区别于T31属性冲突和T38职责清点；本卡管理同一资产的版本状态与替代关系，不做内容融合。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T42", "source_type": "original", "path": "prompts/templates/T42.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "按卡片说明", "has_result": false, "tags": ["版本", "素材", "状态", "交接"]}, {"id": "T43", "title": "单差异遮罩返工执行", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "从人工差异板中一次选一个编号，以当前合格底图、精确遮罩和唯一权威参考执行最小范围返工。", "size": "1536x1920", "inputs": "图1：当前唯一合格底图；图2：仅覆盖本轮问题的黑白遮罩；图3：该属性唯一权威原图；图4：人工差异标注板。提供差异编号、准确修改、验收点、保护项和失败回退版本。", "variables": {"差异编号": "D2", "本轮修改": "将正面标签第二行恢复为“轻盈随行”", "验收点": "四字顺序准确，沿用原字号、颜色、基线与瓶身透视，无旧字重影", "保护项": "杯盖、杯身轮廓、墨绿色、金属边、商品位置、背景、阴影、标题与D1/D3区域", "失败回退": "仍以V03原图为底图，不使用本轮失败结果"}, "prompt": "图1是当前唯一合格底图，图4只用于确认本轮差异编号{{差异编号}}，图2只定义允许重绘的遮罩，图3是本问题属性的唯一权威参考。本轮只执行：{{本轮修改}}。重绘范围不得超出图2白色区域；遮罩边缘要与图1的纹理、光向、透视和噪点自然衔接。验收点：{{验收点}}。完整锁定{{保护项}}，不处理图4中的其他差异，不顺手改字、校色、移动商品、优化背景或改变版式。若图2未覆盖完成修改所需区域，或图3证据不足，则保持图1并停止补造。{{失败回退}}。移除遮罩与编号，只输出一张本轮返工结果图。", "example": "图1是V03唯一合格底图，图4只确认差异D2，图2只定义正面标签第二行遮罩，图3是准确标签参考。本轮只把第二行恢复为“轻盈随行”。重绘不得超出白色遮罩；四字顺序准确，沿用原字号、颜色、基线和瓶身透视，不留旧字重影。锁定杯盖、杯身轮廓、墨绿色、金属边、商品位置、背景、阴影、标题与D1/D3区域。不处理其他差异。若失败，仍回到V03，不沿用失败图。移除遮罩与编号，只输出一张图。", "example_inputs": "遮罩应只覆盖一个人工确认的问题；每轮保存合格底图，失败时回到该底图，不能在失败结果上连续叠改。", "edit": "仍以图1合格底图重做{{差异编号}}，本次只修正{{失败点}}；图2遮罩、图3权威参考、保护项和其他差异保持不变。", "variants": {}, "variants_format": "complete", "usage_note": "本卡执行T39之后的单问题返工；生成式编辑不能保证遮罩外逐像素不变，仍须与底图人工比对。", "adaptation": ["将T39人工差异、T27合格底图锁定和精确遮罩连成单问题执行节点；区别于泛化连续编辑，本卡要求差异编号、权威参考与遮罩三者一致。未生图实测。"], "sources": [{"label": "官方 Sunburst 模型说明 · 编辑能力依据", "url": "https://developers.openai.com/api/docs/models/gpt-image-2.5-sunburst"}], "source_key": "original:T43", "source_type": "original", "path": "prompts/templates/T43.md", "task": "Other Use Cases", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["返工", "遮罩", "单问题", "锁定"]}, {"id": "T44", "title": "系列成品人工锁定项核对板", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把一组已生成成品与人工核对表并排，逐页显示哪些系列锁定项已确认、需返工或不适用，不让模型自行判定一致性。", "size": "2048x1152", "inputs": "图1起：系列成品；提供页码/资产编号、锁定项、人工状态、问题编号和备注五列表。状态只允许已确认、需返工、不适用。", "variables": {"系列名": "保温杯秋季活动三图", "锁定项": "商品轮廓、杯身墨绿色、标签文字、主光方向、标题左上位置", "人工核对表": "P1全部已确认；P2标签文字需返工D4，其余已确认；P3标题位置不适用，其余已确认", "标题": "系列锁定项人工核对", "结论": "P2处理D4后再进入发布清单"}, "prompt": "依据系列成品与{{人工核对表}}制作16:9“{{标题}}”板，副标题只写“{{系列名}}”。上半部按P1、P2、P3顺序等比例放置各成品缩略图，不重绘、不修正、不换裁切。下半部为核对矩阵：行是P1至P3，列严格为{{锁定项}}；每个格子的状态只从人工核对表读取，“已确认”用绿色圆点，“需返工”用红色圆点并写问题编号，“不适用”用灰色短横。若人工表没有某格状态，留白并写“未核对”，不由图像推断。底部只写“{{结论}}”。不要比较美观、计算相似度、自动发现差异、给总分、修改缩略图或把未核对写成通过。只输出一张人工核对板。", "example": "制作16:9“系列锁定项人工核对”板，副标题“保温杯秋季活动三图”。上方依次放P1、P2、P3原成品缩略图，不修图。下方矩阵列为商品轮廓、杯身墨绿色、标签文字、主光方向、标题左上位置。P1全部绿点；P2标签文字红点并写D4，其余绿点；P3标题位置灰横“不适用”，其余绿点。未提供状态就写“未核对”。底部只写“P2处理D4后再进入发布清单”。不自动找错或评分。只输出一张图。", "example_inputs": "先由人逐页填写核对矩阵；本板只负责展示结果，不能用缩略图或生成模型替代像素级、文字和商品身份检查。", "edit": "只修正资产{{页码}}在锁定项“{{锁定项}}”下的状态为“{{准确状态}}”并更新问题编号；缩略图、其他格子和结论不变。", "variants": {}, "variants_format": "complete", "usage_note": "所有状态必须来自人工核对表；绿色圆点只代表该轮人工记录，不是模型自动验证或正式发布批准。", "adaptation": ["把T30系列一致性生成后的验收结果结构化，区别于T39单图差异标注；本卡跨页展示人工状态矩阵，不从缩略图自行找错。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T44", "source_type": "original", "path": "prompts/templates/T44.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "按卡片说明", "has_result": false, "tags": ["系列", "锁定项", "核对", "验收"]}, {"id": "T45", "title": "失败轮次回退证据板", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把连续编辑中的合格底图、失败轮次和回退目标按人工日志排成证据链，防止误在失败图上继续叠改。", "size": "2048x1152", "inputs": "图1起：各轮保存图；提供版本号、父版本、人工状态、唯一改动、失败点和下一步六列表。状态只允许合格、失败、待验收。", "variables": {"任务": "保温杯海报标签返工", "版本日志": "V03父V02合格；V04父V03失败：标签修复但杯盖漂移；V05父V03待验收：只重做标签D2", "回退目标": "V03", "禁止沿用": "V04", "标题": "编辑轮次与回退证据"}, "prompt": "依据版本图片与{{版本日志}}制作16:9“{{标题}}”板，任务名只写“{{任务}}”。按时间从左到右排列V03、V04、V05原图缩略图，不重绘、不修图；每张下方逐字写“版本｜父版本｜人工状态｜唯一改动｜失败点｜下一步”。连接线只按父版本关系绘制：V03到V04用灰线，V03到V05用蓝线，不画V04到V05。人工标“合格”的版本加绿色边框，“失败”加红色边框与叉号，“待验收”加橙色边框；状态不由画面推断。中央明确写“回退目标：{{回退目标}}”“禁止沿用：{{禁止沿用}}”。不要自动比较版本、判断哪张更好、合并V04与V05、修复失败图、删除失败记录或把待验收标成合格。只输出一张回退证据板。", "example": "制作16:9“编辑轮次与回退证据”板，任务“保温杯海报标签返工”。从左到右放V03、V04、V05原图缩略图。V03父V02，绿框“合格”；V04父V03，红框叉号“失败：标签修复但杯盖漂移”；V05父V03，橙框“待验收：只重做标签D2”。只画V03→V04灰线和V03→V05蓝线，不画V04→V05。写“回退目标：V03”“禁止沿用：V04”。不比较优劣、不合并或修图。只输出一张图。", "example_inputs": "每轮必须保存独立文件并由人记录父版本与状态；若原图缺失，只保留文字节点并标“文件缺失”，不能补画版本。", "edit": "只修正版本{{版本号}}的{{父版本、状态、失败点或下一步}}为“{{正确内容}}”，并相应调整该节点连线；其他版本图片与日志不变。", "variants": {}, "variants_format": "complete", "usage_note": "回退关系来自人工版本日志；本板不执行文件恢复，也不能证明对应原始文件仍存在或可用。", "adaptation": ["把T27/T43的失败回退规则转成可追踪的版本分支证据，区别于T42素材审批状态；本卡关注编辑父子关系与禁止沿用链。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T45", "source_type": "original", "path": "prompts/templates/T45.md", "task": "Other Use Cases", "product_category": "非商品专项", "reference": "按卡片说明", "has_result": false, "tags": ["版本", "失败", "回退", "证据"]}, {"id": "T46", "title": "发布资产清单拼版", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在发布或交付前，把已批准文件的预览、文件名、渠道、规格和人工状态整理成一张清单，不从图片伪造技术属性。", "size": "2048x1152", "inputs": "图1起：待发布资产预览；提供资产编号、文件名、渠道、像素规格、格式、人工状态、文案版本和用途八列表。", "variables": {"项目": "保温杯秋季上新", "发布清单": "R01 cup-autumn-tb-1x1-v05.png 淘宝 2000×2000 PNG 已批准 Copy-v3 主图；R02 cup-autumn-xhs-3x4-v04.png 小红书 1080×1440 PNG 已批准 Copy-v3 封面；R03 cup-autumn-banner-16x9-v02.png 横版广告 1920×1080 PNG 待批准 Copy-v3 横幅", "标题": "发布资产清单", "阻塞项": "R03待批准，不进入发布包", "说明": "规格与状态来自人工交付清单，未读取文件元数据"}, "prompt": "依据所附预览与{{发布清单}}制作16:9“{{标题}}”拼版，项目名只写“{{项目}}”。每项资产按R01、R02、R03顺序展示原始预览缩略图，不重绘、不裁切、不校色；缩略图下方逐字写“资产编号｜文件名｜渠道｜像素规格｜格式｜人工状态｜文案版本｜用途”。“已批准”用绿色边框，“待批准”用橙色边框，其他状态按清单原文显示，不根据画面判断。右侧单列“阻塞项”，只写“{{阻塞项}}”；底部写“{{说明}}”。不要从缩略图测量像素、读取真实文件格式、猜渠道规则、改文件名、自动批准、生成校验码或声称文件已上传。只输出一张发布清单拼版。", "example": "制作16:9“发布资产清单”，项目“保温杯秋季上新”。R01预览下写“cup-autumn-tb-1x1-v05.png｜淘宝｜2000×2000｜PNG｜已批准｜Copy-v3｜主图”；R02写“cup-autumn-xhs-3x4-v04.png｜小红书｜1080×1440｜PNG｜已批准｜Copy-v3｜封面”；R03写“cup-autumn-banner-16x9-v02.png｜横版广告｜1920×1080｜PNG｜待批准｜Copy-v3｜横幅”。已批准绿框，待批准橙框。右侧只写“R03待批准，不进入发布包”，底部写“规格与状态来自人工交付清单，未读取文件元数据”。不声称已上传。只输出一张图。", "example_inputs": "先用文件工具核对真实文件名、尺寸和格式，再由负责人填写批准状态；此视觉拼版只用于交接，不能替代目录、元数据或发布平台记录。", "edit": "只修正资产{{资产编号}}的{{文件名、渠道、规格、格式、状态、文案版本或用途}}为“{{正确内容}}”；预览、其他资产与阻塞项不变。", "variants": {}, "variants_format": "complete", "usage_note": "清单字段全部来自外部人工记录；生成图不能读取文件元数据、验证像素或证明上传和发布成功。", "adaptation": ["新增生产链发布前交接节点，区别于T42输入素材版本板；T46面向最终输出资产，但只可视化外部清单，不冒充文件检查与发布记录。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T46", "source_type": "original", "path": "prompts/templates/T46.md", "task": "Documents & Publishing", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["发布", "资产", "清单", "交付"]}, {"id": "T47", "title": "透明容器四层参考合成", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把透明容器的外轮廓、真实内容物、印刷标签和环境透视分别绑定权威参考，避免重影、穿透、假液位和标签漂浮。", "size": "1536x1920", "inputs": "图1：空容器正面与轮廓；图2：同容器装入真实内容物后的液位或填充状态；图3：标签正稿或清晰实拍；图4：目标环境与台面。提供容器材质、允许透视区域、必须遮挡区域和准确文字。", "variables": {"商品": "透明玻璃蜂蜜罐", "内容物": "琥珀色蜂蜜，液位到瓶肩下方约一指", "标签文字": "山野蜂蜜｜净含量500克", "允许透视": "瓶口上方空隙与瓶身左右边缘", "必须遮挡": "蜂蜜覆盖区域后的背景细节", "标题": "一罐看得见的自然"}, "prompt": "依据图1至图4制作4:5{{商品}}商品主视觉。以图1锁定瓶身外轮廓、厚底、瓶口和瓶盖；以图2锁定{{内容物}}的真实颜色、液位、黏稠外观与瓶内边界；以图3锁定正面标签形状及准确文字“{{标签文字}}”；图4只提供台面、背景色与光向。透明关系分四层处理：前表面高光、标签印刷层、瓶内内容物、后表面折射。{{允许透视}}可看到经过玻璃折射的环境，{{必须遮挡}}不得让背景清晰穿透；不要把前后高光复制成第二个瓶口、第二张标签或额外液位。商品居中占画面高度约70%，柔和侧后轮廓光勾勒玻璃边缘，正面补光保证标签可读，接触阴影自然。顶部只写“{{标题}}”。不要新增气泡、果肉、配料、容量刻度、功效、产地、认证或包装背面信息。只输出一张完整图片。", "example": "依据四张参考制作4:5透明玻璃蜂蜜罐主视觉。图1锁定瓶身、厚底、瓶口和瓶盖；图2锁定琥珀色蜂蜜，液位到瓶肩下方约一指；图3标签只写“山野蜂蜜｜净含量500克”；图4只提供浅米色石台、暖灰背景和左后侧光。前表面高光、标签、蜂蜜和后表面折射层次清楚；瓶口上方空隙及瓶身左右边缘可透视，蜂蜜覆盖区域后方背景不能清晰穿透。不生成第二标签、假液位、果肉或气泡。顶部只写“一罐看得见的自然”。不写功效、产地或认证。只输出一张图。", "example_inputs": "空瓶与装液图必须是同一容器或有人工确认的同款结构；内容物颜色和液位以真实装填照为准，不能用文字风格词替代产品证据。", "edit": "只修正{{前表面高光、标签、内容物液位或后表面折射}}的{{具体问题}}，按图{{参考图号}}恢复；容器轮廓、其他三层、机位和文字不变。", "variants": {}, "variants_format": "complete", "usage_note": "本卡控制透明物体的可见层级，不证明玻璃成分、容量、密封、食品品质或液体真实性；仍需人工核对重影、边缘和文字。", "adaptation": ["把透明商品从泛化棚拍拆成四层权威参考，区别于普通香水静物；核心是前后表面、印刷层和真实内容物的遮挡顺序。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T47", "source_type": "original", "path": "prompts/templates/T47.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["透明", "玻璃", "内容物", "遮挡"]}, {"id": "T48", "title": "镜面金属允许反射清单布景", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "为镜面金属商品指定允许出现和必须排除的环境反射，用可解释的布光替代不可能的“完全无反射”。", "size": "2048x1152", "inputs": "图1：商品完整外观；图2：关键镜面曲面近照；图3：目标台面与背景；提供允许反射清单、禁止反射清单、保护区域和准确文案。", "variables": {"商品": "抛光不锈钢电热水壶", "允许反射": "左右两条竖向白色柔光箱、下方深灰台面、背后一条浅灰渐变", "禁止反射": "摄影师、相机、人物、窗框、杂乱房间、其他商品和可读文字", "保护区域": "壶嘴、手柄、盖钮、接缝、刻度窗与品牌标识", "标题": "亮面，也可以很干净"}, "prompt": "依据图1至图3制作16:9{{商品}}商业棚拍。严格保留图1的轮廓比例、壶嘴、手柄、盖钮、底座、接缝、刻度窗和品牌位置，镜面曲率与边缘以图2为准。镜面表面必须有真实环境反射，不做哑光或无反射材质；反射内容只允许出现{{允许反射}}，并随曲面产生连续、方向一致的形变。完整排除{{禁止反射}}，不得用涂抹、黑块或模糊污渍遮盖。{{保护区域}}清晰、不断裂、不被高光吞没。商品置于图3深灰微反光台面，背景简洁，左右长条柔光形成受控明暗带，底部接触阴影自然。左上只写“{{标题}}”。不要添加参数、容量、加热速度、安全认证、蒸汽、开机状态或额外配件。只输出一张完整图片。", "example": "制作16:9抛光不锈钢电热水壶棚拍，保持真实壶嘴、手柄、盖钮、底座、接缝、刻度窗和品牌位置。镜面只反射左右两条竖向白色柔光箱、下方深灰台面和背后一条浅灰渐变，反射随壶身曲面连续弯曲；不出现摄影师、相机、人物、窗框、杂乱房间、其他商品或可读文字。不能把金属改成哑光，也不能用黑块盖反射。左上只写“亮面，也可以很干净”。不写容量、速度或认证。只输出一张图。", "example_inputs": "先人工列出允许与禁止反射；镜面曲面近照用于判断边缘和结构，不代表模型能还原拍摄现场或检测金属材质。", "edit": "只修正{{指定镜面区域}}中的{{多余反射、断裂高光或曲率问题}}，使其符合允许反射清单；商品结构、其他反射带、背景和文字不变。", "variants": {}, "variants_format": "complete", "usage_note": "镜面商品不应要求绝对无反射；本卡只约束商业画面的反射内容，不证明金属牌号、表面粗糙度或真实拍摄环境。", "adaptation": ["将高反射材质的负面约束改写为允许反射白名单，区别于普通金属质感词；核心是反射来源、曲面连续性和结构保护。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T48", "source_type": "original", "path": "prompts/templates/T48.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["镜面", "金属", "反射", "布光"]}, {"id": "T49", "title": "宠物用品扣件闭合路径微距", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "用同一扣件从分离、对准、插入到闭合的真实微距序列，说明宠物用品连接路径而不虚构卡合结构和安全性能。", "size": "2048x1152", "inputs": "图1：用品整体与织带路径；图2：扣件公端、母端分离微距；图3：对准状态；图4：部分插入状态；图5：真实完全闭合状态。提供扣件名称、方向标记、四步短句和保护区域。", "variables": {"用品": "Y字形犬用胸背", "扣件": "黑色侧按插扣B1", "方向标记": "公端箭头朝向母端开口，织带均从下方引出", "四步": "1 分离｜2 对准｜3 插入至半程｜4 按图5完全闭合", "保护区域": "两侧按片、中央导向槽、织带回折和缝线", "标题": "扣件B1闭合路径"}, "prompt": "依据图1至图5制作16:9{{用品}}的“{{标题}}”微距步骤图。顶部小窗仅用图1标出{{扣件}}在整件用品上的真实位置，不改变织带路线。下方严格四个等宽步骤，从左到右按{{四步}}：第1格公母端完全分离；第2格按{{方向标记}}同轴对准但不接触；第3格只按图4表现部分插入深度；第4格严格按图5表现真实完全闭合外观。四格保持同一扣件颜色、齿形、开口、按片数量、织带方向、相机侧别和放大倍率，{{保护区域}}连续可辨。箭头只放在第2格到第3格之间，不画内部透视、爆炸结构或不存在的卡齿。每格只写对应编号和短句。不要出现宠物、拉扯测试、防挣脱、安全、承重、寿命、声音或“已锁紧”结论。只输出一张完整步骤图。", "example": "制作16:9 Y字形犬用胸背“扣件B1闭合路径”微距步骤图。顶部只标黑色侧按插扣B1在用品上的位置。下方四格依次写“1 分离”“2 对准”“3 插入至半程”“4 完全闭合”，严格采用图2至图5的真实状态；公端箭头朝母端开口，织带均从下方引出。四格保持同一齿形、开口、两侧按片、中央导向槽、织带回折、缝线、侧别和倍率。箭头只放在第2到第3格之间。不画内部卡齿，不出现宠物或拉扯测试，不写防挣脱、安全、承重或已锁紧。只输出一张图。", "example_inputs": "四个状态必须来自同一款扣件并保持同一观看侧；缺少半程或闭合实拍时就减少步骤，不根据外观补画内部结构。", "edit": "只修正第{{步骤号}}格的{{插入深度、方向、扣件外形或织带路径}}，按图{{参考图号}}恢复；其他三格、顶部位置窗和文字不变。", "variants": {}, "variants_format": "complete", "usage_note": "闭合外观不证明扣件已承力、安全或耐用；实际使用仍以制造商说明、实物检查和适当监督为准。", "adaptation": ["把宠物用品深入到单一扣件的外部闭合拓扑，区别于EC34整件佩戴和T29通用步骤；核心是四个真实微距状态与同一观看侧。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T49", "source_type": "original", "path": "prompts/templates/T49.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["宠物用品", "扣件", "步骤", "微距"]}, {"id": "T50", "title": "车载用品驾驶视野遮挡预演", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在真实样车驾驶眼点照片上叠加人工提供的视野保护区与已装用品轮廓，预演可见遮挡而不宣称道路安全。", "size": "2048x1152", "inputs": "图1：驾驶员座椅固定位置拍摄的前向空景；图2：同机位真实装车照；图3：人工标定的保护区遮罩；图4：用品完整外观。提供样车、机位记录、遮挡结论和免责声明。", "variables": {"用品": "出风口手机支架与竖放手机", "样车": "样车A", "机位": "座椅导轨刻度6、靠背角度按记录、镜头位于人工眼点E1", "保护区": "前风挡主要道路视野、左右后视镜可见区、仪表信息区", "人工结论": "用品轮廓未进入左右后视镜区；进入仪表信息区右下角，标为待调整", "标题": "样车A静态视野遮挡预演", "声明": "仅按固定机位照片展示可见重叠，不代表道路安全评估"}, "prompt": "依据图1至图4制作16:9“{{标题}}”。左右两栏必须使用同一{{样车}}、同一画幅和{{机位}}：左栏为图1空景，右栏为图2安装{{用品}}后的真实照片，不重绘车辆、道路、风挡边界、后视镜、仪表、方向盘或用品。把图3人工遮罩以半透明轮廓叠加到两栏，保护区仅包括{{保护区}}，轮廓位置和大小不得由模型重算。右栏用品只保留图2实际可见轮廓，不根据图4扩大、缩小或移动。下方矩阵逐字写“{{人工结论}}”，进入保护区的项目用橙色标“待调整”，未提供判断的项目写“未核对”，不得看图自动判定通过。顶部另写机位记录，底部完整写“{{声明}}”。不要生成动态道路场景、驾驶员、碰撞线、法规图标、百分比、视角角度，也不要写不挡视线、安全、合规或适合上路。只输出一张静态预演板。", "example": "制作16:9“样车A静态视野遮挡预演”。左右栏分别放同一机位的空景和出风口手机支架加竖放手机的真实装车照，机位写“座椅导轨刻度6、靠背角度按记录、人工眼点E1”。按图3在两栏叠加前风挡主要道路视野、左右后视镜可见区和仪表信息区轮廓，不重算区域。下方逐字写“用品轮廓未进入左右后视镜区；进入仪表信息区右下角，标为待调整”。未给判断就写“未核对”。底部写“仅按固定机位照片展示可见重叠，不代表道路安全评估”。不写安全、合规或适合上路。只输出一张图。", "example_inputs": "空景与装车照必须来自固定座椅和固定相机机位，保护区由人工或适用规范提供；机位不一致时不可做前后重叠判断。", "edit": "只修正{{左栏或右栏}}的{{保护区轮廓、用品轮廓或人工状态文字}}，按图{{参考图号}}和记录恢复；另一栏、车辆、机位与声明不变。", "variants": {}, "variants_format": "complete", "usage_note": "静态照片重叠只用于发现明显遮挡候选，不替代驾驶视野测量、法规判断、道路测试或专业安全评估。", "adaptation": ["把EC35安装说明后的风险沟通拆成固定眼点前后对照，区别于安装步骤；核心是人工保护区、同机位实拍和不自动判定。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T50", "source_type": "original", "path": "prompts/templates/T50.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["汽车用品", "视野", "遮挡", "预演"]}, {"id": "T51", "title": "笔杆与替芯装配链对照", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "用同一笔杆和替芯的分离、方向、插入、闭合实拍说明当前样品装配关系，不从外形推断其他型号兼容。", "size": "2048x1152", "inputs": "图1：笔杆完整外观；图2：拆开后的笔杆组件与替芯同框；图3：替芯尾端、笔尖与笔杆接口微距；图4：插入状态；图5：真实闭合成品。提供样品编号、组件清单、方向规则和准确标题。", "variables": {"文具": "按动中性笔P07与替芯R07", "组件清单": "笔杆1、笔握1、弹簧1、替芯R07一支、按动尾件1", "方向规则": "替芯笔尖朝向笔握开口，弹簧套在笔尖后方台阶处", "标题": "P07替芯装配关系", "声明": "只记录P07与R07实物组合"}, "prompt": "依据图1至图5制作16:9“{{标题}}”装配链。第一栏“组件”严格按图2展示{{组件清单}}，各一件、沿同一水平轴排列；第二栏“方向”放大图3接口，按{{方向规则}}用一支短箭头标方向；第三栏“插入”严格按图4显示真实插入深度，替芯不得穿透笔杆或悬空；第四栏“闭合”严格按图5展示同一支完整笔。四栏保持同一笔杆颜色、夹子、螺纹、接缝、笔尖和替芯长度观感，组件数量守恒。不要画看不见的内部剖面、弹簧压缩原理或墨水流动，不增加垫圈、笔帽、第二支替芯和工具。底部只写“{{声明}}”，不写通用、适配其他型号、书写长度、顺滑、防漏或耐用结论。只输出一张完整图片。", "example": "制作16:9“P07替芯装配关系”。第一栏按实拍各一次展示笔杆1、笔握1、弹簧1、替芯R07一支、按动尾件1；第二栏按接口微距标“替芯笔尖朝向笔握开口，弹簧套在笔尖后方台阶处”；第三栏按真实照片显示插入深度；第四栏显示同一支闭合成品。组件数量守恒，不画内部剖面、墨水流动或额外垫圈。底部只写“只记录P07与R07实物组合”。不写通用、顺滑、防漏或耐用。只输出一张图。", "example_inputs": "所有组件和步骤必须来自同一笔杆—替芯组合；只有外包装型号表、没有拆装实拍时，不生成内部连接关系。", "edit": "只修正第{{栏位}}栏的{{组件数量、方向、插入深度或闭合外观}}，按图{{参考图号}}恢复；其他栏和声明不变。", "variants": {}, "variants_format": "complete", "usage_note": "当前实物可装配不代表所有批次或相近型号兼容，也不证明书写性能与耐用性。", "adaptation": ["把文具兼容问题改为单一样品组合的外部装配链，区别于T29泛步骤图和EC43线材两端；核心是组件守恒、方向与插入深度。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T51", "source_type": "original", "path": "prompts/templates/T51.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["文具", "替芯", "装配", "兼容"]}, {"id": "T52", "title": "拼装玩具分袋与检查点追踪", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把真实零件分袋、步骤检查点和阶段性半成品一一对应，避免跨袋取件、漏件和提前出现后续结构。", "size": "1536x1920", "inputs": "图1：全部密封分袋及编号；图2：袋A零件平铺；图3：完成检查点C1；图4：袋B零件平铺；图5：完成检查点C2；图6：说明书对应页。提供各袋清单、检查点新增件和禁止提前出现件。", "variables": {"玩具": "木质小火车拼装套件", "袋A": "车底板1、轮轴2、车轮4", "检查点一": "C1：底板、2根轮轴和4个车轮完成连接", "袋B": "车厢侧板2、端板2、顶板1", "检查点二": "C2：在C1基础上增加完整车厢", "禁止提前": "烟囱、挂钩、贴纸和展示底座", "标题": "按分袋完成两个检查点"}, "prompt": "依据图1至图6制作4:5{{玩具}}分袋检查图。画面自上而下两段：A段左侧按图2逐件展示“袋A：{{袋A}}”，右侧严格按图3展示“{{检查点一}}”；B段左侧按图4逐件展示“袋B：{{袋B}}”，右侧严格按图5展示“{{检查点二}}”。C2必须保留C1已完成结构，只新增袋B零件；每个零件在清点区各出现一次，半成品中数量与说明书图6一致，不复制轮子、侧板或连接点。{{禁止提前}}在两段都不得出现。用蓝色细线从每袋零件指向本段新增位置，不能跨段连线。顶部只写“{{标题}}”。不补隐藏榫卯、胶水、工具、年龄建议、完成时长、承重、安全认证或玩法功能。只输出一张完整图片。", "example": "制作4:5木质小火车分袋检查图。A段左侧各一次展示车底板1、轮轴2、车轮4，右侧按真实C1照显示底板、2根轮轴和4个车轮完成连接；B段左侧展示车厢侧板2、端板2、顶板1，右侧C2保留C1并只增加完整车厢。蓝线只连接本袋零件到本段新增位置，不跨段。烟囱、挂钩、贴纸和展示底座不能提前出现。不补榫卯、胶水、工具、年龄、安全或时长。顶部只写“按分袋完成两个检查点”。只输出一张图。", "example_inputs": "每个检查点需有真实阶段照或说明书明确插图；如果只有最终成品，不能反推中间结构与分袋归属。", "edit": "只修正{{袋A、C1、袋B或C2}}中的{{零件数量、归属、连接位置或提前出现问题}}，按图{{参考图号}}恢复；其他段与连线不变。", "variants": {}, "variants_format": "complete", "usage_note": "本卡用于视觉清点与检查点沟通，不替代正式说明书、年龄分级、缺件判定或玩具安全检查。", "adaptation": ["把收藏玩具发布板的静态配件陈列推进到分袋—阶段新增件追踪，区别于T29通用步骤；核心是跨检查点组件守恒与禁止提前出现。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T52", "source_type": "original", "path": "prompts/templates/T52.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["玩具", "分袋", "组件", "检查点"]}, {"id": "T53", "title": "五金孔位模板重合预演", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把厂家孔位模板、五金背板和现场已确认基准线叠加预演，只检查可见孔心重合，不生成钻孔或安装结论。", "size": "2048x1152", "inputs": "图1：五金背板正对照片；图2：厂家孔位模板正稿；图3：现场安装面正对照片及人工基准线；图4：人工填写的孔号—坐标表。提供缩放基准、孔号、不可覆盖区域和状态。", "variables": {"五金": "双孔壁挂挂钩背板", "缩放基准": "模板100毫米标尺与现场100毫米实测标记等长", "孔位": "H1、H2，坐标只取图4", "基准": "水平线L0与中心线C0", "不可覆盖": "瓷砖接缝、既有电线标记区和墙角收边", "人工状态": "H1已核对；H2待现场复尺", "标题": "孔位模板重合预演"}, "prompt": "依据图1至图4制作16:9“{{标题}}”。左栏等比例展示图1{{五金}}背板正面，在可见孔中心标{{孔位}}；中栏原样展示图2厂家模板，以{{缩放基准}}校准显示比例，不改孔距；右栏使用图3现场正对照，把模板以50%透明度叠加，使{{基准}}与现场人工线重合，孔心坐标只按图4放置。{{不可覆盖}}用红色斜线区原样保留，模板不得自动避让、旋转或改孔距。下方状态只逐字写“{{人工状态}}”，未核对孔位用橙色，不由画面判断可钻。不要生成钻孔、螺丝、膨胀件、墙内结构、尺寸换算、承重、适用墙体或施工批准。只输出一张预演板。", "example": "制作16:9“双孔壁挂挂钩背板孔位模板重合预演”。左栏在真实背板孔心标H1、H2；中栏原样放厂家模板，以模板100毫米标尺与现场100毫米实测标记等长校准；右栏在现场正对照上半透明叠加模板，让水平线L0和中心线C0重合，孔坐标只取人工表。瓷砖接缝、既有电线标记区和墙角收边保持红色禁区，模板不自动避让。状态只写“H1已核对；H2待现场复尺”。不画钻孔、墙内结构、承重或施工批准。只输出一张图。", "example_inputs": "照片需尽量正对并带同平面的实测标记；透视明显、基准长度不在同一平面或现场风险未知时，只展示资料，不做重合预演。", "edit": "只修正{{H1、H2、L0或C0}}的{{位置、编号、透明叠加或人工状态}}，按图{{参考图号}}恢复；禁区、其他孔位与模板比例不变。", "variants": {}, "variants_format": "complete", "usage_note": "视觉重合不等于现场放样或可施工；钻孔前必须复尺并确认墙体、管线、固定件和安全要求。", "adaptation": ["把EC40安装说明前移为孔位模板与现场基准的叠加检查，区别于成品步骤图；核心是同平面缩放基准、人工坐标和禁区不自动规避。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T53", "source_type": "original", "path": "prompts/templates/T53.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["五金", "孔位", "模板", "预演"]}, {"id": "T54", "title": "帐篷风绳与地钉拓扑图", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在同一顶真实搭建帐篷的俯视图上逐点绑定风绳、调节片和地钉，避免错接、交叉、漏点及凭空增加固定件。", "size": "2048x1152", "inputs": "图1：完整搭建状态四分之三视角；图2：正上方或高位俯视；图3：全部风绳、调节片、地钉同框清点；图4：帐篷连接点微距；图5：真实完成固定照。提供连接点编号、逐条路径表和组件数量。", "variables": {"装备": "双人穹顶帐篷", "组件": "风绳4根、调节片4个、地钉4枚", "路径": "A1→绳1→调节片1→P1；A2→绳2→调节片2→P2；A3→绳3→调节片3→P3；A4→绳4→调节片4→P4", "标题": "四点风绳连接关系", "声明": "连接位置以当前样品说明书与实搭照片为准"}, "prompt": "依据图1至图5制作16:9{{装备}}“{{标题}}”。中央使用图2俯视帐篷，保持门厅方向、布片、杆件交叉点和四个真实连接点；连接点按图4编号A1至A4，外围地钉按图5编号P1至P4。严格按{{路径}}绘制四条独立风绳，每条只有一根连续线、一个调节片和一枚地钉，不交叉、不合并、不穿过帐篷布面。左侧清点区按图3各一次展示{{组件}}，颜色与形状一致。右侧用四行短表逐字列出路径，不增加角度、距离或拉力数字。底部只写“{{声明}}”。不要新增第5根风绳、营绳灯、锤子、人物、岩石压绳或地下剖面，也不写抗风等级、牢固、安全、适用地面和恶劣天气结论。只输出一张拓扑图。", "example": "制作16:9双人穹顶帐篷“四点风绳连接关系”。中央保持真实门厅方向和杆件，在四个连接点标A1–A4，外围地钉标P1–P4。四条路径严格为A1→绳1→调节片1→P1，依次到A4→绳4→调节片4→P4；每条独立连续，不交叉、不穿过帐篷。左侧各一次展示风绳4根、调节片4个、地钉4枚。底部写“连接位置以当前样品说明书与实搭照片为准”。不加第五根绳、锤子、人物、角度、拉力或抗风结论。只输出一张图。", "example_inputs": "需提供同一帐篷的俯视、连接点微距、组件清点和真实固定完成照；缺少俯视证据时不推断背面连接关系。", "edit": "只修正路径{{A编号到P编号}}的{{连接点、风绳走向、调节片或地钉归属}}，按图{{参考图号}}恢复；其他三条路径、帐篷和清点区不变。", "variants": {}, "variants_format": "complete", "usage_note": "拓扑图只说明当前样品的可见连接关系，不替代说明书、现场地面判断、风况评估和安全搭建。", "adaptation": ["把EC42展开收纳推进到帐篷外围固定件的逐点拓扑，区别于普通组件清点；核心是A—绳—调节片—P的一一对应。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T54", "source_type": "original", "path": "prompts/templates/T54.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["户外", "帐篷", "风绳", "拓扑"]}, {"id": "T55", "title": "珠宝镶口四方位旋转对照", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "用同一件珠宝镶口的四个真实方位微距建立旋转连续性，核对镶爪编号和遮挡关系，不补造切面或鉴定结论。", "size": "2048x1152", "inputs": "图1：整件珠宝与观察方向；图2至图5：同一镶口0°、90°、180°、270°真实微距；图6：人工镶爪编号图。提供中心件身份、方位定义、可见镶爪表和准确标题。", "variables": {"珠宝": "椭圆形蓝色中心石戒指", "方位": "0°正面、90°右侧、180°背向、270°左侧", "镶爪": "C1至C4，编号与图6一致", "锁定项": "中心件椭圆轮廓、四个镶爪、戒臂连接点和金属颜色", "标题": "同一镶口四方位", "声明": "仅展示所附样品的可见外观，不作材质或宝石鉴定"}, "prompt": "依据图1至图6制作16:9{{珠宝}}“{{标题}}”微距对照。四格从左到右严格为{{方位}}，每格只使用对应实拍方位，不把一张图镜像成另一侧。保持{{锁定项}}，镶爪按{{镶爪}}标号并随物体旋转到正确画面位置；靠近镜头的镶爪可遮挡中心件边缘，背向镶爪不得穿透或浮在前方。四格相机距离、放大倍率、背景和柔光一致，金属高光连续但不过曝，不新增星芒。图1只在左上小窗标观察箭头，不生成背面未知结构。每格下方只写角度。底部写“{{声明}}”。不要增加切面、镶爪、刻印、证书编号、纯度、克拉、净度、产地、价值或真伪结论。只输出一张四方位对照图。", "example": "制作16:9椭圆形蓝色中心石戒指“同一镶口四方位”对照。四格依次使用真实0°正面、90°右侧、180°背向、270°左侧微距，不能用镜像代替。中心件椭圆轮廓、C1至C4四个镶爪、戒臂连接点和金属颜色一致；镶爪编号随旋转移动，前后遮挡正确，不穿透。四格同倍率、浅灰背景和柔光，不加星芒。底部写“仅展示所附样品的可见外观，不作材质或宝石鉴定”。不写克拉、净度、纯度、价值或真伪。只输出一张图。", "example_inputs": "四个方位必须来自同一件样品并按人工记录排序；缺少某一方位时保留空格标“未提供”，不能镜像或推断补齐。", "edit": "只修正{{角度}}格的{{镶爪编号、遮挡、轮廓或方向问题}}，按图{{参考图号}}恢复；其他三格、倍率和声明不变。", "variants": {}, "variants_format": "complete", "usage_note": "多方位视觉只记录可见结构，不等于珠宝检测、工艺验收、材质鉴定或估值。", "adaptation": ["把EC28单张珠宝微距扩展为同一镶口四方位拓扑，区别在于编号随旋转的位置与遮挡连续性；不补未知切面。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T55", "source_type": "original", "path": "prompts/templates/T55.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["珠宝", "镶爪", "方位", "微距"]}, {"id": "T56", "title": "食品整品与真实切面身份对应", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把同一批食品的整品、切开过程和真实切面逐图绑定，展示内部层次而不从外观补造馅料、成熟度和品质结论。", "size": "1536x1920", "inputs": "图1：未切整品与批次标识；图2：同一件食品切开前定位照；图3：切开后的两半同框照；图4：真实切面正对微距；图5：人工层次名称表。提供数量、切割方向、层次顺序和准确标题。", "variables": {"食品": "单枚三层夹心酥点S12", "切割方向": "沿中心纵向切开", "层次": "外层浅金色酥皮｜中层深褐色可可馅｜中心浅色坚果酱", "数量": "整品1枚，切开后左右两半，来自同一枚", "标题": "一枚酥点，真实三层切面", "声明": "切面与层次仅对应批次S12实拍"}, "prompt": "依据图1至图5制作4:5{{食品}}整品—切面说明图。上半部左侧展示图1{{数量}}中的未切整品状态，右侧展示图3同一枚切开后的左右两半，两半拼合轮廓应能对应整品，不复制成两枚新品；中部用一条短箭头标图2的{{切割方向}}，不展示刀具动作；下半部只使用图4真实切面微距，按图5从外到内逐字标“{{层次}}”，引线终点落在真实可见区域。保持外皮裂纹、馅料边界、厚度观感、碎屑和颜色，不让馅料溢出到照片中没有的位置，不补空腔、果粒、拉丝、蒸汽或流心。顶部只写“{{标题}}”，底部写“{{声明}}”。不要写新鲜、酥脆、低糖、配料、营养、温度、成熟度、等级或检测结论。只输出一张完整图片。", "example": "制作4:5单枚三层夹心酥点S12整品—切面说明。上方左侧放未切整品1枚，右侧放同一枚沿中心纵向切开后的左右两半，两半拼合轮廓对应原整品，不变成两枚新品。下方只用真实切面微距，从外到内标“外层浅金色酥皮｜中层深褐色可可馅｜中心浅色坚果酱”。保持实拍裂纹、边界、厚度、碎屑和颜色，不补果粒、拉丝、蒸汽或流心。顶部写“一枚酥点，真实三层切面”，底部写“切面与层次仅对应批次S12实拍”。不写新鲜、低糖、营养或成熟度。只输出一张图。", "example_inputs": "整品、定位照、两半和切面需来自同一件或有明确批次对应；只有其他样品切面时必须标为另一实例，不能拼成同一件证据链。", "edit": "只修正{{整品、两半或切面层次}}的{{数量、对应关系、边界或引线问题}}，按图{{参考图号}}恢复；其他区域和声明不变。", "variants": {}, "variants_format": "complete", "usage_note": "切面图只能说明所附样品或批次的可见状态，不证明配料、营养、口感、新鲜度和批次一致性。", "adaptation": ["把G34食品英雄图明确禁止补切面的边界转为有实拍证据时的整品—切面身份链；核心是同一件数量守恒与层次引线。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T56", "source_type": "original", "path": "prompts/templates/T56.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["食品", "切面", "层次", "身份"]}, {"id": "T57", "title": "纺织跨裁片纹样对花核对", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在真实服装接缝两侧按纹样单元编号核对对花连续性，避免跨裁片错位、镜像、缩放和补造不存在的图案。", "size": "2048x1152", "inputs": "图1：服装完整正面；图2：未缝合左右裁片平铺；图3：目标接缝正对微距；图4：纹样单元编号图；图5：人工允许偏差记录。提供接缝名称、左右单元配对、基准线和标题。", "variables": {"商品": "格纹衬衫", "接缝": "前胸口袋上边与左前片", "单元配对": "左前片格点A1对应口袋格点B1，A2对应B2，A3对应B3", "基准": "口袋上边缘水平线L1", "人工记录": "A1/B1已核对；A2/B2已核对；A3/B3待返工D7", "标题": "口袋与前片对花核对", "声明": "状态仅来自当前样衣人工记录"}, "prompt": "依据图1至图5制作16:9{{商品}}“{{标题}}”。左栏展示图1完整正面，只框出{{接缝}}，不修改服装；中栏按图2并排展示相关左右裁片，保持纹样比例、经纬方向和正反面，不旋转或镜像；右栏放大图3接缝微距，以{{基准}}为水平参考，在接缝两侧按图4标{{单元配对}}。用细虚线连接每对纹样单元，线段在接缝处停止，不覆盖针脚。下方状态逐字采用“{{人工记录}}”：已核对用绿色，待返工用红色并保留问题编号，未提供的写“未核对”；不根据视觉自动计算偏移量或判断通过。不得移动口袋、拉伸格纹、改变格距、复制线条、抹掉针脚或生成背面。底部写“{{声明}}”。不写工艺等级、零误差、面料成分、缩水率、耐洗或批量一致性。只输出一张核对板。", "example": "制作16:9格纹衬衫“口袋与前片对花核对”。左栏完整正面只框前胸口袋上边与左前片；中栏按实拍展示相关裁片，不旋转或镜像；右栏放大真实接缝，以口袋上边缘水平线L1为基准，标A1/B1、A2/B2、A3/B3并用虚线逐对连接，虚线不盖针脚。状态只写“A1/B1已核对；A2/B2已核对；A3/B3待返工D7”。不自动测偏差，不移动口袋、拉伸格纹或抹针脚。底部写“状态仅来自当前样衣人工记录”。不写工艺等级、零误差或批量一致。只输出一张图。", "example_inputs": "完整服装、裁片和接缝微距必须来自同一样衣或有明确样品编号；不同批次纹样比例可能变化，不能混作一套对花证据。", "edit": "只修正配对{{单元编号}}的{{编号、虚线、人工状态或问题号}}，按图{{参考图号}}和记录恢复；服装、裁片、其他配对与基准不变。", "variants": {}, "variants_format": "complete", "usage_note": "生成核对板不执行测量或质量判定；实际对花偏差与批量标准应由人工量检和生产规范确认。", "adaptation": ["把EC44纺织颜色与纹理对照推进到跨裁片接缝拓扑，区别于一般材质微距；核心是纹样单元配对、基准线与人工状态。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T57", "source_type": "original", "path": "prompts/templates/T57.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["纺织", "对花", "接缝", "核对"]}, {"id": "T58", "title": "多轮成品属性证据继承矩阵", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在新一轮生成前逐属性登记应回看原始素材、已验收父图还是本轮新增资料，避免把上一轮视觉误当全部商品事实。", "size": "2048x1152", "inputs": "图1起：原始商品素材、已验收父图与本轮新增资料；提供属性、唯一权威来源、允许继承、禁止继承、当前状态和目标版本六列表。", "variables": {"任务": "保温杯详情页P4材质模块", "继承表": "杯体轮廓→原始图O1；杯身墨绿色→原始图O2；品牌版式→已验收P3；内胆纹理→本轮新增M1；容量文字→禁止继承，未提供", "父版本": "P3", "目标版本": "P4", "标题": "P4属性证据继承矩阵"}, "prompt": "依据全部素材与{{继承表}}制作16:9“{{标题}}”。左上只写任务“{{任务}}”、父版本“{{父版本}}”和目标版本“{{目标版本}}”。主体表格每行一个属性，列严格为“属性｜唯一权威来源｜允许继承｜禁止继承｜当前状态”；来源只允许原始素材、已验收父图、本轮新增资料或未提供。用蓝线连接属性到对应原图缩略图，绿线连接到父图，橙线连接到新增资料；同一属性只能有一个权威来源。标为未提供的内容写“停止补造”，不从其他缩略图猜测。不要重绘素材、比较画质、自动选择来源、把父图中的商品细节全部视为真实，也不生成新成品。只输出一张继承矩阵。", "example": "制作16:9“P4属性证据继承矩阵”，任务“保温杯详情页P4材质模块”，父版本P3，目标版本P4。逐行写：杯体轮廓→原始图O1；杯身墨绿色→原始图O2；品牌版式→已验收P3；内胆纹理→本轮新增M1；容量文字→未提供、停止补造。每个属性只连一个权威来源，原图蓝线、父图绿线、新资料橙线。不自动选源、不把P3全部细节当事实、不生成成品。只输出一张图。", "example_inputs": "先由人逐属性指定唯一权威来源；父图只可继承明确已验收的版式或视觉状态，不能替代原始商品证据。", "edit": "只修正属性“{{属性}}”的{{权威来源、允许继承、禁止继承或状态}}为“{{准确内容}}”；其他行、缩略图和版本关系不变。", "variants": {}, "variants_format": "complete", "usage_note": "矩阵只可视化人工指定的证据继承关系，不自动证明素材真实性、版本合格或属性一致。", "adaptation": ["把EC31的上一页视觉继承与T45版本关系细化到逐属性来源，区别在于同一新版本可同时引用原图、父图和新增资料，但每个属性仅一个权威源。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T58", "source_type": "original", "path": "prompts/templates/T58.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "按卡片说明", "has_result": false, "tags": ["证据", "继承", "版本", "属性"]}, {"id": "T59", "title": "软包装真实充填形变对照", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "用同一软袋的空袋、真实充填和站立状态约束褶皱、封边与印刷变形，不把软包装生成成刚性盒体。", "size": "2048x1152", "inputs": "图1：空袋正反面；图2：真实充填后平放；图3：真实站立状态；图4：封边、拉链或底褶微距；图5：准确印刷正稿。提供填充状态、结构锁定项和准确文字。", "variables": {"包装": "哑光自立咖啡豆袋", "填充状态": "真实装入同批咖啡豆后的七成充填", "结构": "顶部热封、可见拉链、左右封边、展开底褶", "文字": "山谷咖啡｜中度烘焙｜净含量250克", "标题": "装入之后，仍是同一只袋"}, "prompt": "依据图1至图5制作16:9{{包装}}三状态对照：左栏空袋平放，中栏{{填充状态}}平放，右栏同一充填袋按图3站立。三栏保持袋型、{{结构}}、印刷区域和颜色一致；空袋褶皱可扁平，充填后只按图2、图3产生真实鼓起、底褶展开和受力折线，不把封边拉伸、拉链移位或袋体变成硬盒。正面文字只按图5写“{{文字}}”，随袋面已有曲率轻微变形但字序不变。柔和大面积侧光，哑光表面保留克制高光和接触阴影。顶部只写“{{标题}}”。不要生成透明窗口、排气阀、把手、内容物透视、容量变化、保鲜、阻氧、防潮或烘焙品质结论。只输出一张完整对照图。", "example": "制作16:9哑光自立咖啡豆袋三状态对照：空袋平放、真实七成充填平放、同一充填袋站立。保持顶部热封、可见拉链、左右封边、展开底褶、印刷和颜色；充填形变只按实拍，不拉伸封边或变成硬盒。正面只写“山谷咖啡｜中度烘焙｜净含量250克”，字序不变。顶部写“装入之后，仍是同一只袋”。不加透明窗、排气阀、内容物透视、保鲜或防潮结论。只输出一张图。", "example_inputs": "三个状态需来自同一袋型且充填内容与比例有实拍；只有空袋时不能凭想象生成鼓包、底褶展开和站立稳定性。", "edit": "只修正{{空袋、充填平放或站立}}栏的{{褶皱、封边、底褶、印刷或形变问题}}，按图{{参考图号}}恢复；其他两栏不变。", "variants": {}, "variants_format": "complete", "usage_note": "外观形变不证明包装容量、阻隔性能、密封质量、货架稳定或内容物品质。", "adaptation": ["新增柔性包装状态约束，区别于EC36刚性透明容器和普通包装棚拍；核心是空袋到真实充填后的褶皱、封边与印刷共同变形。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T59", "source_type": "original", "path": "prompts/templates/T59.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["软包装", "充填", "褶皱", "形变"]}, {"id": "T60", "title": "纸盒刀模与成盒面位映射", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "把已批准刀模上的面位编号映射到真实成盒六面，检查图文归属与朝向，不让生成图冒充生产刀模。", "size": "2048x1152", "inputs": "图1：已批准刀模预览；图2至图7：真实成盒前后左右顶底六面正对照；图8：面位编号和折叠关系表。提供面位、文字、折线/裁切线样式和声明。", "variables": {"包装": "长方体茶叶纸盒", "面位": "F正面、B背面、L左侧、R右侧、T顶部、D底部", "映射": "F→图2，B→图3，L→图4，R→图5，T→图6，D→图7", "标题": "刀模面位与真实成盒对应", "声明": "本图仅供视觉核对，生产以已批准刀模源文件为准"}, "prompt": "依据图1至图8制作16:9“{{标题}}”。左栏原样放图1{{包装}}刀模预览，在各面中央标{{面位}}，裁切线用实线、折线用虚线，不能移动线、改尺寸或补出血；右栏以2×3网格放图2至图7真实六面正对照，严格按{{映射}}标号。用六条独立细线把刀模面位连接到对应成盒照片，保持文字朝向、标志位置和图案跨折边终止关系，不把相邻面内容交换、镜像或旋转180°。若刀模与实盒不一致，只按人工记录标红问题编号，不自动修刀模或重绘实盒。底部写“{{声明}}”。不要输出可印刷文件、尺寸、色值、条码校验、出血合规或已量产结论。只输出一张映射核对板。", "example": "制作16:9“刀模面位与真实成盒对应”。左栏原样放长方体茶叶纸盒已批准刀模，标F正面、B背面、L左侧、R右侧、T顶部、D底部；右栏2×3放真实六面照片，并按F→图2、B→图3、L→图4、R→图5、T→图6、D→图7逐一连线。文字朝向和跨折边终止关系按实物，不交换、镜像或倒转面位。发现不一致只标人工问题号，不修刀模。底部写“本图仅供视觉核对，生产以已批准刀模源文件为准”。只输出一张图。", "example_inputs": "刀模必须是当前批准版本，六面照片需来自同一实盒；缺少某一面时标“未提供”，不能用相邻面推断补齐。", "edit": "只修正面位{{面位编号}}的{{照片归属、朝向、连线或问题编号}}，按图{{参考图号}}恢复；刀模线、其他五面和声明不变。", "variants": {}, "variants_format": "complete", "usage_note": "生成板不是矢量刀模、印前文件或尺寸依据，不能用于生产下单与合规验收。", "adaptation": ["把G31线下展架的刀模边界发展为已批准刀模与真实成盒六面的映射核对，核心是面位编号、朝向和跨折边归属。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T60", "source_type": "original", "path": "prompts/templates/T60.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["包装", "刀模", "面位", "映射"]}, {"id": "T61", "title": "货架价签与商品遮挡预演", "category": "模板", "group": "templates", "kind": "本库原创设计", "use": "在真实货架照片上按人工坐标叠加价签和商品轮廓，预演标签、包装与相邻SKU的可见遮挡，不改现场陈列。", "size": "2048x1152", "inputs": "图1：空价签轨道与货架正对照；图2：当前商品陈列正对照；图3：已批准价签正稿；图4：人工坐标与保护区表。提供目标槽位、价签尺寸、保护项和人工状态。", "variables": {"货架": "咖啡豆货架第二层", "槽位": "S2-04", "价签": "90×40毫米价签V3", "保护项": "商品品牌名、净含量、相邻S2-03与S2-05边界、层板编号", "人工状态": "价签不遮品牌名；商品袋底进入价签上边缘5毫米，待调整D9", "标题": "S2-04价签遮挡预演"}, "prompt": "依据图1至图4制作16:9“{{标题}}”。左栏原样展示图1{{货架}}空轨道并框出{{槽位}}；中栏原样展示图2当前陈列；右栏复制中栏画面，只按图4人工坐标叠加图3{{价签}}与半透明边界，不移动商品、价签轨道、层板或相邻SKU。{{保护项}}用细蓝框标出，状态只逐字写“{{人工状态}}”；问题D9用红色短线标重叠边界，未提供状态写“未核对”，不从图片自动测量毫米、识别售价或判断可发布。三栏机位、裁切和比例一致。不要改价签文字、重排陈列、补商品、生成价格、促销、库存、销量或货架合规结论。只输出一张静态遮挡预演板。", "example": "制作16:9“S2-04价签遮挡预演”。左栏展示咖啡豆货架第二层空轨道并框S2-04，中栏放当前陈列原照，右栏只按人工坐标叠加90×40毫米价签V3，不移动商品和相邻SKU。蓝框保护商品品牌名、净含量、S2-03与S2-05边界、层板编号；状态只写“价签不遮品牌名；商品袋底进入价签上边缘5毫米，待调整D9”，D9处红线标示。毫米值不从图像计算。不改价签文字，不生成价格、库存或销量。只输出一张图。", "example_inputs": "货架照片应正对且坐标、价签尺寸和重叠结论由现场测量提供；没有统一尺度时只能做视觉位置草案，不能写毫米结果。", "edit": "只修正{{槽位、价签边界、保护框或人工状态}}的{{具体问题}}，按图{{参考图号}}和坐标表恢复；商品、相邻SKU和其他栏不变。", "variants": {}, "variants_format": "complete", "usage_note": "静态预演不替代现场安装、尺寸复核、价格系统、库存系统或门店陈列验收。", "adaptation": ["把G41货架规划与现场对照细化到单槽位价签遮挡，区别于经营陈列分析；核心是人工坐标、保护区和不移动现场。未生图实测。"], "sources": [{"label": "官方 GPT Image 2.5 提示词指南", "url": "https://developers.openai.com/api/docs/guides/image-prompting"}], "source_key": "original:T61", "source_type": "original", "path": "prompts/templates/T61.md", "task": "Products & E-commerce", "product_category": "非商品专项", "reference": "需要", "has_result": false, "tags": ["货架", "价签", "遮挡", "预演"]}, {"id": "C001", "title": "参考衣物换装", "path": "cases/C001-reference-clothing.md", "prompt": "为图1人物换装：外套用图2、内搭用图3、鞋子用图4。款式、图案和颜色各依对应参考，自然贴合身体。人物脸、发型、体型、姿态、未指定衣物和背景保持；不加配饰或文字。输出一张完整换装照片。", "inputs": "图1：人物全身照；图2：外套；图3：内搭；图4：鞋子。服装与鞋子的款式需清楚可见。\n\n本卡首轮正文无需填写变量；按上述要求上传图片即可直接复制。后续修改时再填写具体问题。", "task": "人物与角色", "product_category": "服装", "reference": "需要", "has_result": false, "kind": "明确2.5来源", "variants": {}}, {"id": "C002", "title": "透明背景商品素材", "path": "cases/C002-transparent-product.md", "prompt": "将照片中的商品单独提取到透明背景，居中完整展示。商品轮廓、颜色、材质和标签保持，不添加投影、底板或棋盘格，输出PNG图片。", "inputs": "上传一张轮廓完整的商品照片。\n\n本卡首轮正文无需填写变量；按上述要求上传图片即可直接复制。后续修改时再填写具体问题。", "task": "局部编辑", "product_category": "通用品类", "reference": "需要", "has_result": false, "kind": "明确2.5来源", "variants": {}}, {"id": "C003", "title": "信息图翻译并保留版式", "path": "cases/C003-layout-translation.md", "prompt": "把这张信息图中的文字全部翻译成{{目标语言}}。保持原图的图形、数字、颜色、版式和文字层级；译文在原区域内排版，不增删信息，不改变图示关系。只输出翻译后的信息图。", "inputs": "上传一张文字清楚的信息图，填写目标语言。已有专有名词译法时可在发送提示词后附术语表。\n\n将双花括号内容换成自己的信息，然后整段复制。", "task": "局部编辑", "product_category": "通用品类", "reference": "需要", "has_result": false, "kind": "明确2.5来源", "variants": {}, "example": "把这张英文信息图中的文字全部翻译成简体中文。保持原图的图形、数字、颜色、版式和文字层级；译文在原区域内排版，不增删信息，不改变图示关系。只输出翻译后的信息图。", "example_inputs": "上传一张英文信息图，文字清楚且完整；此示例将整张图译成简体中文。"}, {"id": "C004", "title": "草图转写实场景", "path": "cases/C004-sketch-render.md", "prompt": "把这张草图转成写实场景图。保留物体数量、位置、比例和透视，材质使用{{材质}}，光线为{{光线}}。草图的注释不作为成品文字，不添加新的物体。", "inputs": "上传一张空间或景观线稿，明确已有物体和透视；填写材料与光线。\n\n将双花括号内容换成自己的信息，然后整段复制。", "task": "摄影与插画", "product_category": "通用品类", "reference": "需要", "has_result": false, "kind": "明确2.5来源", "variants": {}, "example": "把这张河谷景观线稿转成写实场景图。保留河道、山体和植被的位置、比例与透视；河流呈自然水面，山体呈岩石与土壤质感，植物保留线稿中已有分布。使用阴天柔和自然光。草图的注释不作为成品文字，不新增建筑、人物或其他物体。", "example_inputs": "上传一张包含河流、山体和植被的景观线稿。其他空间或材质使用下面的模板。"}, {"id": "C005", "title": "在图表留白处添加角色", "path": "cases/C005-chart-character.md", "prompt": "在这张图表的{{留白位置}}加入一只戴眼镜、穿白大褂的卡通浣熊，它正在认真观察图表。角色不得覆盖坐标轴、折线、图例、数字和标题。保留所有原始图表内容，不添加新的数据或品牌标志。", "inputs": "上传一张已有图表，确保留白足够；填写角色位置。\n\n将双花括号内容换成自己的信息，然后整段复制。", "task": "局部编辑", "product_category": "通用品类", "reference": "需要", "has_result": false, "kind": "明确2.5来源", "variants": {}, "example": "在这张图表右下角的空白区域加入一只戴眼镜、穿白大褂的卡通浣熊，它正在认真观察图表。角色完整落在空白区内，不得覆盖坐标轴、折线、图例、数字和标题。保留原始图表内容，不添加新数据或品牌标志。", "example_inputs": "上传右下角有足够空白的图表；该区域不能包含坐标轴、图例、数字或曲线。"}, {"id": "C006", "title": "移除手中物品", "path": "cases/C006-remove-object.md", "prompt": "从上传照片中移除{{待移除物品}}。只修补该物品占据的区域，使其与周围背景和可见手部自然衔接。保留人物身份、面部表情、衣服、姿势、构图和光线，不新增替代物品。输出一张编辑后的照片。", "inputs": "上传一张人物手持物品的照片。物品和手部边缘要清楚；准备局部保留要求。", "task": "局部编辑", "product_category": "通用品类", "reference": "需要", "has_result": true, "kind": "明确2.5来源", "variants": {}, "example": "移除男子手中的花朵，保持男子本人、衣着、姿势与周围画面不变。输出一张编辑后的照片。", "preview": "https://developers.openai.com/images/platform/guides/image-prompting/man-with-no-flower-gpt-image-2-5-sunburst.webp", "result_label": "官方 Sunburst 示例", "images": [{"label": "官方输入 · 手持花朵的人物", "url": "https://developers.openai.com/images/platform/guides/image-prompting/man-with-blue-hat.webp"}, {"label": "官方输出 · Sunburst，使用官方原提示词", "url": "https://developers.openai.com/images/platform/guides/image-prompting/man-with-no-flower-gpt-image-2-5-sunburst.webp"}], "usage_note": "下方图片对应官方原提示词；本库中文模板是根据该任务整理的用法。"}, {"id": "C007", "title": "商品广告牌与天气修改", "path": "cases/C007-billboard-weather.md", "prompt": "图1为商品依据。制作一张{{环境}}中的广告牌写实效果图。广告牌中展示图1的商品，保持商品外形、颜色和原包装。新增广告文案仅为“{{广告短句}}”，出现一次，使用清晰的粗体无衬线字体，居中并留出边距。广告牌透视、现场光线和投影协调，不添加其他宣传语或水印。输出一张图片。", "inputs": "上传商品正面照片。准备一条已经确认的广告短句。下方洗发水图片可用于理解官方案例；自己的商品应使用自己的照片。", "task": "广告与详情", "product_category": "美妆与玻璃包装", "reference": "需要", "has_result": true, "kind": "明确2.5来源", "variants": {}, "example": "使用上传的洗发水商品照片，制作一张夕阳下高速公路旁广告牌的写实效果图。广告牌展示同一款洗发水，并且只出现一次文案“Fresh and clean”。文字使用清楚的粗体无衬线字体，居中排版，文字和背景对比明显。保留商品外观，不新增水印或其他标志。输出一张完整图片。", "preview": "https://developers.openai.com/images/platform/guides/image-prompting/billboard-gpt-image-2-5-sunburst.webp", "result_label": "官方 Sunburst 示例", "images": [{"label": "官方输入 · 洗发水商品照", "url": "https://developers.openai.com/images/platform/guides/image-prompting/shampoo.webp"}, {"label": "官方首轮输出 · Sunburst", "url": "https://developers.openai.com/images/platform/guides/image-prompting/billboard-gpt-image-2-5-sunburst.webp"}, {"label": "官方天气修改 · Sunburst", "url": "https://developers.openai.com/images/platform/guides/image-prompting/billboard-winter-gpt-image-2-5-sunburst.webp"}], "usage_note": "下方图片对应官方原提示词；本库中文模板是根据该任务整理的用法。"}, {"id": "C008", "title": "同一角色的16帧战斗精灵图", "path": "cases/C008-combat-sprite-sheet.md", "prompt": "以图1作为唯一角色外观参考，生成简洁像素画风格的战斗动作精灵图，4列4行，共16格。动作按从左到右、从上到下严格使用以下16项：{{16帧动作清单}}。\n所有格子保持同一角色的发型、衣服、鞋子、配饰与配色，使用{{固定视角与朝向}}，统一角色尺度和地面基线。每格一个完整角色，动作连贯，四肢与配件不得伸入相邻格；不为填满画格而改变角色大小。不添加文字、编号、边框或背景物品。采用清晰的小尺寸像素画视觉，透明背景，输出一张PNG静态精灵图。", "inputs": "上传一张完整角色图，头发、衣服、鞋子与四肢清楚可见，角色不要被裁切。示例使用同一角色和固定侧视方向，制作一张静态动作表。", "task": "人物与角色", "product_category": "非商品专项", "reference": "需要", "has_result": false, "kind": "作者自述2.5 · 中文扩写", "variants": {}, "example": "将上传角色转成简洁像素画风格的战斗动作精灵图，4列4行，共16格，按从左到右、从上到下排列。\n动作依次是：待机、防御、左拳蓄力、左拳伸出、左拳收回、右拳蓄力、右拳伸出、右拳收回、踢腿蓄力、踢腿伸出、踢腿收回、下蹲、前冲蓄力、向前突进、恢复站立、回到待机。\n每格只有同一角色，统一朝右的侧视角、相同角色尺度与地面基线。保留参考角色的发型、服装配色、鞋子和配饰，不在不同格换装。四肢完整留在各格内，拳脚伸展时也不能跨格。采用适合小尺寸显示的清晰像素轮廓，不加文字、编号、格线或场景道具。背景透明，输出一张PNG精灵图，不输出GIF。"}, {"id": "C009", "title": "实拍商品换场景", "path": "cases/C009-evolink-scene.md", "prompt": "编辑图1商品实拍照，仅将周围场景替换为{{场景描述}}。保持商品的外形、比例、实际包装颜色、瓶盖、标志、标签文字、材质与可见细节，不把商品改成来源示例中的黄色。沿用原商品机位和完整轮廓，使环境光、反光及接触阴影自然一致。不要重新设计、换标签、复制商品或让道具遮挡商品。输出一张图片。", "inputs": "上传一张商品完整、标签清楚的实拍照片；场景示例使用浴室台面，适合护肤品。其他商品请修改模板中的场景。", "task": "商品展示", "product_category": "美妆与玻璃包装", "reference": "需要", "has_result": true, "kind": "EvoLink自述2.5 · 中文改写", "variants": {}, "example": "编辑上传的护肤品实拍照片，只将商品周围环境换为干净的浅色浴室台面，远处是一条折叠白毛巾。保持商品原来的形状、比例、包装颜色、瓶盖、标志、标签文字和可见材质。商品位置和拍摄角度沿用原图；让新场景的光照与接触阴影自然协调。不要重新设计、改字、复制商品，也不要用道具遮住标签。输出一张图片。", "preview": "https://pub-62cf7640cd0f4066b60933bd2e9b85ef.r2.dev/github-repo-media/gpt-image-2-for-e-commerce/.codex/gpt-image-2.5-migration/media/bbe9236ef819e9d482d893771869c8e74f3f5f5bb1e3481dd5f5f620eb60988d.png", "result_label": "EvoLink提供的2.5示例", "images": [{"label": "EvoLink输入图", "url": "https://pub-62cf7640cd0f4066b60933bd2e9b85ef.r2.dev/github-repo-media/gpt-image-2-for-e-commerce/.codex/gpt-image-2.5-migration/media/1fce6dd6ef96719f1df31ca877454dcb01faa9c258f58196a35b5bffb3d82743.png"}, {"label": "EvoLink场景结果 1", "url": "https://pub-62cf7640cd0f4066b60933bd2e9b85ef.r2.dev/github-repo-media/gpt-image-2-for-e-commerce/.codex/gpt-image-2.5-migration/media/bbe9236ef819e9d482d893771869c8e74f3f 变商品、构图和背景。若新日期更长，优先在原文案区域内调整字距，不移动商品。", "inputs": "一张已有活动文案且包装字样清晰的商品图；准确旧日期和新日期。\n\n先替换所有双花括号变量，再发送。比例/尺寸还需在可配置的平台上实际设置，不能只写在提示词里。", "task": "局部编辑", "product_category": "通用品类", "reference": "需要", "has_result": false, "kind": "本库原创设计", "variants": {}}, {"id": "E004", "title": "一品三图各有用途", "path": "experiments/E004-product-series.md", "prompt": "本轮仅生成{{本轮图型}}这一张图片。商品主体依据图 A；图 B 仅在它确实展示对应细节时作为细节证据。商品的{{身份特征}}须保持一致。三种图型的要求分别是：清晰展示图采用简洁背景并完整呈现商品；使用环境图将商品放入{{真实使用场景}}；细节图只展示图 B 中已有的{{局部}}。现在只执行本轮图型，不拼接、不制作三宫格、不生成未经参考图确认的部位。", "inputs": "同一商品的清晰正面和已确认细节照片；不得靠模型虚构背面或内部结构。\n\n先替换所有双花括号变量，再发送。比例/尺寸还需在可配置的平台上实际设置，不能只写在提示词里。", "task": "商品展示", "product_category": "通用品类", "reference": "需要", "has_result": false, "kind": "本库原创设计", "variants": {}}, {"id": "E005", "title": "三轮返工保留已完成修改", "path": "experiments/E005-revision-chain.md", "prompt": "第一轮：把画面的环境背景调整为{{背景}}。商品、标题内容和相对位置保持不变。不要增加新的文案、物品或商品附件。", "inputs": "一张商品宣传图，商品与标题清晰；约定三个互不相同的编辑目标。\n\n先替换所有双花括号变量，再发送。比例/尺寸还需在可配置的平台上实际设置，不能只写在提示词里。", "task": "局部编辑", "product_category": "通用品类", "reference": "需要", "has_result": false, "kind": "本库原创设计", "variants": {}}, {"id": "E006", "title": "跨境文案与比例适配", "path": "experiments/E006-localization.md", "prompt": "把这张商品宣传图适配为{{目标比例}}。商品及其原包装内容以输入图为准，不修改包装上的文字或 Logo。仅替换画面额外添加的营销文案：标题为“{{已校对目标语言标题}}”，说明为“{{已校对目标语言说明}}”。保留标题、说明、商品的主次关系，根据目标比例重新安排空白与换行。不要自行翻译包装，不增加功能、规格、优惠或认证。", "inputs": "中文商品宣传图；由人确认的目标语言文案；目标横版或竖版比例。\n\n先替换所有双花括号变量，再发送。比例/尺寸还需在可配置的平台上实际设置，不能只写在提示词里。", "task": "局部编辑", "product_category": "通用品类", "reference": "需要", "has_result": false, "kind": "本库原创设计", "variants": {}}, {"id": "E007", "title": "已知信息的中文教学图", "path": "experiments/E007-teaching-diagram.md", "prompt": "为初学者制作一张中文教学图。内容只能来自以下四条：{{要点1}}；{{要点2}}；{{要点3}}；{{要点4}}。四个模块按照{{关系}}排列，每个模块用简洁图形配短标签。标题为“{{标题}}”。背景浅色，文字对比清楚，保持充分留白。不要添加第五个要点、无依据的因果箭头、数据或结论。", "inputs": "四条已确认知识要点和明确关系；不让模型独立提供事实。\n\n先替换所有双花括号变量，再发送。比例/尺寸还需在可配置的平台上实际设置，不能只写在提示词里。", "task": "信息图与排版", "product_category": "通用品类", "reference": "不需要", "has_result": false, "kind": "本库原创设计", "variants": {}}, {"id": "E008", "title": "草图控制标题与主体位置", "path": "experiments/E008-layout-sketch.md", "prompt": "图 A 是构图草图，只提供位置和大小关系，不把草图里的框线与标注文字画进成品。主体参考图 B，画面主题为{{主题}}，风格为{{风格}}。标题区写“{{标题}}”，主体放在草图指定区域，其余区域保留适当空白。不要添加草图未安排的角标、贴纸或边框。", "inputs": "一张自绘草图，明确标出标题区、主体区、留白；必须提供主体参考图B，与草图A分开上传。\n\n先替换所有双花括号变量，再发送。比例/尺寸还需在可配置的平台上实际设置，不能只写在提示词里。", "task": "局部编辑", "product_category": "通用品类", "reference": "需要", "has_result": false, "kind": "本库原创设计", "variants": {}}, {"id": "E009", "title": "同一主题的横竖封面", "path": "experiments/E009-editorial-cover.md", "prompt": "为“{{主题}}”设计一张{{本轮比例}}的封面。标题逐字为“{{标题}}”，只出现一次。核心视觉采用{{主体描述}}，配色保持{{配色}}。根据当前比例重新安排标题与主体，保留完整主体与足够边缘留白。若提供图 A，它仅规定{{参考图作用}}。不要添加第二标题、作者名、平台水印或额外解释。", "inputs": "确定主题、标题和自有参考视觉；两种目标比例。\n\n先替换所有双花括号变量，再发送。比例/尺寸还需在可配置的平台上实际设置，不能只写在提示词里。", "task": "海报与字体", "product_category": "通用品类", "reference": "可选", "has_result": false, "kind": "本库原创设计", "variants": {}}]</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),repo='https://github.com/wangge-dev/wangge-gpt-image-2-5/blob/main/';
for(const key of ['task','product_category'])for(const value of [...new Set(data.map(e=>e[key]))].sort())$(key).add(new Option(value,value));
function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function render(){const query=$('q').value.trim().toLowerCase(),list=data.filter(e=>(!query||[e.id,e.title,e.prompt,e.inputs].join(' ').toLowerCase().includes(query))&&['task','product_category','reference'].every(k=>!$(k).value||e[k]===$(k).value)&&(!$('result').value||e.has_result===($('result').value==='yes')));$('count').textContent=`${list.length} / ${data.length} 条提示词`;$('empty').hidden=!!list.length;$('cards').replaceChildren();for(const e of list){const a=el('article');if(e.preview){const img=el('img');img.loading='lazy';img.src=e.preview.startsWith('https://')?e.preview:'../'+e.preview;img.alt=e.title+(e.has_result?' · 生成示例':' · 原库参考');img.onerror=()=>{img.replaceWith(el('div','图片暂时无法加载','placeholder'))};a.append(img)}else a.append(el('div',e.product_category,'placeholder'));const b=el('div',null,'body');b.append(el('span',`${e.id} · ${e.has_result?(e.result_label||'生成示例'):e.preview?'原库参考图':'暂无生成示例'}`,'tag'),el('h2',e.title),el('p',e.use||e.task,'muted'));const button=el('button','打开提示词');button.onclick=()=>open(e);b.append(button);a.append(b);$('cards').append(a)}}
let selected=null;function open(e,updateUrl=true){selected=e;$('title').textContent=e.title;$('kind').textContent=e.kind;$('inputs').textContent=e.inputs;$('note').textContent=e.usage_note||'';$('source').href=repo+e.path;$('examples').replaceChildren();const assets=e.images?.length?e.images:e.preview?[{url:e.preview.startsWith('https://')?e.preview:'../'+e.preview,label:e.has_result?(e.result_label||'生成示例'):'原库参考'}]:[];for(const asset of assets){const figure=el('figure'),button=el('button'),img=el('img');button.type='button';button.setAttribute('aria-label','放大：'+asset.label);img.src=asset.url;img.alt=asset.label;img.loading='lazy';button.append(img);button.onclick=()=>{$('large-image').src=asset.url;$('large-image').alt=asset.label;$('large-caption').textContent=asset.label;$('lightbox').showModal()};img.onerror=()=>{button.replaceWith(el('p','图片暂时无法加载，请打开来源查看。'))};figure.append(button,el('figcaption',asset.label));$('examples').append(figure)}$('version').replaceChildren();if(e.example)$('version').add(new Option('具体示例 · 准备素材后直接复制','example'));$('version').add(new Option('完整提示词 · 变量模板','prompt'));for(const key of Object.keys(e.variants||{}))$('version').add(new Option(key,'variant:'+key));showPrompt();if(!$('detail').open)$('detail').showModal();if(updateUrl){const u=new URL(location.href);u.searchParams.set('case',e.id);history.pushState(null,'',u)}}
function showPrompt(){const v=$('version').value;$('inputs').textContent=v==='example'?(selected.example_inputs||selected.inputs):selected.inputs;$('prompt').textContent=v.startsWith('variant:')?selected.variants[v.slice(8)]:selected[v];$('status').textContent=''}
$('version').onchange=showPrompt;$('close').onclick=closeDetail;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').textContent);$('status').textContent='已复制，可粘贴到图像生成工具。'}catch{const range=document.createRange();range.selectNodeContents($('prompt'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('status').textContent='浏览器未允许自动复制。正文已选中，请按 Ctrl+C 或长按复制。'}};
for(const id of ['q','task','product_category','reference','result'])$(id).addEventListener('input',render);$('reset').onclick=()=>{for(const id of ['q','task','product_category','reference','result'])$(id).value='';render()};render();
function closeDetail(){if($('lightbox').open)$('lightbox').close();$('detail').close();const u=new URL(location.href);u.searchParams.delete('case');history.replaceState(null,'',u)}
$('detail').addEventListener('cancel',e=>{e.preventDefault();closeDetail()});
$('close-image').onclick=()=>$('lightbox').close();
$('share').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('case',selected.id);try{await navigator.clipboard.writeText(u.href);$('status').textContent='案例链接已复制。'}catch{$('status').replaceChildren(el('span','复制此链接：'));const a=el('a',u.href);a.id='share-link';a.href=u.href;$('status').append(a)}};
function fromUrl(){const e=data.find(e=>e.id===new URL(location.href).searchParams.get('case'));if($('lightbox').open)$('lightbox').close();if(e)open(e,false);else if($('detail').open)$('detail').close()}
window.addEventListener('popstate',fromUrl);fromUrl();
</script></html>
