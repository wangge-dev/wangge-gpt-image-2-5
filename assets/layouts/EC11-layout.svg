<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1415" viewBox="0 0 960 1415" role="img" aria-labelledby="title desc">
  <title id="title">EC11 卖点信息图与详情页模块构图示意</title>
  <desc id="desc">内部商品55%／留白10%／文案35%；卖点只排实际批准的1–3组，不补空项。抽象区域不是商品、人物或模型实测。</desc>
  <rect width="960" height="1415" fill="#faf7f2"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#111111">
    <text x="48" y="60" font-size="32" font-weight="700">EC11 · 卖点信息图与详情页模块</text>
    <text x="48" y="107" font-size="28" fill="#5a5a5a">本库构图示意 · 非实测成图</text>
    <rect x="60" y="160" width="840" height="1050" rx="8" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <rect x="110.4" y="223" width="739.2" height="924" fill="none" stroke="#79716a" stroke-width="2" stroke-dasharray="12 10"/>
    <rect x="320.4" y="254.5" width="319.2" height="451.5" rx="14" fill="#ffe2db" stroke="#111111" stroke-width="4"/>
    <text x="480" y="490.25" font-size="29" text-anchor="middle" font-weight="700">商品主区 · 55%</text>
    <rect x="118.8" y="828.85" width="722.4" height="299.25" rx="14" fill="#faf7f2" stroke="#b5ada4" stroke-width="2"/>
    <text x="480" y="969.48" font-size="27" text-anchor="middle" font-weight="400">短标题 → 一句解释</text>
    <text x="480" y="1007.48" font-size="27" text-anchor="middle" font-weight="400">按实际1–3组排版</text>
    <text x="48" y="1270" font-size="27">内部商品55%／留白10%／文案35%</text>
    <text x="48" y="1316" font-size="27">卖点只排实际批准的1–3组，不补空项</text>
    <text x="48" y="1362" font-size="25" fill="#5a5a5a">区域、框线与说明是教学标记，不进入成图。</text>
  </g>
</svg>
