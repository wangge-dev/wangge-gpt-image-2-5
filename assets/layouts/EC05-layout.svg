<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1320" viewBox="0 0 960 1320" role="img" aria-labelledby="title desc">
  <title id="title">EC05 中文促销海报构图示意</title>
  <desc id="desc">四比五画布，百分之六安全边距，可用区内部标题百分之二十二、商品百分之五十三、价格条件与行动百分之二十五。价格与条件相邻，未批准则省略。本库原创示意，不是实测。</desc>
  <rect width="960" height="1320" fill="#faf7f2"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#111111">
    <text x="48" y="60" font-size="36" font-weight="700">EC05 · 中文促销海报</text>
    <text x="48" y="107" font-size="28" fill="#5a5a5a">本库构图示意 · 非实测成图</text>
    <rect x="60" y="160" width="840" height="1050" rx="8" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <rect x="110.4" y="223" width="739.2" height="924" fill="none" stroke="#79716a" stroke-width="3" stroke-dasharray="12 10"/>
    <rect x="114" y="227" width="732" height="199" fill="#faf7f2"/>
    <text x="480" y="278" text-anchor="middle" font-size="26" fill="#5a5a5a">6% 安全边距 · 内部区域比例</text>
    <text x="480" y="341" text-anchor="middle" font-size="40" font-weight="700">① 批准标题 · 22%</text>
    <text x="480" y="392" text-anchor="middle" font-size="28">副标题有则写，无则留白</text>
    <rect x="294" y="470" width="372" height="374" rx="36" fill="#ffe2db" stroke="#111111" stroke-width="4"/>
    <text x="480" y="605" text-anchor="middle" font-size="44" font-weight="700">② 商品区</text>
    <text x="480" y="665" text-anchor="middle" font-size="32">区域 53%</text>
    <text x="480" y="725" text-anchor="middle" font-size="27">单件 · 原角度 · 原比例</text>
    <path d="M310 866 Q480 884 650 866" fill="none" stroke="#79716a" stroke-width="6"/>
    <rect x="130" y="923" width="700" height="207" rx="16" fill="#faf7f2" stroke="#111111" stroke-width="2"/>
    <text x="480" y="973" text-anchor="middle" font-size="32" font-weight="700">③ 价格 + 必要条件</text>
    <text x="480" y="1022" text-anchor="middle" font-size="26">相邻可读，不填假金额或折扣</text>
    <text x="480" y="1073" text-anchor="middle" font-size="29" font-weight="700">④ 行动文字 · 下段合计 25%</text>
    <text x="480" y="1110" text-anchor="middle" font-size="24">段间留白已计入，不额外叠加高度</text>
    <text x="480" y="1264" text-anchor="middle" font-size="28">没有批准价格 → 省略价格与条件，保留留白</text>
  </g>
</svg>
