    <ellipse cx="219.6" cy="898.31" rx="33.6" ry="35.05362" fill="#faf7f2" stroke="#79716a" stroke-width="3"/>
    <rect x="135.6" y="945.88" width="168" height="162.75" rx="14" fill="#faf7f2" stroke="#b5ada4" stroke-width="2"/>
    <text x="219.6" y="1052.5" font-size="26" text-anchor="middle" font-weight="400">人物</text>
