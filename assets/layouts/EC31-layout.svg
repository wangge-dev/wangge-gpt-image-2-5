<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1415" viewBox="0 0 960 1415" role="img" aria-labelledby="title desc">
  <title id="title">EC31 中文长详情页单模块系列构图示意</title>
  <desc id="desc">默认首屏：标题左上、商品右下，一轮一模块；后续继承同一批准母版，不沿上一稿漂移。抽象区域不是商品、人物或模型实测。</desc>
  <rect width="960" height="1415" fill="#faf7f2"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#111111">
    <text x="48" y="60" font-size="32" font-weight="700">EC31 · 中文长详情页单模块系列</text>
    <text x="48" y="107" font-size="28" fill="#5a5a5a">本库构图示意 · 非实测成图</text>
    <rect x="60" y="160" width="840" height="1050" rx="8" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <rect x="127.2" y="244" width="705.6" height="882" fill="none" stroke="#79716a" stroke-width="2" stroke-dasharray="12 10"/>
    <rect x="144" y="275.5" width="604.8" height="231" rx="14" fill="#faf7f2" stroke="#b5ada4" stroke-width="2"/>
    <text x="446.4" y="401" font-size="27" text-anchor="middle" font-weight="400">标题 → 批准短说明</text>
    <rect x="370.8" y="569.5" width="411.6" height="535.5" rx="14" fill="#ffe2db" stroke="#111111" stroke-width="4"/>
    <text x="576.6" y="828.25" font-size="29" text-anchor="middle" font-weight="700">商品右下</text>
    <text x="576.6" y="866.25" font-size="29" text-anchor="middle" font-weight="700">内部高不超60%</text>
    <text x="48" y="1270" font-size="27">默认首屏：标题左上、商品右下，一轮一模块</text>
    <text x="48" y="1316" font-size="27">后续继承同一批准母版，不沿上一稿漂移</text>
    <text x="48" y="1362" font-size="25" fill="#5a5a5a">区域、框线与说明是教学标记，不进入成图。</text>
  </g>
</svg>
