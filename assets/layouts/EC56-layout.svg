<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1415" viewBox="0 0 960 1415" role="img" aria-labelledby="title desc">
  <title id="title">EC56 配料丰盛构图与包装垂直阅读通道构图示意</title>
  <desc id="desc">中央通道至少38%，且随包装宽度扩大；外围只摆有证据食材；缺材料用无配料版。抽象区域不是商品、人物或模型实测。</desc>
  <rect width="960" height="1415" fill="#faf7f2"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#111111">
    <text x="48" y="60" font-size="32" font-weight="700">EC56 · 配料丰盛构图与包装垂直阅读通道</text>
    <text x="48" y="107" font-size="28" fill="#5a5a5a">本库构图示意 · 非实测成图</text>
    <rect x="60" y="160" width="840" height="1050" rx="8" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <rect x="110.4" y="223" width="739.2" height="924" fill="none" stroke="#79716a" stroke-width="2" stroke-dasharray="12 10"/>
    <rect x="110.4" y="223" width="739.2" height="165.9" rx="14" fill="#faf7f2" stroke="#b5ada4" stroke-width="2"/>
    <text x="480" y="315.95" font-size="27" text-anchor="middle" font-weight="400">短标题区</text>
    <rect x="295.2" y="438.25" width="369.6" height="682.5" rx="14" fill="#faf7f2" stroke="#b5ada4" stroke-width="2"/>
    <text x="480" y="789.5" font-size="27" text-anchor="middle" font-weight="400">中央保护通道</text>
    <rect x="341.4" y="522.25" width="277.2" height="598.5" rx="14" fill="#ffe2db" stroke="#111111" stroke-width="4"/>
    <text x="480" y="831.5" font-size="29" text-anchor="middle" font-weight="700">完整包装</text>
    <rect x="118.8" y="653.5" width="142.8" height="315" rx="14" fill="#faf7f2" stroke="#b5ada4" stroke-width="2"/>
    <text x="190.2" y="802" font-size="27" text-anchor="middle" font-weight="400">批准</text>
    <text x="190.2" y="840" font-size="27" text-anchor="middle" font-weight="400">食材</text>
    <rect x="698.4" y="653.5" width="142.8" height="315" rx="14" fill="#faf7f2" stroke="#b5ada4" stroke-width="2"/>
    <text x="769.8" y="802" font-size="27" text-anchor="middle" font-weight="400">批准</text>
    <text x="769.8" y="840" font-size="27" text-anchor="middle" font-weight="400">食材</text>
    <text x="48" y="1270" font-size="27">中央通道至少38%，且随包装宽度扩大</text>
    <text x="48" y="1316" font-size="27">外围只摆有证据食材；缺材料用无配料版</text>
    <text x="48" y="1362" font-size="25" fill="#5a5a5a">区域、框线与说明是教学标记，不进入成图。</text>
