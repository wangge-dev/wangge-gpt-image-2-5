<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1320" viewBox="0 0 960 1320" role="img" aria-labelledby="title desc">
  <title id="title">EC50 详情首屏构图示意</title>
  <desc id="desc">四比五画布，百分之八安全边距，上方标题和副标题，中间商品区域，底部单一批准利益点。利益点缺证据时使用无利益点分支。仅为本库线框示意。</desc>
  <rect width="960" height="1320" fill="#faf7f2"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#111111">
    <text x="48" y="60" font-size="36" font-weight="700">EC50 · 详情页首屏</text>
    <text x="48" y="107" font-size="28" fill="#5a5a5a">本库构图示意 · 非实测成图</text>
    <rect x="60" y="160" width="840" height="1050" rx="8" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <rect x="127.2" y="244" width="705.6" height="882" fill="none" stroke="#79716a" stroke-width="3" stroke-dasharray="12 10"/>
    <text x="150" y="287" font-size="26" fill="#5a5a5a">8% 安全边距</text>
    <text x="156" y="336" font-size="46" font-weight="700">① 批准标题</text>
    <text x="156" y="387" font-size="30">副标题 · 不挤商品</text>
    <rect x="322" y="454" width="380" height="460" rx="36" fill="#ffe2db" stroke="#111111" stroke-width="4"/>
    <text x="512" y="634" text-anchor="middle" font-size="44" font-weight="700">② 商品区</text>
    <text x="512" y="694" text-anchor="middle" font-size="30">原角度 · 等比例</text>
    <text x="512" y="747" text-anchor="middle" font-size="26">不把页面文案印到商品上</text>
    <path d="M330 940 Q512 958 695 940" fill="none" stroke="#79716a" stroke-width="6"/>
    <rect x="156" y="1010" width="648" height="92" rx="16" fill="#faf7f2"/>
    <text x="480" y="1068" text-anchor="middle" font-size="34" font-weight="700">③ 一条有证据的利益点</text>
    <text x="480" y="1264" text-anchor="middle" font-size="28">无利益点证据 → 使用无利益点分支</text>
  </g>
</svg>
