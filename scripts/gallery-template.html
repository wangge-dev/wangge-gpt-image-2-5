<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>旺哥 · Image 2.5 提示词画廊</title>
<style>
:root{--canvas:#ffffff;--paper:#faf7f2;--ink:#111111;--mute:#5a5a5a;--line:#ebe6dd;--accent:#fd9b9b;--tint:#ffe2db}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:32px 24px}a{color:inherit}header{padding:24px 0;border-bottom:2px solid var(--ink)}h1{font-size:clamp(28px,5vw,48px);line-height:1.2;margin:16px 0}p{margin:12px 0}.muted{color:var(--mute)}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}.search{grid-column:1/-1}label{display:flex;flex-direction:column;gap:6px}input,select,button{font:inherit;min-height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--canvas);color:var(--ink);padding:8px 12px;max-width:100%}button{cursor:pointer}button:hover{background:var(--paper)}button:active{transform:translateY(2px)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent)}.bar{display:flex;gap:16px;align-items:center;justify-content:space-between;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}article img{width:100%;height:230px;object-fit:contain;background:var(--paper)}.placeholder{height:150px;background:var(--paper);display:flex;align-items:center;padding:24px;font-size:22px}.body{padding:20px;display:flex;flex-direction:column;flex:1}.body h2{font-size:20px;margin:8px 0}.body button{margin-top:auto}.tag{font-size:14px;color:var(--mute)}dialog{width:min(820px,calc(100% - 24px));max-height:90vh;border:2px solid var(--ink);border-radius:12px;padding:24px;background:var(--canvas);color:var(--ink)}#examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}#examples figure{margin:0}#examples img{width:100%;height:180px;object-fit:contain;background:var(--paper)}#examples figcaption{font-size:14px;color:var(--mute)}dialog::backdrop{background:color-mix(in srgb,var(--ink) 45%,transparent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);padding:20px;font:16px/1.8 system-ui;max-height:45vh;overflow:auto}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.actions a{padding:10px}.empty{padding:40px 0}#inputs{white-space:pre-wrap}#status{min-height:28px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:20px 16px}.grid{grid-template-columns:1fr}.bar{align-items:start}dialog{padding:16px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
.start{padding:20px 0 8px}.start h2{font-size:22px;margin:8px 0}.entries{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.entries button[aria-pressed="true"]{background:var(--tint);border-color:var(--ink)}#entry-note{min-height:28px}#examples{grid-template-columns:repeat(2,minmax(0,1fr))}#examples button{width:100%;padding:0;border:0;background:transparent}#lightbox{width:min(1200px,calc(100% - 24px))}#large-image{display:block;max-width:100%;max-height:72vh;margin:auto;object-fit:contain}#share-link{overflow-wrap:anywhere}#examples img{cursor:zoom-in}@media(max-width:520px){#examples img{height:150px}#examples figcaption{font-size:12px}}</style>
<main><header><a href="https://github.com/wangge-dev/wangge-gpt-image-2-5">wangge-gpt-image-2-5 ↗</a><h1>找到想做的图。<br>复制一段，开始创作。</h1><p class="muted">Image 2.5 中文提示词 · 电商、人物与图像编辑</p></header>
<section class="start" aria-labelledby="start-title"><h2 id="start-title">先做一张能用的商品图</h2><p>只有商品图 → <a href="?case=EC01" data-case="EC01">白底主图</a>；有审定卖点 → <a href="?case=EC11" data-case="EC11">详情模块</a>；有文案、价格和活动规则 → <a href="?case=EC52" data-case="EC52">活动主视觉</a>。</p><p class="muted">每次选一张，准备材料后复制完整正文。<a href="https://github.com/wangge-dev/wangge-gpt-image-2-5/blob/main/ecommerce/start-here.md">按现有素材选最短路径 ↗</a></p></section>
<nav id="entries" class="entries" aria-label="按成片用途选择入口"></nav><p id="entry-note" class="muted"></p>
<section class="filters" aria-label="查找提示词"><label class="search">在当前入口中搜索<input id="q" type="search" placeholder="试试：主图、食品、包装文字；其他任务可切换全部提示词"></label><label>任务<select id="task"><option value="">全部任务</option></select></label><label>品类<select id="product_category"><option value="">全部品类</option></select></label><label>参考图<select id="reference"><option value="">全部</option><option>需要</option><option>不需要</option><option>可选</option><option>按卡片说明</option></select></label><label>生成示例<select id="result"><option value="">全部</option><option value="yes">有生成示例</option><option value="no">暂无生成示例</option></select></label></section>
<div class="bar"><p id="count" aria-live="polite"></p><button id="reset">清空筛选</button></div><div id="cards" class="grid"></div><p id="empty" class="empty" hidden>没有找到匹配提示词。试试减少筛选条件，或换一个关键词。</p><noscript>请启用JavaScript使用筛选，也可从GitHub仓库打开Markdown提示词索引。</noscript></main>
<dialog id="detail" aria-labelledby="title"><div class="bar"><h2 id="title"></h2><button id="close" aria-label="关闭详情">关闭</button></div><p id="kind" class="tag"></p><div id="examples"></div><h3>准备材料</h3><p id="inputs"></p><label>选择要复制的正文<select id="version"></select></label><pre id="prompt" tabindex="0"></pre><p id="note" class="muted"></p><div class="actions"><button id="share">复制案例链接</button><button id="copy" class="primary">复制提示词</button><a id="source">完整卡片与来源 ↗</a></div><p id="status" aria-live="polite"></p></dialog>
<dialog id="lightbox" aria-label="图片放大"><button id="close-image">关闭大图</button><p id="large-caption"></p><img id="large-image" alt=""></dialog>
<script id="data" type="application/json">__PROMPT_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),repo='https://github.com/wangge-dev/wangge-gpt-image-2-5/blob/main/';
const entries=[
 ['高频成片','高频成片',`精选${data.filter(e=>e.featured).length}张常用成片卡。先按素材选任务；结构与资料核对在独立入口。`],
 ['主图成片','主图','白底、列表缩略图、真实SKU与套装陈列。'],
 ['场景成片','场景','商品身份与人物、空间、氛围参考分开。'],
 ['详情成片','详情','首屏、卖点、规格与说明模块；只排已审定的事实。'],
 ['活动成片','活动','活动标题、商品、价格与行动区；先确认文案和规则。'],
 ['编辑与一致性','编辑与一致性','已有成片的局部改字、换景、比例适配与系列编辑。'],
 ['商业创意','商业创意','有商品或品牌用途的创意方向；概念与真实事实分开。'],
 ['结构与资料核对','结构核对','按已有证据核对部件、资料与状态，不作为默认成片制作清单。'],
 ['','全部提示词','包括人物、空间、信息图及其他任务；可叠加品类和任务筛选。']
];
const entryFromUrl=()=>{const value=new URL(location.href).searchParams.get('entry');return value==='all'?'':entries.some(([key])=>key===value)?value:'高频成片'};
let currentEntry=entryFromUrl();
function inEntry(e){return !currentEntry||(currentEntry==='高频成片'?e.featured:e.entry===currentEntry)}
function chooseEntry(value){currentEntry=value;const u=new URL(location.href);u.searchParams.set('entry',value||'all');history.replaceState(null,'',u);render()}
for(const [key,label] of entries){const button=el('button',label);button.type='button';button.dataset.entry=key;button.onclick=()=>chooseEntry(key);$('entries').append(button)}
for(const a of document.querySelectorAll('[data-case]'))a.onclick=event=>{event.preventDefault();open(data.find(e=>e.id===a.dataset.case))};

for(const key of ['task','product_category'])for(const value of [...new Set(data.map(e=>e[key]))].sort())$(key).add(new Option(value,value));
function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function render(){const query=$('q').value.trim().toLowerCase(),list=data.filter(e=>inEntry(e)&&(!query||[e.id,e.title,e.use,e.task,e.product_category,e.entry,e.prompt,e.inputs].join(' ').toLowerCase().includes(query))&&['task','product_category','reference'].every(k=>!$(k).value||e[k]===$(k).value)&&(!$('result').value||e.has_result===($('result').value==='yes')));for(const button of $('entries').children)button.setAttribute('aria-pressed',String(button.dataset.entry===currentEntry));$('entry-note').textContent=entries.find(([key])=>key===currentEntry)[2];$('count').textContent=`${list.length} / ${data.length} 条提示词`;$('empty').hidden=!!list.length;$('cards').replaceChildren();for(const e of list){const a=el('article');if(e.preview){const img=el('img');img.loading='lazy';img.src=e.preview.startsWith('https://')?e.preview:'../'+e.preview;img.alt=e.title+(e.preview_kind==='layout_diagram'?' · 本库构图示意 · 非实测成图':e.has_result?' · 生成示例':' · 原库参考');img.onerror=()=>{img.replaceWith(el('div','图片暂时无法加载','placeholder'))};a.append(img)}else a.append(el('div',e.product_category,'placeholder'));const b=el('div',null,'body');b.append(el('span',`${e.id} · ${e.preview_kind==='layout_diagram'?'本库构图示意 · 非实测成图':e.has_result?(e.result_label||'生成示例'):e.preview?'原库参考图':'暂无生成示例'}`,'tag'),el('span',`${e.entry} · ${e.product_category}`,'tag'),el('h2',e.title),el('p',e.use||e.task,'muted'));const button=el('button','打开提示词');button.onclick=()=>open(e);b.append(button);a.append(b);$('cards').append(a)}}
let selected=null;function open(e,updateUrl=true){selected=e;$('title').textContent=e.title;$('kind').textContent=e.kind;$('inputs').textContent=e.inputs;$('note').textContent=e.usage_note||'';$('source').href=repo+e.path;$('examples').replaceChildren();const assets=e.images?.length?e.images:e.preview?[{url:e.preview.startsWith('https://')?e.preview:'../'+e.preview,label:e.preview_kind==='layout_diagram'?'本库构图示意 · 非实测成图':e.has_result?(e.result_label||'生成示例'):'原库参考'}]:[];for(const asset of assets){const figure=el('figure'),button=el('button'),img=el('img');button.type='button';button.setAttribute('aria-label','放大：'+asset.label);img.src=asset.url;img.alt=asset.label;img.loading='lazy';button.append(img);button.onclick=()=>{$('large-image').src=asset.url;$('large-image').alt=asset.label;$('large-caption').textContent=asset.label;$('lightbox').showModal()};img.onerror=()=>{button.replaceWith(el('p','图片暂时无法加载，请打开来源查看。'))};figure.append(button,el('figcaption',asset.label));$('examples').append(figure)}$('version').replaceChildren();if(e.example)$('version').add(new Option('具体示例 · 准备素材后直接复制','example'));$('version').add(new Option('完整提示词 · 变量模板','prompt'));for(const key of Object.keys(e.variants||{}))$('version').add(new Option(key,'variant:'+key));showPrompt();if(!$('detail').open)$('detail').showModal();if(updateUrl){const u=new URL(location.href);u.searchParams.set('case',e.id);history.pushState(null,'',u)}}
function showPrompt(){const v=$('version').value;$('inputs').textContent=v==='example'?(selected.example_inputs||selected.inputs):selected.inputs;$('prompt').textContent=v.startsWith('variant:')?selected.variants[v.slice(8)]:selected[v];$('status').textContent=''}
$('version').onchange=showPrompt;$('close').onclick=closeDetail;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').textContent);$('status').textContent='已复制，可粘贴到图像生成工具。'}catch{const range=document.createRange();range.selectNodeContents($('prompt'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('status').textContent='浏览器未允许自动复制。正文已选中，请按 Ctrl+C 或长按复制。'}};
for(const id of ['q','task','product_category','reference','result'])$(id).addEventListener('input',render);$('reset').onclick=()=>{for(const id of ['q','task','product_category','reference','result'])$(id).value='';chooseEntry('')};render();
function closeDetail(){if($('lightbox').open)$('lightbox').close();$('detail').close();const u=new URL(location.href);u.searchParams.delete('case');history.replaceState(null,'',u)}
$('detail').addEventListener('cancel',e=>{e.preventDefault();closeDetail()});
$('close-image').onclick=()=>$('lightbox').close();
$('share').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('case',selected.id);try{await navigator.clipboard.writeText(u.href);$('status').textContent='案例链接已复制。'}catch{$('status').replaceChildren(el('span','复制此链接：'));const a=el('a',u.href);a.id='share-link';a.href=u.href;$('status').append(a)}};
function fromUrl(){currentEntry=entryFromUrl();render();const e=data.find(e=>e.id===new URL(location.href).searchParams.get('case'));if($('lightbox').open)$('lightbox').close();if(e)open(e,false);else if($('detail').open)$('detail').close()}
window.addEventListener('popstate',fromUrl);fromUrl();
</script></html>
