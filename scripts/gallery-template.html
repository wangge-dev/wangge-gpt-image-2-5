<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>旺哥 · Image 2.5 提示词画廊</title>
<style>
:root{--canvas:#ffffff;--paper:#faf7f2;--ink:#111111;--mute:#5a5a5a;--line:#ebe6dd;--accent:#fd9b9b;--tint:#ffe2db}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:32px 24px}a{color:inherit}header{padding:24px 0;border-bottom:2px solid var(--ink)}h1{font-size:clamp(28px,5vw,48px);line-height:1.2;margin:16px 0}p{margin:12px 0}.muted{color:var(--mute)}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}.search{grid-column:1/-1}label{display:flex;flex-direction:column;gap:6px}input,select,button{font:inherit;min-height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--canvas);color:var(--ink);padding:8px 12px;max-width:100%}button{cursor:pointer}button:hover{background:var(--paper)}button:active{transform:translateY(2px)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent)}.bar{display:flex;gap:16px;align-items:center;justify-content:space-between;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}article img{width:100%;height:230px;object-fit:contain;background:var(--paper)}.placeholder{height:150px;background:var(--paper);display:flex;align-items:center;padding:24px;font-size:22px}.body{padding:20px;display:flex;flex-direction:column;flex:1}.body h2{font-size:20px;margin:8px 0}.body button{margin-top:auto}.tag{font-size:14px;color:var(--mute)}dialog{width:min(820px,calc(100% - 24px));max-height:90vh;border:2px solid var(--ink);border-radius:12px;padding:24px;background:var(--canvas);color:var(--ink)}dialog::backdrop{background:color-mix(in srgb,var(--ink) 45%,transparent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);padding:20px;font:16px/1.8 system-ui;max-height:45vh;overflow:auto}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.actions a{padding:10px}.empty{padding:40px 0}#inputs{white-space:pre-wrap}#status{min-height:28px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:20px 16px}.grid{grid-template-columns:1fr}.bar{align-items:start}dialog{padding:16px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
<main><header><a href="https://github.com/wangge-dev/wangge-gpt-image-2-5">wangge-gpt-image-2-5 ↗</a><h1>找到想做的图。<br>复制一段，开始创作。</h1><p class="muted">Image 2.5 中文提示词 · 电商、人物与图像编辑</p></header>
<section class="filters" aria-label="查找提示词"><label class="search">搜索<input id="q" type="search" placeholder="试试：玻璃、印花、换装、包装文字"></label><label>任务<select id="task"><option value="">全部任务</option></select></label><label>品类<select id="product_category"><option value="">全部品类</option></select></label><label>参考图<select id="reference"><option value="">全部</option><option>需要</option><option>不需要</option><option>可选</option><option>按卡片说明</option></select></label><label>生成示例<select id="result"><option value="">全部</option><option value="yes">有生成示例</option><option value="no">暂无生成示例</option></select></label></section>
<div class="bar"><p id="count" aria-live="polite"></p><button id="reset">清空筛选</button></div><div id="cards" class="grid"></div><p id="empty" class="empty" hidden>没有找到匹配提示词。试试减少筛选条件，或换一个关键词。</p><noscript>请启用JavaScript使用筛选，也可从GitHub仓库打开Markdown提示词索引。</noscript></main>
<dialog id="detail" aria-labelledby="title"><div class="bar"><h2 id="title"></h2><button id="close" aria-label="关闭详情">关闭</button></div><p id="kind" class="tag"></p><h3>准备材料</h3><p id="inputs"></p><label>选择要复制的正文<select id="version"></select></label><pre id="prompt" tabindex="0"></pre><p id="note" class="muted"></p><div class="actions"><button id="copy" class="primary">复制提示词</button><a id="source">完整卡片与来源 ↗</a></div><p id="status" aria-live="polite"></p></dialog>
<script id="data" type="application/json">__PROMPT_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),repo='https://github.com/wangge-dev/wangge-gpt-image-2-5/blob/main/';
for(const key of ['task','product_category'])for(const value of [...new Set(data.map(e=>e[key]))].sort())$(key).add(new Option(value,value));
function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function render(){const query=$('q').value.trim().toLowerCase(),list=data.filter(e=>(!query||[e.id,e.title,e.prompt,e.inputs].join(' ').toLowerCase().includes(query))&&['task','product_category','reference'].every(k=>!$(k).value||e[k]===$(k).value)&&(!$('result').value||e.has_result===($('result').value==='yes')));$('count').textContent=`${list.length} / ${data.length} 条提示词`;$('empty').hidden=!!list.length;$('cards').replaceChildren();for(const e of list){const a=el('article');if(e.preview){const img=el('img');img.loading='lazy';img.src=e.preview.startsWith('https://')?e.preview:'../'+e.preview;img.alt=e.title+(e.has_result?' · 生成示例':' · 原库参考');img.onerror=()=>{img.replaceWith(el('div','图片暂时无法加载','placeholder'))};a.append(img)}else a.append(el('div',e.product_category,'placeholder'));const b=el('div',null,'body');b.append(el('span',`${e.id} · ${e.has_result?(e.result_label||'生成示例'):e.preview?'原库参考图':'暂无生成示例'}`,'tag'),el('h2',e.title),el('p',e.use||e.task,'muted'));const button=el('button','打开提示词');button.onclick=()=>open(e);b.append(button);a.append(b);$('cards').append(a)}}
let selected=null;function open(e){selected=e;$('title').textContent=e.title;$('kind').textContent=e.kind;$('inputs').textContent=e.inputs;$('note').textContent=e.usage_note||'';$('source').href=repo+e.path;$('version').replaceChildren();if(e.example)$('version').add(new Option('具体示例 · 准备素材后直接复制','example'));$('version').add(new Option('完整提示词 · 变量模板','prompt'));for(const key of Object.keys(e.variants||{}))$('version').add(new Option(key,'variant:'+key));showPrompt();$('detail').showModal()}
function showPrompt(){const v=$('version').value;$('inputs').textContent=v==='example'?(selected.example_inputs||selected.inputs):selected.inputs;$('prompt').textContent=v.startsWith('variant:')?selected.variants[v.slice(8)]:selected[v];$('status').textContent=''}
$('version').onchange=showPrompt;$('close').onclick=()=>$('detail').close();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').textContent);$('status').textContent='已复制，可粘贴到图像生成工具。'}catch{const range=document.createRange();range.selectNodeContents($('prompt'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('status').textContent='浏览器未允许自动复制。正文已选中，请按 Ctrl+C 或长按复制。'}};
for(const id of ['q','task','product_category','reference','result'])$(id).addEventListener('input',render);$('reset').onclick=()=>{for(const id of ['q','task','product_category','reference','result'])$(id).value='';render()};render();
</script></html>
